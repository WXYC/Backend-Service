  /library/info:
    get:
      summary: Get album information
      description: >
        Takes exactly one release identifier, in either id space: `album_id`
        (Backend's serial `wxyc_schema.library.id`) or `legacy_release_id` (the
        tubafrenzy `LIBRARY_RELEASE.ID` that external callers hold). Neither is
        required on its own; the server returns 400 only when both are absent.


        `legacy_release_id` wins whenever it is *present* — the server branches
        on presence, before looking at `album_id`. That includes an empty
        `legacy_release_id=`, which takes the branch and 400s even alongside a
        valid `album_id`; a malformed value there is likewise a 400, never a
        fallback (BS#1880).


        The two branches now agree on a miss as well: either unmatched
        identifier is a 404. For `legacy_release_id` that means a library.db
        release not yet synced into Backend Postgres; for `album_id`, no such
        serial. The `album_id` miss was a 200 with an empty body until BS#2212.
      parameters:
        - name: album_id
          in: query
          required: false
          description: >-
            Backend's serial `wxyc_schema.library.id`. Optional: supply this or
            `legacy_release_id`, not both. Parsed strictly, like the sibling
            below and like every `/library/{id}` route: a positive int4 in
            canonical form. Trailing garbage (`65880xyz`), leading zeros, an
            explicit sign, whitespace, and a repeated param are each a 400 —
            never a truncated id resolving a different real release, which is
            what a bare `parseInt` did before BS#2212.
          schema:
            type: integer
        - name: legacy_release_id
          in: query
          required: false
          description: >-
            The release's tubafrenzy `LIBRARY_RELEASE.ID` — Backend's
            `library.legacy_release_id` column, and the id space external
            callers hold (LML's `library_url`, the request line, the wxyc.info
            permalink). This is the inbound-compatibility front door: it is NOT
            Backend's serial `library.id`, and the two spaces are numerically
            coextensive, so passing one where the other belongs resolves a
            different real release rather than failing. Optional: supply this
            or `album_id`, not both.
          schema:
            type: integer
      responses:
        '200':
          description: Album details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
        '400':
          description: Both identifiers absent, or the supplied identifier is not a canonical positive int4
        '404':
          description: The supplied identifier matched no catalog row

  /schedule:
    get:
      summary: Get schedule
      responses:
        '200':
          description: List of scheduled shows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schedule'

    post:
      summary: Add to schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Schedule'
      responses:
        '200':
          description: Successfully added to schedule

  /concerts:
    get:
      summary: List upcoming concerts (On Tour feed)
      description: >-
        Upcoming non-removed concerts windowed on the venue-local calendar
        date `starts_on`, ordered by `starts_on` ascending, paginated.
        `curated=true` narrows to concerts whose headliner resolved — to a
        WXYC catalog artist (`headlining_artist_id`) or to a Discogs artist
        identity (`headlining_discogs_artist_id`, the BS#1614 offline LML
        pass). Requires anonymous session auth.
      parameters:
        - name: curated
          in: query
          schema:
            type: boolean
            default: false
          description: Only concerts with a resolved headliner (catalog FK or Discogs artist id)
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Window start (inclusive) on starts_on; defaults to today (America/New_York)
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: Window end (inclusive) on starts_on; defaults to unbounded
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-indexed)
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Page size
      responses:
        '200':
          description: Paginated list of upcoming concerts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConcertsResponse'
        '400':
          description: Invalid query parameters
        '401':
          description: Authentication required

  /concerts/{id}:
    get:
      summary: Get a single concert by id (public share/deep-link read)
      description: >-
        Public, windowless single-concert read (BS#1694). Unlike the list,
        this endpoint requires NO authentication and applies NO date window:
        past concerts and concerts delisted at the source (tombstoned
        upstream — never deleted, never exposed) are served with whatever
        `status` they last carried, so the wxyc.org/shows share page can
        render "this one's passed" and the iOS universal-link fallback can
        resolve any shared id. 200 responses are publicly cacheable
        (`Cache-Control: public, max-age=300`); handler error responses
        (400/404/5xx) are pinned `no-store` so a shared cache can never
        hold a miss. (The router-level 400 for an undecodable path escape
        carries no cache header; 400 is not heuristically cacheable.) The
        canonical wire contract is `/concerts/{id}` in wxyc-shared/api.yaml
        (the SSOT); this app.yaml is Swagger display only.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The concert's serial id
      responses:
        '200':
          description: The concert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Concert'
        '400':
          description: Malformed id (non-integer, non-positive, or an undecodable path escape)
        '404':
          description: No concert with this id exists

  /album-reviews:
    get:
      summary: List archived DJ album-review submissions (internal, role-gated)
      description: >-
        Album-review submissions from the WXYC album-review Google Form
        archive (ADR 0011), ordered by submitted_at descending (nulls
        last), paginated. Filterable by linked library album or by artist
        name (normalized exact match). Deliberately not /reviews, which is
        reserved for the in-app Review model (ADR 0006).

        INTERNAL SURFACE. Requires a station role (`reviews:read` — dj,
        musicDirector, or stationManager); an anonymous session carries no role
        claim and is rejected with 403. It serves the WHOLE archive with NO
        `social_consent` filter, because the form's consent question asked only
        about outside publication ("shared on social media platforms... AKA blog
        and/or Instagram") and internal station tools were never in its scope.
        Submissions with no review body are excluded.

        The consent-gated PUBLIC surface is the `wxycReviews` array attached to
        GET /proxy/metadata/album, which is anonymous-reachable and applies a
        hard `social_consent = true` filter. Do not conflate the two.

        Reviewer names are never included in responses, on either surface,
        regardless of the consent answer. This block is Swagger display only;
        the SSOT is wxyc-shared/api.yaml.
      parameters:
        - name: album_id
          in: query
          schema:
            type: integer
          description: Return only submissions linked to this library album id.
        - name: artist
          in: query
          schema:
            type: string
          description: Artist-name filter; matched against the submission's normalized artist name (case-insensitive, leading-"the"-insensitive).
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-indexed)
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Page size
      responses:
        '200':
          description: Paginated list of album-review submissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumReviewsResponse'
        '400':
          description: Invalid query parameters
        '401':
          description: Authentication required
        '403':
          description: Authenticated but without the `reviews:read` permission (anonymous sessions and the `member` role)
