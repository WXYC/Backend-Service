  /library/{id}:
    patch:
      summary: Partially update an album (only provided fields are written)
      security:
        - BearerAuth: ['station-management']
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one field must be provided
              properties:
                album_title:
                  type: string
                label:
                  type: string
                label_id:
                  type: integer
                  nullable: true
                  description: Must reference an existing label; null clears the label
                genre_id:
                  type: integer
                format_id:
                  type: integer
                artist_id:
                  type: integer
                alternate_artist_name:
                  type: string
                  nullable: true
                album_artist:
                  type: string
                  nullable: true
                  description: Credited album artist on a compilation card (BS#2004). Null or empty clears it.
                disc_quantity:
                  type: integer
                  minimum: 1
                  maximum: 99
                code_number:
                  type: integer
                  minimum: 1
                  maximum: 32767
                  description: >-
                    Operator-chosen release call number (BS#2564; the PATCH half
                    of `NewAlbumRequest.code_number`, BS#2410). Uncollision-checked
                    on its own, same as the POST side (single-librarian decision,
                    rotation-import plan D2) and same as a `code_number`-only or
                    `artist_id`-only edit; the eventual DB uniqueness constraint
                    and its 23505 → 409 mapping are tracked on #2033, and the
                    artist-wide (not genre-scoped) collision check the
                    `artist_id` auto-regenerate below relies on is tracked on
                    #2579. Alongside an `artist_id` move, a value that DIFFERS
                    from the stored one is honored verbatim as the destination
                    shelf; a value that merely echoes the stored one expresses no
                    choice (a full-record resubmit carries it either way) and
                    still auto-regenerates when the destination artist already
                    owns that number. The one path that IS checked is a PATCH
                    that changes `genre_id` (BS#2587): the resulting
                    `(artist_id, genre_id, code_number, code_volume_letters)`
                    slot is looked up against the real shelf, and an occupied
                    slot refuses with `409 library_slot_conflict` rather than
                    silently filing two releases onto it.
                code_volume_letters:
                  type: string
                  nullable: true
                  maxLength: 4
                  description: >-
                    Volume letters for the release call code
                    (`library.code_volume_letters`, varchar(4)). An empty
                    string or an explicit `null` clears it to NULL — `null` is
                    accepted (unlike `NewAlbumRequest.code_volume_letters`,
                    which has nothing to clear on a create) because omitting
                    the key already means "leave unchanged" on a PATCH, so
                    clearing needs a distinct spelling, and `Album`'s own
                    `code_volume_letters` is `nullable: true`, so a client
                    round-tripping a GET body into a PATCH must be able to
                    send back the `null` it just received.
      responses:
        '200':
          description: Updated album
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
        '400':
          description: Invalid field value or no updatable fields provided
        '404':
          description: Album or artist not found
        '409':
          description: >-
            `library_slot_conflict` (BS#2587): the PATCH changes `genre_id`,
            and the resulting `(artist_id, genre_id, code_number,
            code_volume_letters)` slot is already occupied by another release.
            Only a genre CHANGE triggers this check — see `code_number` above.

    delete:
      summary: Hard-delete a library release (BS#2112)
      description: >-
        Irreversible. BS#2565 removed the prior 409 refusal that fired when
        the release carried flowsheet plays — the delete now proceeds
        regardless, and reports nothing about them. Those plays are still
        affected, just not reported here: linked directly
        (`flowsheet.album_id`) or via its rotation entry
        (`flowsheet.rotation_id` -> `rotation.album_id`), a play just loses
        its link; linked only by a bare `flowsheet.legacy_release_id`
        awaiting the linkage-resolve cron, a play is stranded permanently,
        since the delete-denylist means no future library row will ever
        carry that legacy id for the resolver to join to. A pre-delete read
        that surfaces this to the librarian before the delete is a separate
        endpoint, not this one.
        Dependent rows are resolved in the same transaction as the delete, and
        the release's `legacy_release_id` is recorded in a delete-denylist so
        the library ETL cannot re-import it from tubafrenzy. The denylist row
        also records the authenticated subject that issued the delete.
      security:
        - BearerAuth: ['station-management']
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted; no body
        '400':
          description: Invalid album ID
        '404':
          description: Album not found
        '409':
          description: >-
            Refused on the merits — the release has a LIVE `digital_asset`
            row (any status but `rejected`; a rejected asset is snapshotted
            and deleted through rather than refused over, since nothing can
            clear one). The body is deliberately NOT this service's standard
            error shape: the specifics are the substance of the refusal,
            telling the librarian what the delete would have damaged.
          content:
            application/json:
              schema:
                type: object
                description: 'Refused: a live digital_asset row references this release'
                required: ['message', 'reason', 'asset_count', 'assets']
                properties:
                  message:
                    type: string
                    description: Human-readable refusal naming the asset count and ids
                    example: 'Cannot delete: release has 2 digital assets on record (ids: 41, 42)'
                  reason:
                    type: string
                    enum: ['digital_asset_references']
                  asset_count:
                    type: integer
                    description: Number of LIVE `digital_asset` rows blocking this delete (`assets.length`)
                  assets:
                    type: array
                    description: >-
                      The live rows themselves — rip evidence /
                      S3-backed audio-archive metadata that has no
                      `onDelete` and nobody can casually re-enter, so the
                      delete refuses rather than destroying it. Rows with
                      `status: rejected` are never listed here: the delete
                      snapshots and removes those instead of refusing.
                    items:
                      type: object
                      required: ['id', 'provenance', 'disc_number', 'status']
                      properties:
                        id:
                          type: integer
                        provenance:
                          type: string
                          description: >-
                            Open vocabulary, NOT a closed enum — `schema.ts`
                            documents `provenance` as free text so a new
                            provenance costs no migration (the 0109 lesson).
                            `rotation_upload` and `cd_rip` are the values in
                            use today.
                          example: rotation_upload
                        disc_number:
                          type: integer
                        status:
                          type: string
                          description: >-
                            Open vocabulary, NOT a closed enum, for the same
                            reason as `provenance`. `needs_review`, `bound`
                            and `rejected` are in use today; the CD-rip phase
                            adds `pulled`, `ripped` and `exception`. A
                            `rejected` row never appears in this array.
                          example: needs_review
        '503':
          description: >-
            The delete stood down rather than wait on rows a live writer holds.
            Retryable, and says nothing about whether the release is deletable
            — deliberately not a 409, which on this endpoint means "refused on
            the merits". The transaction sets a `lock_timeout` below Postgres's
            deadlock-detection threshold on purpose, so that when a librarian's
            delete contends with a DJ's play insert it is the delete that
            yields.
          content:
            application/json:
              schema:
                type: object
                required: ['message', 'reason']
                properties:
                  message:
                    type: string
                    example: 'Could not delete: the release is being written to right now. Try again in a moment.'
                  reason:
                    type: string
                    enum: ['lock_unavailable']

  /library/{id}/flowsheet-play-counts:
    get:
      summary: "Pre-delete read: the release's flowsheet plays, by arm (BS#2592)"
      description: >-
        Answers "what would deleting this release damage?" for the
        confirmation screen `DELETE /library/{id}` cannot answer on its own
        response — by the time a delete returns, the screen has already been
        read. The three arms are disjoint by construction and reported
        separately; they are deliberately NOT summed, because the
        legacy-linked arm strands its plays rather than unlinking them, so a
        single total would misstate what the delete actually does. Gated
        `catalog:['read']`, not `catalog:['write']`: the DELETE it precedes is
        write-gated because it ACTS, while this only counts, and a caller who
        learns a number still has to clear the DELETE's own bar to use it —
        cardinality is read, contents are write. Note that `catalog:['read']`
        is held by `member` as well as `dj`; that is acceptable here because
        these are flowsheet plays, which `/playlists/recentEntries` already
        serves with no authentication at all.

        Two statements, not one: a library existence probe (to 404 before
        counting anything), then a single statement that bounds the scan to
        this release's own plays (a `WITH candidate_rows AS (… UNION …)` over
        the three arms' own indexes, never a full `flowsheet` scan) and
        computes all three arm counts from that one row set in one snapshot.
        That single statement is what makes the three counts internally
        consistent as of the moment it ran — nothing between the three arms
        can move a row from one count to another, or drop it, when all three
        are FILTER clauses partitioning the same row set.

        That internal consistency is not a freshness guarantee. This is a
        standalone advisory read that takes no lock — deliberately, since it
        precedes rather than wraps the delete it informs. Two live writers
        can move a row between arms after this statement's snapshot is
        taken: `jobs/legacy-linkage-resolve`, which re-links exactly this
        data every 30 minutes (its flowsheet pass moves a row out of
        `legacy_linked` and into `direct` as an unresolved
        `legacy_release_id` newly resolves to a `library` row; its rotation
        pass moves a row out of `legacy_linked` and into `rotation_linked`
        the same way); and ordinary catalog editing (`PATCH /flowsheet`),
        which can re-link or un-link a play's `album_id` or `rotation_id` by
        hand at any time, in either direction, when an MD corrects a wrong
        match. So: any of the three counts may differ, in
        either direction, by the time the delete this read precedes actually
        runs. None of the three arms carries a one-sided bound.
      security:
        - BearerAuth: ['catalog-read']
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The release's flowsheet plays, by arm
          content:
            application/json:
              schema:
                type: object
                required: ['direct', 'rotation_linked', 'legacy_linked']
                properties:
                  direct:
                    type: integer
                    description: >-
                      Plays linked via `flowsheet.album_id`; unlinked (not
                      deleted) by the delete. Counted by the same statement,
                      from the same row set, as the other two arms, so it is
                      exact as of that statement's snapshot. See the
                      staleness note above for what can happen after that
                      snapshot: this endpoint holds no lock, so a concurrent
                      `jobs/legacy-linkage-resolve` pass or catalog edit can
                      still move a play into or out of this arm before the
                      delete this read precedes actually runs.
                  rotation_linked:
                    type: integer
                    description: >-
                      Plays reachable only via `flowsheet.rotation_id` ->
                      `rotation.album_id`; unlinked by the delete's rotation
                      cascade. Excludes any play already counted in `direct`.
                      Counted by the same statement, from the same row set, as
                      the other two arms, so it is exact as of that
                      statement's snapshot. See the staleness note above for
                      what can happen after that snapshot: this endpoint
                      holds no lock, so a concurrent
                      `jobs/legacy-linkage-resolve` pass or catalog edit can
                      still move a play into or out of this arm before the
                      delete this read precedes actually runs.
                  legacy_linked:
                    type: integer
                    description: >-
                      Plays naming the release only by a bare
                      `flowsheet.legacy_release_id`, awaiting
                      `jobs/legacy-linkage-resolve`. Counted by the same
                      statement, from the same row set, as the other two
                      arms, so it is exact as of that statement's snapshot.
                      See the staleness note above for what can happen after
                      that snapshot: this endpoint holds no lock, so a
                      concurrent `jobs/legacy-linkage-resolve` pass can drain
                      a play out of this arm, a new tubafrenzy webhook
                      delivery can add one, or a catalog edit can move one
                      either way, before the delete this read precedes
                      actually runs. Deleting STRANDS whatever is still in
                      this arm at delete time permanently rather than
                      unlinking it, since the delete-denylist guarantees no
                      future release will ever carry this legacy id again.
        '404':
          description: Album not found

  /library/{id}/missing:
    patch:
      summary: Mark an album as missing
      security:
        - BearerAuth: ['station-management']
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Updated album
        '404':
          description: Album not found

  /library/{id}/found:
    patch:
      summary: Mark an album as found
      security:
        - BearerAuth: ['station-management']
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Updated album
        '404':
          description: Album not found

  /library/catalog:
    get:
      summary: Bulk catalog export (gzipped NDJSON, conditional-GET)
      description: >
        Returns the entire music library catalog as one gzipped NDJSON body
        (one JSON object per line) for clients that clone the catalog on-device
        (e.g. iOS Core Spotlight indexing). Freshness is gated by the catalog
        watermark: send `If-Modified-Since` (or `?since=`) and receive `304 Not
        Modified` while the catalog is unchanged (it changes ~daily, after the
        library ETL sync), or a fresh `200` with the full payload when it has
        advanced. `rotation_bin` and `rotation_kill_date` are exported raw (the
        most-recently-added rotation record per album); the client evaluates
        "in rotation" against its own clock as
        `rotation_bin != null && (rotation_kill_date == null || rotation_kill_date > today)`.
      security:
        - BearerAuth: ['catalog-read']
      parameters:
        - name: If-Modified-Since
          in: header
          required: false
          description: RFC 9110 HTTP date from a prior response's `Last-Modified`.
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: Alternative to `If-Modified-Since` (any parseable date string).
          schema:
            type: string
      responses:
        '200':
          description: Full catalog as gzipped NDJSON. One CatalogExportRow per line.
          headers:
            Last-Modified:
              description: Catalog watermark; echo back as `If-Modified-Since`.
              schema:
                type: string
            Content-Encoding:
              description: '`gzip` when the request accepts gzip.'
              schema:
                type: string
            Vary:
              schema:
                type: string
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/CatalogExportRow'
        '304':
          description: Catalog unchanged since `If-Modified-Since` / `since`.
        '401':
          description: Missing or invalid bearer token.

  /library/catalog/compilation-tracks:
    get:
      summary: Bulk compilation-track (CTA) export (gzipped NDJSON, conditional-GET)
      description: >
        Sibling of `GET /library/catalog` for the Backend-sourced library.db
        producer (BS#1965 / discogs-etl#351): every compilation_track_artist row
        as one gzipped NDJSON body (one CatalogCompilationTrackRow per line), so
        the producer can build library.db's `compilation_track_artist` table over
        HTTP. Same `library_watermark` conditional-GET (`If-Modified-Since` /
        `?since=` -> `304`) as the library export. Rows are keyed on
        `legacy_release_id` (the owning library row's surrogate key) and ordered
        by it.

        A CTA row is emitted only if its owning library row is itself eligible
        for `GET /library/catalog` — same four INNER JOINs, notably
        `genre_artist_crossreference` on the (artist_id, genre_id) pair. An
        unfiltered export would ship `library_release_id` values that join to
        nothing in the `library` table the sibling endpoint produces.
      security:
        - BearerAuth: ['catalog-read']
      parameters:
        - name: If-Modified-Since
          in: header
          required: false
          description: RFC 9110 HTTP date from a prior response's `Last-Modified`.
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: Alternative to `If-Modified-Since` (any parseable date string).
          schema:
            type: string
      responses:
        '200':
          description: All CTA rows as gzipped NDJSON. One CatalogCompilationTrackRow per line.
          headers:
            Last-Modified:
              description: Catalog watermark; echo back as `If-Modified-Since`.
              schema:
                type: string
            Content-Encoding:
              description: '`gzip` when the request accepts gzip.'
              schema:
                type: string
            Vary:
              schema:
                type: string
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/CatalogCompilationTrackRow'
        '304':
          description: Catalog unchanged since `If-Modified-Since` / `since`.
        '401':
          description: Missing or invalid bearer token.

  /library/bmi-performance-list:
    get:
      summary: BMI played-works export for a date range (BS#1500)
      description: >
        Successor to tubafrenzy's `recentBMI` servlet: the played musical works the
        station librarian submits to BMI for royalty reporting. Reads `flowsheet` track
        rows with a usable artist whose `add_time` falls in the half-open `[from, to]`
        window (the whole `to` day is included), ordered chronologically, and returns the
        rows plus a composer-provenance `coverage` summary the dj-site admin tool previews
        before submit. Gated to MD/SM via `catalog:['write']`. The window width is capped
        (max 366 days); the exact BMI submission text format and the artist-proxy inclusion
        default are finalized in #1507 and do not change this envelope.
      security:
        - BearerAuth: ['catalog-write']
      parameters:
        - name: from
          in: query
          required: true
          description: Inclusive start of the window, `YYYY-MM-DD` (UTC-day boundary).
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Inclusive end of the window, `YYYY-MM-DD`. Must not precede `from`; the window may span at most 366 days.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Played works in the window plus the coverage summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BmiPerformanceList'
        '400':
          description: Missing, malformed, out-of-order, or too-wide `from`/`to` range.
        '401':
          description: Missing or invalid bearer token.
        '403':
          description: Authenticated role lacks `catalog:write` (below musicDirector).

  /library/rotation:
    get:
      summary: Get rotation list
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, killed, all]
            default: active
          description: >-
            Not a partition: `active` is `kill_date IS NULL OR kill_date >
            CURRENT_DATE`, `killed` is `kill_date IS NOT NULL`, so a
            future-dated kill appears in both; `all` applies no filter.
            `GET /library/rotation/uncatalogued` takes the same three
            values and defaults to `all`, not `active`.
      responses:
        '200':
          description: List of rotations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rotation'
        '400':
          description: A status outside active|killed|all.

    post:
      summary: Add new rotation
      security:
        - BearerAuth: ['station-management']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRotationRequest'
      responses:
        '201':
          description: Successfully added rotation
        '400':
          description: >-
            Missing rotation_bin; neither album_id nor a valid artist/title
            pair given; album_id not a positive integer; or a snapshot
            field over 128 characters.

    patch:
      summary: Set rotation removal date
      security:
        - BearerAuth: ['station-management']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rotation_id:
                  type: integer
                kill_date:
                  type: string
                  format: date
      responses:
        '200':
          description: Successfully set rotation removal date

  /library/rotation/uncatalogued:
    get:
      summary: List uncatalogued rotation releases (cataloging backlog queue)
      description: >-
        BS#2109. Rotation rows with no linked library release (`album_id IS
        NULL`) — the "Import to Library" backlog a librarian works through
        via `PATCH /library/rotation/{rotation_id}/link`. Deliberately NOT
        deduplicated the way `GET /library/rotation`'s dropdown shape is:
        two physically distinct promos sharing an artist and title are two
        separate rows to catalogue, not one. Unfiltered by default —
        `status` defaults to `all` here, so this is the whole backlog and
        not a live dropdown (BS#2504). `limit` defaults to its 500 maximum
        rather than to the whole backlog (~3.8k rows, ≈700 KB of JSON);
        page with `offset` to walk past it.
      security:
        - BearerAuth: ['catalog-read']
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, killed, all]
            default: all
          description: >-
            BS#2504. Same three values as `GET /library/rotation`,
            deliberately NOT the same default: `all` here, `active` there.
            This endpoint shipped unfiltered and dj-site's Awaiting
            Cataloging facet still reads it with no parameter, so an
            omitted `status` keeps returning what it always returned. The
            facets do not partition — `active` is `kill_date IS NULL OR
            kill_date > CURRENT_DATE`, `killed` is `kill_date IS NOT
            NULL` — so a future-dated kill matches both.
      responses:
        '200':
          description: >-
            Uncatalogued rotation rows. `status=killed` orders them
            `kill_date DESC, id ASC` (most recently killed first, matching
            /wxycdb's `findKilledUncataloged()`), which sorts a
            future-dated kill to the top; `active` and `all` keep
            `add_date DESC, id ASC`. The `id` tiebreak makes both sorts
            total, so `offset` paging cannot skip or repeat a row.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UncataloguedRotationRow'
        '400':
          description: Malformed limit or offset, or a status outside active|killed|all.
        '401':
          description: Missing or invalid bearer token.

  /library/rotation/{rotation_id}/link:
    patch:
      summary: Link an uncatalogued rotation row to a library release
      description: >-
        BS#2109. The "Import to Library" step of the tubafrenzy `/wxycdb`
        workflow: attaches a `library` release to a rotation row that was
        added without one. Rejects double-linking (409). Deliberately does
        NOT clear artist_name/album_title/record_label — they're left
        populated so the tracklist picker (`GET
        /library/rotation/{rotation_id}/tracks`) can still resolve a
        release via LML free-text lookup until `discogs_release_id` is
        independently backfilled; display elsewhere is unaffected because it
        reads through the library join once album_id resolves.


        **BS#2410: linking also resolves the rotation row's flowsheet
        plays.** In the same transaction, every `flowsheet` row carrying this
        `rotation_id` with a NULL `album_id` is repointed at the linked
        release — the third step of tubafrenzy's `processImportToLibrary`,
        which Backend previously dropped. The match is FK-keyed only: a
        free-text play of the same promo carries no `rotation_id` and keeps
        its snapshot-match display path deliberately, and a play that already
        resolved to some other release is never overwritten. No other outcome
        writes to `flowsheet` — a 404 or a 409 (including the
        linked-between-check-and-write race) leaves every play untouched.


        The response shape is unchanged. The number of plays resolved is
        observability only, published as the `rotation_link.flowsheet_rows_linked`
        span attribute rather than serialized.
      security:
        - BearerAuth: ['catalog-write']
      parameters:
        - name: rotation_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['album_id']
              properties:
                album_id:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Linked rotation row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UncataloguedRotationRow'
        '400':
          description: rotation_id is not a positive integer, or album_id is missing/not a positive integer.
        '401':
          description: Missing or invalid bearer token.
        '404':
          description: Rotation entry not found, or album not found.
        '409':
          description: Rotation entry is already linked to a library release.

  /library/rotation/{id}:
    get:
      summary: Get one rotation row (BS#2410)
      description: >
        The single-row rotation read: renders dj-site#1161's Import to Library summary
        table and backs its pre-submit staleness check (a populated `album_id` means the
        row was catalogued while the operator had the form open). `catalog:['read']`,
        matching `GET /library/rotation` and `GET /library/rotation/uncatalogued` rather
        than the `catalog:['write']` PATCH on this same path.


        **Answers for linked rows as well as unlinked ones.** `GET
        /library/rotation/uncatalogued` filters `album_id IS NULL` behind a 500-row cap,
        so "absent from that page" conflates *linked* with *past the window* — which is
        exactly the distinction the staleness check needs. 404 here means no such row.


        **Returns the rotation resource itself, with no join and no COALESCE.**
        `format_id` and `label_id` are this row's own pre-catalog fields, never the linked
        library release's — the opposite of what `label_id` means on `GET
        /library/rotation`, whose rows come from the `library` join. See
        `UncataloguedRotationRow` for the full rule.


        Registered AFTER the literal `/library/rotation/uncatalogued`: it shares both
        method and segment count with that literal, so the ordering is load-bearing rather
        than defensive. It is the second such family on this router — `GET
        /library/artists/{id}` stands in the same relation to `/library/artists/search`,
        `/library/artists/peek-code` and `/library/artists/by-code`.
      security:
        - BearerAuth: ['catalog-read']
      parameters:
        - name: id
          in: path
          required: true
          description: '`rotation.id` of the row to read (positive integer).'
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The rotation row, in the shared ten-column projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UncataloguedRotationRow'
        '400':
          description: Non-positive or non-canonical `id` spelling.
        '401':
          description: Missing or invalid bearer token.
        '404':
          description: No rotation row with that id.

    patch:
      summary: Field-level edit of a rotation release (BS#2113, widened by BS#2410)
      description: >
        Partial update of the seven columns that actually exist on `wxyc_schema.rotation`:
        `artist_name`, `album_title`, `record_label`, `add_date`, `kill_date`,
        `format_id`, `label_id`. Only the fields present in the body are validated and
        written, so a typo fix on one field cannot wipe another. Gated to MD/SM via
        `catalog:['write']`.


        **`kill_date: null` clears the column.** This is the one non-obvious part of the
        contract and the only way to un-kill a release through the HTTP surface: sending
        an explicit JSON `null` writes SQL NULL, returning the row to active rotation.
        Omitting `kill_date` entirely leaves the stored value untouched — `null` and
        "absent" are deliberately different, which is why the field is nullable rather
        than merely optional. `PATCH /library/rotation` (the kill endpoint) can only ever
        set a date, never clear one.


        **The five pre-catalog fields — the `artist_name`/`album_title`/`record_label`
        snapshot trio plus `format_id` and `label_id` — are rejected with a 409 on a
        rotation row that has an `album_id`.** Once the row is linked, the library release
        is the authority for all five: the rotation list read (`GET /library/rotation`)
        projects artist, title, label and format from the `library`/`artists`/`format`
        join, so a write here would be echoed by the response and then be invisible there;
        a non-NULL snapshot on a linked row also misroutes the flowsheet rotation badge,
        which partitions its match arms on the invariant that a linked row's denormalized
        names are NULL. Edit the linked release via `PATCH /library/{id}` instead — it
        accepts `album_title`, `label`, `format_id` and `label_id` by name. `add_date` and
        `kill_date` stay editable on a catalogued row.


        **`format_id`/`label_id` do NOT reset the tracklist-picker marker.** A snapshot
        text edit nulls `rotation.tracklist_lookup_attempted_at` so the tier-3 LML
        cascade re-attempts against the corrected text; the picker keys that cascade on
        `(artist_name, album_title)`, so a format- or label-only edit has nothing stale to
        invalidate and deliberately leaves the marker alone rather than re-arming a
        ~22-second lookup on every such edit.


        `alphabetical_name`, `format`, and `format_size` appear on the same legacy editor
        screen but have no `rotation` column, and are rejected with a 400 naming the field
        rather than silently dropped. `format` in particular stays rejected even though
        the format is now editable here: the wire field is `format_id`, so accepting the
        free-text name would be a silent 200-no-write rather than a precise 400.
      security:
        - BearerAuth: ['catalog-write']
      parameters:
        - name: id
          in: path
          required: true
          description: '`rotation.id` of the row to edit (positive integer).'
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                artist_name:
                  type: string
                  maxLength: 128
                  description: Denormalized artist snapshot. Rejected (409) when the row has an `album_id`.
                album_title:
                  type: string
                  maxLength: 128
                  description: Denormalized album snapshot. Rejected (409) when the row has an `album_id`.
                record_label:
                  type: string
                  maxLength: 128
                  description: Denormalized label snapshot. Rejected (409) when the row has an `album_id`.
                add_date:
                  type: string
                  format: date
                  description: '`YYYY-MM-DD`. Calendar-validated: `2026-09-31` is a 400, not a 500.'
                kill_date:
                  type: string
                  format: date
                  nullable: true
                  description: '`YYYY-MM-DD`, or an explicit `null` to clear the column and return the release to active rotation.'
                format_id:
                  type: integer
                  minimum: 1
                  nullable: true
                  description: >-
                    BS#2410. Pre-catalog `format(id)` reference; an explicit `null` clears it.
                    Rejected (409) when the row has an `album_id`. A dangling id 400s with
                    "format_id does not reference an existing format". Does not reset
                    `tracklist_lookup_attempted_at`.
                label_id:
                  type: integer
                  minimum: 1
                  nullable: true
                  description: >-
                    BS#2410. Pre-catalog `labels(id)` reference; an explicit `null` clears it.
                    Rejected (409) when the row has an `album_id`. A dangling id 400s with
                    "label_id does not reference an existing label". Independent of the
                    free-text `record_label`, and does not reset `tracklist_lookup_attempted_at`.
      responses:
        '200':
          description: >-
            The updated rotation row, projected to the same ten columns
            `GET /library/rotation/uncatalogued` publishes. Not the raw `wxyc_schema.rotation`
            row — that also carries server-derived plumbing (`legacy_rotation_id`,
            `discogs_release_id`, `lml_identity_id`, the attempt-at markers) which this
            endpoint does not publish — and not the joined `GET /library/rotation`
            list-view shape either.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UncataloguedRotationRow'
        '400':
          description: >
            Non-positive/non-integer `id`, empty body, a field with no `rotation` column
            (`alphabetical_name`/`format`/`format_size`), a blank or over-128-character
            text field, a malformed/impossible `add_date`/`kill_date`, a non-positive
            `format_id`/`label_id`, or a `format_id`/`label_id` referencing no row.
        '401':
          description: Missing or invalid bearer token.
        '403':
          description: Authenticated role lacks `catalog:write` (below musicDirector).
        '404':
          description: No rotation row with that id.
        '409':
          description: >
            One or more pre-catalog fields
            (`artist_name`/`album_title`/`record_label`/`format_id`/`label_id`) was sent
            for a rotation row linked to a library release (`album_id` is not NULL). The
            remedy is field-specific: `album_title`, `record_label`, `format_id` and
            `label_id` are editable via `PATCH /library/{album_id}` (as `album_title`,
            `label`, `format_id`, `label_id`); `artist_name` is not —
            `library.artist_name` is derived from the linked `artists` row via `artist_id`.
            Renaming the ARTIST is possible (`PATCH /library/artists/{id}`, BS#2563) and
            cascades to every release it holds, but no endpoint supports setting free-text
            `artist_name` on a single catalogued release.

  /library/artists:
    post:
      summary: Add new artist
      security:
        - BearerAuth: ['station-management']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - artist_name
                - code_letters
                - genre_id
              properties:
                artist_name:
                  type: string
                code_letters:
                  type: string
                genre_id:
                  type: integer
                code_number:
                  type: integer
                  minimum: 0
                  maximum: 2147483647
                  description: >-
                    Optional since BS#2475. Omitted (or JSON `null`), the server assigns the next
                    number in the `(code_letters, genre_id)` bucket — bucket MAX + 1, starting at 1
                    for an empty bucket, the same value `GET /library/artists/peek-code` previews —
                    and echoes the assignment in the 201 body. Supplied, the number is honored or
                    refused (409), never rewritten. The floor is 0, below the wxyc-shared
                    `AddArtistRequest` minimum of 1, deliberately: the Various-Artists shelves are
                    filed at `artist_genre_code = 0` and the by-code read resolves them, so the
                    published contract's floor is the side awaiting amendment.
      responses:
        '200':
          description: Successfully added artist
        '409':
          description: >-
            Conflicts. `reason: artist_code_conflict` / `artist_name_conflict` — the code triple
            or the genre-scoped artist name is already taken (each 409 names the owning artist).
            `code: artist_code_number_exhausted` (BS#2475) — reachable only with `code_number`
            omitted: the bucket's next number would exceed 2147483647
            (`genre_artist_crossreference.artist_genre_code` is a Postgres `integer`), so nothing
            was written; supply an explicit unused `code_number` instead.

  /library/artists/search:
    get:
      summary: Prefix-search catalogued artists, library-wide or within a genre
      description: >-
        Backs the catalog add-entry autocomplete and the rotation import screen's
        duplicate-artist guard. With `genre_id`, matches only that genre's memberships;
        without it (BS#2410) the search is library-wide. Either way the result is one row
        per (artist, genre) membership, each carrying its own genre and per-genre
        `code_number`.
      security:
        - BearerAuth: ['station-management']
      parameters:
        - in: query
          name: genre_id
          required: false
          description: Optional genre scope. Omit for a library-wide match.
          schema:
            type: integer
        - in: query
          name: q
          required: true
          description: Prefix to match against artist names (minimum 2 characters)
          schema:
            type: string
            minLength: 2
        - in: query
          name: limit
          description: >-
            Applies to the (artist, genre) membership join, not to distinct artists, so a
            multi-genre artist consumes one slot per genre. 20 is a ceiling, not a rejection
            threshold: a value above 20 is clamped to 20, and a zero, negative or non-integer
            value falls back to the default of 10. Nothing here 400s.
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        '200':
          description: Matching (artist, genre) memberships, ordered by artist name
          content:
            application/json:
              schema:
                type: object
                properties:
                  artists:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        artist_name:
                          type: string
                        code_letters:
                          type: string
                        code_number:
                          type: integer
                          description: >-
                            The artist's number within this row's own `genre_id`
                            (`genre_artist_crossreference.artist_genre_code`), which is why the
                            genre travels on the row: library-wide, neighbouring rows carry
                            numbers from different shelves.
                        genre_id:
                          type: integer
                        genre_name:
                          type: string
        '400':
          description: Invalid genre_id or q
        '404':
          description: Genre not found (only when `genre_id` is given)

  /library/artists/peek-code:
    get:
      summary: Peek next artist code number for a given genre and code letters
      security:
        - BearerAuth: ['station-management']
      parameters:
        - in: query
          name: code_letters
          required: true
          schema:
            type: string
        - in: query
          name: genre_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Next available artist code number

  /library/artists/by-code:
    get:
      summary: Resolve a library code to its owners, or browse a whole call-letters bucket
      description: >-
        Two modes, selected by whether `code_number` is present.

        **Fully specified** (`code_number` given) resolves `genre_id` + `code_letters` +
        `code_number` to every artist filed under that code. The triple is not unique — the
        Various-Artists shelf files many distinct buckets (`Soundtracks - A`,
        `Soundtracks - B`, …) under one `V/A` code — so the response is always a list, ordered
        by `artist_name` then `id`. A code with a single owner returns a one-element array.

        **Browse** (`code_number` omitted, BS#2489) returns every artist filed under the
        `(genre_id, code_letters)` bucket, ordered by `code_number` then `artist_name` then
        `id` — the shelf order a librarian reads to check an assigned number or spot a gap in
        an occupied range. This is the path `chooseLibraryCodeOrArtist.jsp` fell through to
        `multipleArtistsDisplay.jsp` for on a blank call number. Only an ABSENT `code_number`
        browses: a present-but-empty `?code_number=` is still a 400, because `Number('')` is 0
        and 0 is a legitimate V/A filing, so browsing on it would hide a client bug.

        `code_letters` must be 1-4 characters from A-Z, 0-9, or `/` (the `artists.code_letters`
        column domain); it is trimmed and upper-cased before matching.
      security:
        - BearerAuth: ['catalog-read']
      parameters:
        - in: query
          name: genre_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - in: query
          name: code_letters
          required: true
          schema:
            type: string
            pattern: '^\s*[A-Za-z0-9/]{1,4}\s*$'
        - in: query
          name: code_number
          required: false
          description: >-
            Accepts 0 — the Various-Artists filings are stored with an artist genre code of 0.
            OMIT it to browse the whole `(genre_id, code_letters)` bucket instead (BS#2489).
            Sending it empty (`?code_number=`) is a 400, not a browse.
          schema:
            type: integer
            minimum: 0
            maximum: 2147483647
        - in: query
          name: limit
          required: false
          description: >-
            Window size for the browse; the default is also the ceiling. Validated on BOTH
            modes so a malformed value is refused consistently, but read only by the browse —
            the fully-specified lookup returns every owner of one exact code, which the triple
            already bounds.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
        - in: query
          name: offset
          required: false
          description: >-
            Rows to skip in the browse order. Same both-modes validation as `limit`.
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: >-
            Fully-specified: the artists that own this code, ordered by artist_name then id.
            Browse: every artist in the bucket, ordered by code_number then artist_name then
            id — and an EMPTY LIST when the genre exists but no artist is filed under those
            call letters. That is a normal browse outcome, deliberately not the
            `code_not_assigned` 404 the fully-specified mode returns, which asserts something
            about a code the browse request never named. `genre_not_found` stays a 404 in both
            modes, which is what lets dj-site#1506 tell a stale genre dropdown from an empty
            shelf rather than reading an outage as an empty bucket.

            Deliberately NOT the same row object as `GET /library/artists/search`, which is
            one field wider, and deliberately not hoisted into a shared schema. That route
            reads `genre_artist_crossreference` joined to `genres`, so every row carries its
            own membership's `code_number`, `genre_id` and `genre_name`. This route is a code
            lookup: `getArtistsByCode` projects `(artist_id, artist_name, code_letters)` and
            never joins `genres`, and the handler echoes the already-validated
            `genre_id`/`code_number` back onto each row — they are the request restated,
            identical across the whole list, not per-row facts, and there is no `genre_name`
            because nothing on this path reads one. Keeping the two declarations separate is
            what stops widening the search projection from silently promising fields this
            lookup does not select. `ArtistSearchMatch` in the cross-repo SSOT
            (`wxyc-shared/api.yaml`) is the search row alone — this endpoint is not declared
            there at all.
          content:
            application/json:
              schema:
                type: object
                properties:
                  artists:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        artist_name:
                          type: string
                        code_letters:
                          type: string
                        code_number:
                          type: integer
                          description: >-
                            Mode-dependent, and this is the trap in the response. Fully
                            specified, it is an ECHO of the request's `code_number`, identical
                            on every row — not a per-row `artist_genre_code` the way the
                            same-named field on `GET /library/artists/search` is. Browsing, it
                            is the row's REAL `artist_genre_code` and varies across the list —
                            it is the whole point of the browse, and a response builder that
                            copied the echo would emit one number on every row and still
                            typecheck.
                        genre_id:
                          type: integer
                          description: >-
                            Echo of the request's `genre_id`, identical on every row. No
                            `genre_name` travels with it: this lookup never joins `genres`.
        '400':
          description: >-
            Invalid or missing genre_id or code_letters; an invalid (as opposed to absent)
            code_number; or a malformed limit or offset.
        '404':
          description: >-
            Two distinct outcomes, told apart by `reason`, never by the message text.
            `genre_not_found` — no genre has that `genre_id`, so the client's genre list is
            stale and the code was never evaluated. `code_not_assigned` — the genre exists and
            no artist is filed under that exact code.

            `code_not_assigned` is NOT a guarantee that creating an artist under the code is
            safe. This lookup upper-cases `code_letters` before matching, but `artists.code_letters`
            is a plain `varchar(4)` with byte-exact equality and neither writer canonicalizes:
            `insertArtistWithGenreCrossreference` only NFC-normalizes, and the tubafrenzy
            `library-etl` job writes its source value verbatim. So a lower-case row filed under
            the same shelf code is invisible here — and `POST /library/artists`, whose own
            conflict pre-check NFC-normalizes but does not case-fold, will happily create one.
            Every row in the production catalog is
            canonical today, so this is an open path rather than existing data; canonicalizing
            on write (plus a backfill) is the real fix and is tracked separately.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  reason:
                    type: string
                    enum: [genre_not_found, code_not_assigned]
              examples:
                genre_not_found:
                  summary: Unknown genre_id
                  value:
                    message: Genre not found
                    reason: genre_not_found
                code_not_assigned:
                  summary: Known genre, unassigned code
                  value:
                    message: Artist code not assigned in that genre
                    reason: code_not_assigned

  /library/artists/{id}:
    get:
      summary: Get an artist's card (BS#2156, BS#2637)
      description: >
        Enforced by `requirePermissions({ catalog: ['read'] })` — DJ role or
        above, the same tier as the other catalog reads documented with the
        `catalog-read` scope.


        `genre_id` is optional and names WHICH shelf to answer for an artist
        filed under more than one genre (BS#2637). `genre_artist_crossreference`
        is unique on `(artist_id, genre_id)`, so `code_artist_number` is
        genre-scoped and the artist id alone does not identify a card — artist
        431 ('Isis') is two unrelated bands on one row, `IS 1` under Hiphop and
        `IS 13` under Rock. Omitted, the response collapses onto the artist's
        lowest `genre_id`, which is what this endpoint has always returned; a
        genre-aware client should send the parameter. The dependent counts are
        artist-wide either way and are deliberately NOT genre-scoped: they
        report what a delete would have to clear.
      security:
        - BearerAuth: ['catalog-read']
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: genre_id
          required: false
          description: >-
            Answer this artist's card for one genre membership instead of the
            lowest. Absent, the lowest-`genre_id` collapse applies.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        '200':
          description: >-
            The artist-card field set, plus the delete-refusal dependent
            counts (BS#2597) — see `ArtistCardWithDependentCounts`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistCardWithDependentCounts'
        '400':
          description: Invalid artist id or genre_id
        '404':
          description: >-
            `Artist not found` for an unknown id (or an artist row carrying no
            genre crossreference at all). A well-formed `genre_id` the artist
            has no membership in answers the distinct `Artist not filed under
            genre {genre_id}` — the record exists and the caller is one query
            parameter away from a 200.

    patch:
      summary: Update an artist's name or alphabetical_name (BS#2156, BS#2563)
      description: >
        Enforced by `requirePermissions({ catalog: ['write'] })` — musicDirector
        or above, the same tier as `POST`/`PATCH /library`. Two writable fields,
        `artist_name` and `alphabetical_name`; send either or both. Each is
        capped at 128 characters (the `varchar(128)` column width) and must be a
        non-empty string. `genre_id`, `code_letters`, and `code_artist_number`
        are real fields on `/wxycdb`'s artist-card form but have no write path
        on this endpoint — sending one is rejected with a 400 naming why, not
        silently dropped. A `code_letters` change is therefore still
        unserviceable, so a rename that crosses a shelf-letter boundary
        ('Ziu Ziu' → 'Xiu Xiu') leaves the filing code behind.

        `artist_name` was excluded from the original BS#2156 ship while
        `jobs/library-etl` was a live 30-minute cron that matched artists by
        `fold_artist_name` and never updated `artists` — a Backend-side rename
        would have been silently duplicated and reverted by the next ETL pass.
        That job is now `job-type: one-shot` with no crontab entry, so
        Backend-Service is the sole catalog writer and BS#2563 restored the
        field.

        An `artist_name` change cascades: the `cascade_library_artist_name`
        trigger rewrites `library.artist_name` on every release the artist
        holds, `library.search_doc` (a generated column) recomputes, and
        `library.artwork_lookup_attempted_at` is cleared on those rows so a
        corrected name is not left suppressed for the rest of the 7-day
        artwork-lookup negative window. `flowsheet.artist_name` is deliberately
        NOT rewritten — it is a historical on-air snapshot. Renaming a
        large-shelf artist is proportionally expensive (the cascade is a
        multi-thousand-row write for 'Various Artists') and advances the catalog
        watermark, so every catalog poller re-downloads.
      security:
        - BearerAuth: ['catalog-write']
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        description: >-
          At least one updatable field must be provided. Neither is individually
          required, so a body carrying only `artist_name` or only
          `alphabetical_name` is valid; an object with neither is a 400.
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                artist_name:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: >-
                    The artist's display name. Trimmed and NFC-normalized before
                    storage, then measured in CODE POINTS against the
                    `varchar(128)` column. A blank-after-trim value is a 400,
                    not a silent no-op. Checked against a folded-name collision
                    probe (case/diacritic/Unicode-form insensitive) across every
                    genre the artist is filed in; a hit is a 409.
                alphabetical_name:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: >-
                    The filing name that governs shelf order. Trimmed and
                    NFC-normalized before storage, then measured in CODE POINTS
                    against the `varchar(128)` column. A blank-after-trim value
                    is a 400, not a silent no-op.
      responses:
        '200':
          description: >
            The refreshed artist card in the same `ArtistCardWithDependentCounts`
            shape the `GET` on this path returns (BS#2597) — the dependent
            counts are recomputed and included here too, so a client can
            refresh its delete-control state from the PATCH body without a
            follow-up GET. Also the answer to a no-op edit (a field
            resubmitted at its current value), which writes nothing but still
            answers with the current counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistCardWithDependentCounts'
        '400':
          description: >
            Invalid artist id, missing/non-object body, a `genre_id` /
            `code_letters` / `code_artist_number` field with no write path on
            this endpoint, no updatable fields provided, or an `artist_name` /
            `alphabetical_name` that is non-string, empty, or over 128
            characters
        '404':
          description: Artist not found
        '409':
          description: >
            `reason: artist_name_conflict` — the requested `artist_name` folds
            equal to a DIFFERENT artist already filed in one of this artist's
            genres, so the rename would create the duplicate-artist state the
            catalog has no constraint against. The body carries the conflicting
            `artist` (`artist_id`, `artist_name`, `code_letters`) so a client
            can offer merging into it rather than reporting a bare failure.
            Advisory rather than authoritative: no unique constraint backs the
            folded name, so a concurrent write can still produce the collision.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  reason:
                    type: string
                    enum: ['artist_name_conflict']
                  artist:
                    type: object
                    properties:
                      artist_id:
                        type: integer
                      artist_name:
                        type: string
                      code_letters:
                        type: string

    delete:
      summary: Hard-delete an artist (BS#2562)
      description: >-
        Irreversible. Reproduces `/wxycdb`'s `ArtistAdminServlet.
        processDeleteArtist` refusals, in the servlet's own order, keyed on
        the same four dependent counts `GET`/`PATCH` on this path already
        expose (`ArtistCardWithDependentCounts`, BS#2597) — this endpoint and
        the artist card can never disagree about what blocks a delete. Every
        `genre_artist_crossreference` row is deleted in the same transaction
        (a multi-genre artist holds more than one — `artist_genre_key` is
        unique on `(artist_id, genre_id)`, not `artist_id` alone);
        `compilation_track_artist.track_artist_id` is left to its own
        `ON DELETE set null` and is reported by the GET/PATCH response, never
        a refusal reason here. Migration `0155`'s cascade invitation for the
        two `NO ACTION` FKs (`genre_artist_crossreference.artist_id`,
        `artist_library_crossreference.artist_id`) is deliberately declined —
        dependents are resolved explicitly inside the transaction, mirroring
        `DELETE /library/{id}`. The artist row plus its resolved dependents
        are captured via the BS#2560 snapshot mechanism before any delete
        statement runs, in the same transaction.
      security:
        - BearerAuth: ['catalog-write']
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted; no body
        '400':
          description: Invalid artist ID
        '404':
          description: Artist not found
        '409':
          description: >-
            Refused on the merits — `reason` names which of the four
            dependent counts blocked the delete, checked in the servlet's
            order (releases, then cross-reference-as-source, then
            cross-reference-as-target, then library cross-reference). The
            same non-zero count is also visible ahead of time on `GET`/`PATCH
            /library/artists/{id}`'s `ArtistCardWithDependentCounts`
            response, so a client can grey out the delete control rather than
            eat this 409 blind.
          content:
            application/json:
              schema:
                type: object
                required: ['message', 'reason', 'count']
                properties:
                  message:
                    type: string
                    example: >-
                      Cannot delete: artist has 3 releases on file. Delete or
                      move those releases first.
                  reason:
                    type: string
                    enum:
                      - artist_has_releases
                      - artist_crossreference_source
                      - artist_crossreference_target
                      - artist_library_crossreference
                  count:
                    type: integer
                    description: The blocking dependent count named by `reason`
        '503':
          description: >-
            The delete stood down rather than wait on rows a live writer
            holds. Retryable, and says nothing about whether the artist is
            deletable — deliberately not a 409, which on this endpoint means
            "refused on the merits". Same `lock_timeout`-below-
            `deadlock_timeout` mechanism as `DELETE /library/{id}`.
          content:
            application/json:
              schema:
                type: object
                required: ['message', 'reason']
                properties:
                  message:
                    type: string
                    example: >-
                      Could not delete: the artist is being written to right
                      now. Try again in a moment.
                  reason:
                    type: string
                    enum: ['lock_unavailable']

  /library/artists/{id}/releases:
    get:
      summary: List an artist's releases (BS#2156, BS#2637)
      description: >
        Enforced by `requirePermissions({ catalog: ['read'] })` — DJ role or
        above. Offset-paginated in the same `page`/`limit` shape as `GET
        /library/query`. Rows carry the full physical call number
        (`code_letters` + `code_artist_number` + `code_number` +
        `code_volume_letters`); `code_artist_number` is genre-scoped, hence the
        per-row `genre_id`. Ordered by shelf order — `code_number`, then
        `code_volume_letters`, then `id` as a total order.


        `genre_id` is optional and restricts the rows to one of a multi-genre
        artist's shelves (BS#2637). Absent, the page spans every genre the
        artist is filed under — which for artist 431 ('Isis') means one page
        listing a hip-hop act's release beside a metal band's. `total` is
        scoped with the page, never independently of it.
      security:
        - BearerAuth: ['catalog-read']
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: page
          required: false
          description: Zero-based page index.
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: genre_id
          required: false
          description: >-
            Restrict to the releases filed under one genre. Absent, the page
            spans every genre this artist is filed under.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        '200':
          description: One page of the artist's releases, in shelf order
          content:
            application/json:
              schema:
                type: object
                properties:
                  artist_id:
                    type: integer
                  releases:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        last_modified:
                          type: string
                          format: date-time
                        format_name:
                          type: string
                        genre_id:
                          type: integer
                        code_letters:
                          type: string
                        code_artist_number:
                          type: integer
                        code_number:
                          type: integer
                        code_volume_letters:
                          type: string
                          nullable: true
                        album_title:
                          type: string
                        alternate_artist_name:
                          type: string
                          nullable: true
                  total:
                    type: integer
                  page:
                    type: integer
                  totalPages:
                    type: integer
        '400':
          description: Invalid artist id, page, limit, or genre_id
        '404':
          description: >-
            `Artist not found` for an unknown id (or an artist row carrying no
            genre crossreference at all). A well-formed `genre_id` the artist
            has no membership in answers the distinct `Artist not filed under
            genre {genre_id}` rather than an empty page, which would be
            indistinguishable from a membership holding no releases.

  /library/artists/{id}/next-release-number:
    get:
      summary: Peek the next release call number for an artist in a genre (BS#2502, BS#2587)
      description: >-
        Previews the release `code_number` a `POST /library` would assign this
        artist in the given genre — MAX(`code_number`) + 1 for that artist's
        releases WITHIN that genre, and 1 when it has none there, the same
        server-side rule the create path falls back to when `code_number` is
        omitted. Lets the classic add-release form
        prepopulate an editable field with the authoritative next value instead of
        a client-side `max+1`, which the paginated releases list can get wrong.
        Pure read, no side effects.


        `genre_id` is REQUIRED (BS#2587): call numbers are genre-scoped shelves, so
        a preview that didn't ask which shelf could only ever be a guess — an
        artist filed under two genres has two independently-numbered shelves, and
        answering from the wrong one is exactly the defect this parameter closes.
        Breaking change from the prior genre-blind signature.


        Gated at `requirePermissions({ catalog: ['write'] })` — musicDirector or
        above — matching the `/library/artists/peek-code` sibling it mirrors: both
        back the create flow, and both `$ref` the shared `NextCodeNumberResponse`
        in `wxyc-shared/api.yaml` for `next_code_number`.


        The response also carries `slots_in_use` (BS#2588): every occupied
        volume-letter slot on this artist's shelf IN THIS GENRE, keyed by
        `code_number` (as a string) to the UPPER-CASED letters present there.
        `""` denotes the unlettered volume as a MEMBER of the set, not an
        absence — a shelf holding `7` and `7A` reports `"7": ["", "A"]`, so the
        next free letter is `B`. This widens ONLY this operation's own inline
        response schema below, never the shared `NextCodeNumberResponse` shape
        `/library/artists/peek-code` also uses — artist codes have no volume
        dimension, so that sibling's declared body is unchanged. `app.yaml` is
        Swagger-UI documentation only, not a codegen source, so `slots_in_use`
        is additionally tracked as its own follow-up in `wxyc-shared/api.yaml`
        (see the companion issue linked from BS#2588) rather than declared here
        alone. Both fields come out of ONE shelf read -- the volume letters and
        the MAX(`code_number`) are taken over the same rows -- so they cannot
        disagree with each other across a concurrent filing.
      security:
        - BearerAuth: ['station-management']
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: genre_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        '200':
          description: The next release call number for the artist in that genre
          content:
            application/json:
              schema:
                type: object
                properties:
                  next_code_number:
                    type: integer
                  slots_in_use:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                    description: >-
                      Occupied volume letters per `code_number` on this
                      artist's shelf in the queried genre. Keys are
                      `code_number` as strings; values are the UPPER-CASED
                      letters present, with `""` for the unlettered volume.
        '400':
          description: Malformed artist id, or missing/malformed genre_id
        '404':
          description: Artist not found

  /library/crossreferences/artists:
    get:
      summary: List the legacy artist-to-artist cross-references
      description: >
        Successor to `/wxycdb`'s `xrefsToLibraryCodes.jsp` — the whole
        `artist_crossreference` collection, the "see also" pointers a librarian
        filed between two artist cards. READ ONLY, deliberately: WXYC/wiki#89's
        decision D5 freezes this set at the tubafrenzy cutover ("post-cutover
        artists don't gain aliases; unfreezing is a future ticket"), so there is
        no create, update, or delete sibling and adding one would unfreeze it.


        Enforced by `requirePermissions({ catalog: ['write'] })` — musicDirector
        or above. A READ at the write tier, matching
        `/library/bmi-performance-list`: `mainmenu.jsp` wraps this link in
        `<c:if test="${user.hasAdminAccess()}">`, unlike the Missing Releases
        and rotation links beside it, and `catalog:write` is the grant that
        selects the same musicDirector + stationManager pair that flag names.


        `target_code_artist_number` is genre-scoped and collapses to the lowest
        `genre_id`, matching `GET /library/artists/{id}`; it is null for an
        artist with no `genre_artist_crossreference` row. Only the TARGET
        carries a call number, matching the JSP's columns. Ordered by the
        cross-referencing artist's name, then both FK columns — the Postgres
        mirror of this table has no primary key, so the FK pair is what makes
        the order total and the pages stable.


        **Known divergence 1 — the code is genre-collapsed.** The JSP renders
        `ArtistLibraryCode.getFullLibraryCode()`, which is
        `genreName + " " + callLetters + " " + callNumbers` (e.g. `Jazz BA 7`),
        because a tubafrenzy cross-reference points at one `LIBRARY_CODE` row
        and that row IS one `(artist, genre)` placement. `artist_crossreference`
        stores only the two artist ids, so the placement the librarian chose is
        not recoverable, and `target_code_genre_id` /
        `target_code_artist_number` report the target's LOWEST-`genre_id`
        filing instead. An artist filed in both Jazz and Rock therefore renders
        its Jazz code here where the JSP may have rendered its Rock one.
        `target_code_genre_id` is served precisely so a client can label which
        filing it got rather than showing a bare, unattributed `BA 7`.


        **Known divergence 2 — no `Time Last Modified`.** The JSP renders that
        column and this response omits it. To be precise about why, because an
        earlier version of this note was wrong: tubafrenzy's
        `LIBRARY_CODE_CROSS_REFERENCE` **does** carry `TIME_LAST_MODIFIED` and
        `TIME_CREATED` (both `bigint`) **and** a `PRIMARY KEY (ID)`, and its JSP
        listing is `findAllByModifiedDesc()` — `ORDER BY TIME_LAST_MODIFIED
        DESC`, i.e. newest-edit-first. It is the Postgres MIRROR that has
        neither timestamp nor primary key, because `jobs/library-etl`'s
        cross-reference fetch never selected those columns. So carrying the
        field would RECOVER data rather than invent it, and the alphabetical
        order above is a different VIEW rather than a substitute for an order
        that never existed. Recovery is a scoped decision with a real deadline —
        the window closes with the final tubafrenzy mysqldump — tracked as
        WXYC/Backend-Service#2423; it is deliberately out of scope for the
        endpoint that first exposed the gap.
      security:
        - BearerAuth: ['catalog-write']
      parameters:
        - in: query
          name: page
          required: false
          description: Zero-based page index.
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: limit
          required: false
          description: >
            Defaults above the whole frozen collection (119 rows at most) so a
            caller can fetch it in one request.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        '200':
          description: >
            One page of artist cross-references. An empty collection is a 200
            with `total: 0` — the JSP's "There are no Library Code
            Cross-References" state — not a 404.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        source_artist_id:
                          type: integer
                        source_artist_name:
                          type: string
                        target_artist_id:
                          type: integer
                        target_artist_name:
                          type: string
                        target_code_letters:
                          type: string
                        target_code_genre_id:
                          type: integer
                          nullable: true
                          description: >
                            Which genre filing `target_code_artist_number`
                            belongs to — the target artist's lowest `genre_id`.
                            Always describes the same
                            `genre_artist_crossreference` row as the number
                            beside it. Null together with that number when the
                            target has no crossreference row at all.
                        target_code_artist_number:
                          type: integer
                          nullable: true
                        comment:
                          type: string
                          nullable: true
                  total:
                    type: integer
                  page:
                    type: integer
                  totalPages:
                    type: integer
        '400':
          description: Invalid page or limit

  /library/crossreferences/releases:
    get:
      summary: List the legacy artist-to-release cross-references
      description: >
        Successor to `/wxycdb`'s `xrefsToLibraryReleases.jsp` — the whole
        `artist_library_crossreference` collection, the pointers a librarian
        filed from an artist card to a specific release. READ ONLY for the same
        reason as its artist sibling; WXYC/wiki#89 D5 drops this set rather than
        freezing it, which is a still stronger argument against a write path.


        Enforced by `requirePermissions({ catalog: ['write'] })` — musicDirector
        or above, same `hasAdminAccess()` reasoning as the sibling above.


        Each row carries TWO artists: `artist_id`/`artist_name` is the
        cross-REFERENCING artist, `album_artist_name` is whoever the
        cross-referenced release is filed under. They are usually different —
        that difference is the association the row records. The call number
        belongs to the release and ships as PARTS (`code_letters` +
        `code_artist_number` + `code_number` + `code_volume_letters`), matching
        `GET /library/artists/{id}/releases`, not as a composed string.
        `code_artist_number` is genre-scoped (hence the per-row `genre_id`) and
        is null when the release's artist has no `genre_artist_crossreference`
        row for that genre — LEFT joined so a frozen legacy row can never
        silently vanish from a listing nothing else reproduces.


        Known divergence from the JSP: no "Time Last Modified". Same correction
        as the artist sibling above — tubafrenzy's `RELEASE_CROSS_REFERENCE`
        carries `TIME_LAST_MODIFIED`, `TIME_CREATED` and `PRIMARY KEY (ID)`, and
        its JSP likewise lists via `findAllByModifiedDesc()`; it is the Postgres
        mirror that has none of them, because `jobs/library-etl` never selected
        those columns. Serving the field would recover data, not invent it, and
        the alphabetical order here is a different view rather than a substitute
        for a missing one. Pending the recovery decision in
        WXYC/Backend-Service#2423, which is time-bounded by the final tubafrenzy
        mysqldump.
      security:
        - BearerAuth: ['catalog-write']
      parameters:
        - in: query
          name: page
          required: false
          description: Zero-based page index.
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        '200':
          description: >
            One page of release cross-references. An empty collection is a 200
            with `total: 0` — the JSP's "There are no Library Release
            Cross-References" state — not a 404.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        artist_id:
                          type: integer
                        artist_name:
                          type: string
                        library_id:
                          type: integer
                        album_title:
                          type: string
                        album_artist_name:
                          type: string
                          nullable: true
                        alternate_artist_name:
                          type: string
                          nullable: true
                        format_name:
                          type: string
                        genre_id:
                          type: integer
                        code_letters:
                          type: string
                        code_artist_number:
                          type: integer
                          nullable: true
                        code_number:
                          type: integer
                        code_volume_letters:
                          type: string
                          nullable: true
                        comment:
                          type: string
                          nullable: true
                  total:
                    type: integer
                  page:
                    type: integer
                  totalPages:
                    type: integer
        '400':
          description: Invalid page or limit

  /library/deleted:
    get:
      summary: List the catalog-delete archive
      description: >
        BS#2561 (F2a) — the read half of the `catalog_delete_snapshot`
        archive `DELETE /library/{id}` writes to (BS#2560). Newest batch
        first (`captured_at DESC`). A "batch" is every row
        `captureCatalogDeleteSnapshot` wrote under one `batch_id`, and every
        batch holds exactly one entity — `entity_kind: 'library'` from
        `DELETE /library/{id}` or `'artist'` from `DELETE
        /library/artists/{id}`. Neither writer can produce a mixed batch: the
        artist delete refuses outright when the artist holds any release, so
        it never captures an artist together with its releases. Clients must
        still read `entities` as a list — it is ordered parent before child
        (artist before any library rows that reference it) should a future
        writer group both — but must not code for a multi-entity batch
        arriving today.


        Enforced by `requirePermissions({ catalog: ['write'] })` — the same
        bar as the delete that writes these rows, not `catalog:read` like the
        rest of this router's catalog listings: a batch's `entities[].row`
        is the deleted card's own content, and `actor` names who deleted it,
        which `library_delete_denylist`'s docstring treats as audit data
        rather than a DJ-facing read.


        `search`, when given, is a plain substring match (case-insensitive)
        over the captured entity's name fields (`album_title`, `artist_name`,
        `alternate_artist_name`) — NOT the field-scoped `artist:`/`album:`
        syntax `GET /library/query`'s `q` parses. `captured` is `jsonb` with
        no indexed text column, and the volume (a handful of deletes a week)
        doesn't justify extracting and indexing one.


        `unrecoverable` names the dependents no envelope captures and a restore
        therefore cannot bring back. **It depends on the batch's
        `entity_kind`** — a release and an artist lose entirely different
        tables, so this is not a constant.


        For a `library` batch: `album_metadata`, `library_identity`,
        `library_identity_source`, `uncovered_release_search_markers` (all
        four rebuilt by their own jobs) and `album_review_submissions` (`ON
        DELETE SET NULL` — the row survives unlinked, and its `reviewer_raw`
        is PII behind ADR 0011's projection barrier, so this endpoint never
        reads that table).


        For an `artist` batch: `artist_search_alias`,
        `artist_similar_artists`, `artist_station_plays` (the first three
        cascade away; the latter two are rebuilt by their own jobs) plus
        `concerts` and `concert_performers` (`ON DELETE SET NULL` — those rows
        survive with the artist link cleared). `artist_similar_artists` also
        covers a pointer no FK protects: other artists'
        `neighbors` jsonb keeps the deleted `artist_id`, and that jsonb is the
        `Concert.similar_artists` wire shape, so `GET /concerts` can serve a
        deleted artist's id until the nightly enrichment overwrite clears it.


        A batch's value is the union over the kinds it holds, so a client
        should treat it as an unordered set of table names rather than a fixed
        list.


        `restorable` (BS#2616) says whether `POST
        /library/deleted/{batchId}/restore` can EVER bring this batch back —
        `false` for a batch holding any `entity_kind` the restore endpoint has
        no replay plan for, computed from the exact same exported set the
        restore's `409 unrestorable_kind` refusal reads, so the two cannot
        drift. An `artist` batch reads `false` today: the artist delete
        writes a `catalog_delete_snapshot` row, but no replay plan exists for
        it (an artist's shelf slot has no tombstone and needs its own
        conflict probe — full artist restore is unbuilt, not merely
        unwired). A `library` batch reads `true`. A batch holding several
        entities is `restorable` only if every one of them is, since the
        restore endpoint refuses the whole batch on the first kind it can't
        replay. Also `false` if any entity's captured envelope is missing
        its row — the same corruption the restore endpoint's own 500 guards
        against — so `restorable` answers for envelope health, not just
        `entity_kind`.


        `restorable: true` is NOT a promise that a restore attempt will
        succeed — it means this batch's kind has a working replay plan and
        a parseable envelope, nothing more. A restorable batch can still
        answer `already_present`, `resolution_required` (a shelf-slot
        conflict a client must resolve), or `lock_unavailable`.
        `restorable: false` is the hard guarantee: the endpoint refuses
        every such batch with `409 unrestorable_kind` before any row lock
        or write.


        `entities[].children` is per-child-table ROW COUNTS, not the rows —
        `catalog_delete_snapshot.captured` holds full, unprojected child rows
        (`bins.dj_id`/`track_title`, `reviews.author` plus the full review
        text, `album_critic_reviews.author`, …) because a restore
        legitimately needs every column, but this listing is read by any
        `catalog: ['write']` principal, not by whoever has a legitimate need
        to see who binned a release or another DJ's review text. Applying
        the same ADR 0011 standard `catalog_delete_snapshot`'s own docstring
        sets for `album_review_submissions` — "any second reader must carry
        the same exclusion" — to this second READ SURFACE: a librarian sees
        `{ "bins": 3, "reviews": 1 }`, never the rows themselves. The capture
        side is unaffected; the restore endpoint reads the envelope
        directly.
      security:
        - BearerAuth: ['catalog-write']
      parameters:
        - in: query
          name: page
          required: false
          description: Zero-based page index.
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: search
          required: false
          description: >
            Substring match over the captured entity's name fields. Omitted
            or blank means no filter.
          schema:
            type: string
      responses:
        '200':
          description: >
            One page of delete batches. An empty archive is a 200 with
            `total: 0`, not a 404.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        batch_id:
                          type: string
                          format: uuid
                        captured_at:
                          type: string
                          format: date-time
                        actor:
                          type: object
                          description: >-
                            Attribution for the delete. Carries no email: the
                            snapshot stores `actor_email` for restore
                            attribution, but `docs/pii.md` does not list an
                            archive listing among the permitted read sites for
                            a PII email, so callers resolve `user_id` through
                            roster admin instead.
                          properties:
                            user_id:
                              type: string
                              nullable: true
                            role:
                              type: string
                              nullable: true
                        entities:
                          type: array
                          items:
                            type: object
                            properties:
                              entity_kind:
                                type: string
                              table:
                                type: string
                              row:
                                type: object
                                nullable: true
                                description: The deleted parent row itself, every non-generated column.
                              children:
                                type: object
                                additionalProperties:
                                  type: integer
                                description: >
                                  Child table name -> COUNT of rows that referenced the deleted
                                  parent, not the rows themselves (ADR 0011 standard applied to
                                  this read surface — see the operation description).
                        unrecoverable:
                          type: array
                          items:
                            type: string
                        restorable:
                          type: boolean
                  total:
                    type: integer
                  page:
                    type: integer
                  totalPages:
                    type: integer
        '400':
          description: Invalid page, limit, or search

  /library/deleted/{batchId}/restore:
    post:
      summary: Restore a deleted catalog batch (BS#2585)
      description: >
        BS#2585 (F2b) — the write half of `GET /library/deleted`. Replays one
        captured batch out of `catalog_delete_snapshot` back into the catalog in
        ONE transaction, parent row before any child that references it
        (`rotation` before `rotation_urls`, `digital_asset` before
        `digital_asset_file`). Every failure rolls the whole batch back: no
        partial restore is observable, because a half-restored artist is worse
        than a declined one.


        Restore is BATCH-scoped, not row-scoped. An artist and its releases
        were deleted together and must come back together, or the releases
        return orphaned under an artist id that no longer exists. Every batch
        holds exactly one entity — the artist delete refuses outright when
        the artist holds any release, so it captures the artist alone, and no
        call site groups more than one.


        Rows come back under the primary keys they had before the delete, so
        every captured FK stays valid with no rewriting. `unrecoverable`
        depends on the batch's `entity_kind`.


        For a `library` batch, the five dependents no envelope ever captures
        are NOT synthesized — `album_metadata`, `library_identity`,
        `library_identity_source` and `uncovered_release_search_markers` are
        derived and their own jobs rebuild them, and `album_review_submissions`
        is `ON DELETE SET NULL`, so that submission survived the delete with a
        NULL `album_id` and there is nothing to replay. This endpoint never
        reads that table: its `reviewer_raw` column is PII behind ADR 0011's
        enumerated-projection barrier.


        An `artist` batch is not restorable through this endpoint. Its
        `unrecoverable` list — `artist_search_alias`, `artist_similar_artists`,
        `artist_station_plays`, `concerts` and `concert_performers` —
        describes what the delete itself could not capture, not what a
        restore would drop, since no restore of an artist batch happens.


        The restore also clears the release's `library_delete_denylist` row, or
        `jobs/library-etl` would report the restored release as a stranded
        resurrection and exit non-zero on every run.


        **The reissued-code decision is the ordinary path, not an edge case.**
        Retention is permanent, so a card deleted three years ago usually finds
        its shelf slot taken. "Taken" means taken on the real slot —
        `(artist_id, genre_id, code_number,
        upper(coalesce(code_volume_letters, '')))`, the key
        `jobs/library-call-number-dedup` merges on. It is deliberately NOT
        `albumCodeNumberTaken`'s genre-blind `(artist_id, code_number)`:
        measured against production on 2026-09-18 that predicate sees 3,308
        apparent collisions where the true slot key sees 273, so using it would
        decline or relocate restores whose slot was free
        (WXYC/Backend-Service#2579 owns the fix; this endpoint does not wait on
        it). When the slot is occupied, the endpoint refuses with `400
        resolution_required` rather than guessing — silently relocating puts two
        cards on one shelf slot, silently refusing makes a permanent archive
        useless. Re-send with `resolution` to pick an arm. A `resolution` sent
        against a batch with no conflict is moot, not an error. The card's
        ORIGINAL code stays on the archive record either way; nothing here
        writes to `catalog_delete_snapshot`.
      security:
        - BearerAuth: ['catalog-write']
      parameters:
        - in: path
          name: batchId
          required: true
          description: >
            `catalog_delete_snapshot.batch_id` — a UUID. A non-UUID segment is a
            400, not a 500.
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        description: >
          Omit entirely (or send `{}`) for a restore into a free slot. `resolution`
          is consulted ONLY when the slot is occupied.
        content:
          application/json:
            schema:
              type: object
              properties:
                resolution:
                  type: string
                  enum: ['next_free_code', 'decline']
                  description: >
                    `next_free_code` files the card at the conflict's
                    `next_free_code_number` — the next free code on that
                    genre-scoped shelf. `decline` leaves it in the archive and
                    writes nothing, answering 409 `restore_declined`.
      responses:
        '200':
          description: The batch was replayed.
          content:
            application/json:
              schema:
                type: object
                required: ['batch_id', 'entities']
                properties:
                  batch_id:
                    type: string
                    format: uuid
                  entities:
                    type: array
                    description: Replayed entities in the order they were written, parent first.
                    items:
                      type: object
                      required: ['entity_kind', 'entity_id', 'table', 'relocated_code_number', 'children']
                      properties:
                        entity_kind:
                          type: string
                          example: library
                        entity_id:
                          type: integer
                          description: The `library.id` the card had before the delete, and has again.
                        table:
                          type: string
                          example: library
                        relocated_code_number:
                          type: integer
                          nullable: true
                          description: >-
                            The code the card came back under. Non-null ONLY on the
                            `next_free_code` arm; null means it went back into its own slot.
                        children:
                          type: object
                          additionalProperties:
                            type: integer
                          description: Child table name -> rows replayed.
                          example: { bins: 3, reviews: 1, rotation: 0 }
        '400':
          description: >-
            Either a malformed request (non-UUID `batchId`, non-object body,
            unrecognized `resolution`) — the service's standard error shape — or
            the reissued-code refusal below, which carries the conflict instead
            so the caller can ask the librarian and re-send. The refusal is a
            400 and not a 409 on purpose: the request was under-specified, not
            refused on the merits.
          content:
            application/json:
              schema:
                type: object
                description: 'Refused: the call code is held by another release and no resolution was given'
                required: ['message', 'reason', 'conflicts']
                properties:
                  message:
                    type: string
                  reason:
                    type: string
                    enum: ['resolution_required']
                  conflicts:
                    $ref: '#/components/schemas/RestoreSlotConflicts'
        '404':
          description: No `catalog_delete_snapshot` rows carry this `batch_id`.
        '409':
          description: >-
            Refused on the merits, and nothing was written. `already_restored`
            means the captured parent id is already present in the catalog —
            the idempotent answer to a double-click. `restore_declined` is the
            second arm of the reissued-code decision: the librarian chose to
            leave the card in the archive. `unrestorable_kind` (BS#2616) is a
            PERMANENT refusal, not a retryable one: this batch holds an
            `entity_kind` — an `artist` batch, today — that has no replay plan
            at all, answered before any row lock or write. `GET
            /library/deleted`'s `restorable` field says the same thing about
            the same batch off the identical exported set, so a client can
            render this without pressing the button first. `409`, not `404`,
            because the batch exists and the request is well-formed — this is
            a refusal on the merits, same posture as the other two reasons
            here. The body is deliberately not this service's standard error
            shape, for the same reason `DELETE /library/{id}`'s 409 is not:
            the specifics ARE the refusal.
          content:
            application/json:
              schema:
                type: object
                required: ['message', 'reason']
                properties:
                  message:
                    type: string
                  reason:
                    type: string
                    enum: ['already_restored', 'restore_declined', 'unrestorable_kind']
                  entity_ids:
                    type: array
                    description: Present on `already_restored` — the parent ids already in the catalog.
                    items:
                      type: integer
                  conflicts:
                    $ref: '#/components/schemas/RestoreSlotConflicts'
                  entity_kind:
                    type: string
                    description: Present on `unrestorable_kind` — the kind this batch holds that has no replay plan.
        '503':
          description: >-
            The restore stood down rather than wait on rows (or the restore
            advisory lock) a live writer holds. Retryable, and says nothing
            about whether the batch is restorable — the same posture, bound and
            body as `DELETE /library/{id}`'s 503.
          content:
            application/json:
              schema:
                type: object
                required: ['message', 'reason']
                properties:
                  message:
                    type: string
                    example: 'Could not restore: the catalog is being written to right now. Try again in a moment.'
                  reason:
                    type: string
                    enum: ['lock_unavailable']

  /library/formats:
    get:
      summary: Get format list
      responses:
        '200':
          description: List of formats

    post:
      summary: Add new format
      security:
        - BearerAuth: ['station-management']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Successfully added format

  /library/genres:
    get:
      summary: Get genre list
      responses:
        '200':
          description: List of genres

    post:
      summary: Add new genre
      security:
        - BearerAuth: ['station-management']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Successfully added genre

  /library/info:
    get:
      summary: Get album information
      description: >
        Takes exactly one release identifier, in either id space: `album_id`
        (Backend's serial `wxyc_schema.library.id`) or `legacy_release_id` (the
        tubafrenzy `LIBRARY_RELEASE.ID` that external callers hold). Neither is
        required on its own; the server returns 400 only when both are absent.


        `legacy_release_id` wins whenever it is *present* — the server branches
        on presence, before looking at `album_id`. That includes an empty
        `legacy_release_id=`, which takes the branch and 400s even alongside a
        valid `album_id`; a malformed value there is likewise a 400, never a
        fallback (BS#1880).


        The two branches now agree on a miss as well: either unmatched
        identifier is a 404. For `legacy_release_id` that means a library.db
        release not yet synced into Backend Postgres; for `album_id`, no such
        serial. The `album_id` miss was a 200 with an empty body until BS#2212.
      parameters:
        - name: album_id
          in: query
          required: false
          description: >-
            Backend's serial `wxyc_schema.library.id`. Optional: supply this or
            `legacy_release_id`, not both. Parsed strictly, like the sibling
            below and like every `/library/{id}` route: a positive int4 in
            canonical form. Trailing garbage (`65880xyz`), leading zeros, an
            explicit sign, whitespace, and a repeated param are each a 400 —
            never a truncated id resolving a different real release, which is
            what a bare `parseInt` did before BS#2212.
          schema:
            type: integer
        - name: legacy_release_id
          in: query
          required: false
          description: >-
            The release's tubafrenzy `LIBRARY_RELEASE.ID` — Backend's
            `library.legacy_release_id` column, and the id space external
            callers hold (LML's `library_url`, the request line, the wxyc.info
            permalink). This is the inbound-compatibility front door: it is NOT
            Backend's serial `library.id`, and the two spaces are numerically
            coextensive, so passing one where the other belongs resolves a
            different real release rather than failing. Optional: supply this
            or `album_id`, not both.
          schema:
            type: integer
      responses:
        '200':
          description: Album details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
        '400':
          description: Both identifiers absent, or the supplied identifier is not a canonical positive int4
        '404':
          description: The supplied identifier matched no catalog row

  /schedule:
    get:
      summary: Get schedule
      responses:
        '200':
          description: List of scheduled shows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schedule'

    post:
      summary: Add to schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Schedule'
      responses:
        '200':
