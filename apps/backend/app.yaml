      description: >
        The same `OnAirDJ` rows `/flowsheet/shows/recent` carries in `djs[]` —
        both are composed by `composeShowDJList`. Mirrors `OnAirDJ` in
        `wxyc-shared/api.yaml` (the SSOT); this block is Swagger display only.
      responses:
