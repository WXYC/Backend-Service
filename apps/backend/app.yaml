          description: List of active DJs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      nullable: true
                      description: >
                        The DJ's better-auth `auth_user.id` — an opaque
                        `varchar(255)` string, not an integer. Null for a
                        legacy/tubafrenzy-mirrored show whose on-air DJ has no
                        Backend-Service account.
                    dj_name:
                      type: string
                      nullable: true
                      description: >
                        The public on-air handle, never a legal name. Null when
                        `resolveDjDisplayName` filters the handle away — a blank
                        value or the literal "Anonymous" (BS#1286) — which
                        `/flowsheet/shows/recent` reports as null too. Always
                        present on the wire, carrying null.

