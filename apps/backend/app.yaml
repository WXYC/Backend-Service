  /library/catalog:
    get:
      summary: Bulk catalog export (gzipped NDJSON, conditional-GET)
      description: >
        Returns the entire music library catalog as one gzipped NDJSON body
        (one JSON object per line) for clients that clone the catalog on-device
        (e.g. iOS Core Spotlight indexing). Freshness is gated by the catalog
        watermark: send `If-Modified-Since` (or `?since=`) and receive `304 Not
        Modified` while the catalog is unchanged (it changes ~daily, after the
        library ETL sync), or a fresh `200` with the full payload when it has
        advanced. `rotation_bin` and `rotation_kill_date` are exported raw (the
        most-recently-added rotation record per album); the client evaluates
        "in rotation" against its own clock as
        `rotation_bin != null && (rotation_kill_date == null || rotation_kill_date > today)`.
      security:
        - BearerAuth: ['catalog-read']
      parameters:
        - name: If-Modified-Since
          in: header
          required: false
          description: RFC 9110 HTTP date from a prior response's `Last-Modified`.
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: Alternative to `If-Modified-Since` (any parseable date string).
          schema:
            type: string
      responses:
        '200':
          description: Full catalog as gzipped NDJSON. One CatalogExportRow per line.
          headers:
            Last-Modified:
              description: Catalog watermark; echo back as `If-Modified-Since`.
              schema:
                type: string
            Content-Encoding:
              description: '`gzip` when the request accepts gzip.'
              schema:
                type: string
            Vary:
              schema:
                type: string
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/CatalogExportRow'
        '304':
          description: Catalog unchanged since `If-Modified-Since` / `since`.
        '401':
          description: Missing or invalid bearer token.

  /library/catalog/compilation-tracks:
    get:
      summary: Bulk compilation-track (CTA) export (gzipped NDJSON, conditional-GET)
      description: >
        Sibling of `GET /library/catalog` for the Backend-sourced library.db
        producer (BS#1965 / discogs-etl#351): every compilation_track_artist row
        as one gzipped NDJSON body (one CatalogCompilationTrackRow per line), so
        the producer can build library.db's `compilation_track_artist` table over
        HTTP. Same `library_watermark` conditional-GET (`If-Modified-Since` /
        `?since=` -> `304`) as the library export. Rows are keyed on
        `legacy_release_id` (the owning library row's surrogate key) and ordered
        by it.

        A CTA row is emitted only if its owning library row is itself eligible
        for `GET /library/catalog` — same four INNER JOINs, notably
        `genre_artist_crossreference` on the (artist_id, genre_id) pair. An
        unfiltered export would ship `library_release_id` values that join to
        nothing in the `library` table the sibling endpoint produces.
      security:
        - BearerAuth: ['catalog-read']
      parameters:
        - name: If-Modified-Since
          in: header
          required: false
          description: RFC 9110 HTTP date from a prior response's `Last-Modified`.
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: Alternative to `If-Modified-Since` (any parseable date string).
          schema:
            type: string
      responses:
        '200':
          description: All CTA rows as gzipped NDJSON. One CatalogCompilationTrackRow per line.
          headers:
            Last-Modified:
              description: Catalog watermark; echo back as `If-Modified-Since`.
              schema:
                type: string
            Content-Encoding:
              description: '`gzip` when the request accepts gzip.'
              schema:
                type: string
            Vary:
              schema:
                type: string
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/CatalogCompilationTrackRow'
        '304':
          description: Catalog unchanged since `If-Modified-Since` / `since`.
        '401':
          description: Missing or invalid bearer token.

  /library/bmi-performance-list:
    get:
      summary: BMI played-works export for a date range (BS#1500)
      description: >
        Successor to tubafrenzy's `recentBMI` servlet: the played musical works the
        station librarian submits to BMI for royalty reporting. Reads `flowsheet` track
        rows with a usable artist whose `add_time` falls in the half-open `[from, to]`
        window (the whole `to` day is included), ordered chronologically, and returns the
        rows plus a composer-provenance `coverage` summary the dj-site admin tool previews
        before submit. Gated to MD/SM via `catalog:['write']`. The window width is capped
        (max 366 days); the exact BMI submission text format and the artist-proxy inclusion
        default are finalized in #1507 and do not change this envelope.
      security:
        - BearerAuth: ['catalog-write']
      parameters:
        - name: from
          in: query
          required: true
          description: Inclusive start of the window, `YYYY-MM-DD` (UTC-day boundary).
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Inclusive end of the window, `YYYY-MM-DD`. Must not precede `from`; the window may span at most 366 days.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Played works in the window plus the coverage summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BmiPerformanceList'
        '400':
          description: Missing, malformed, out-of-order, or too-wide `from`/`to` range.
        '401':
          description: Missing or invalid bearer token.
        '403':
          description: Authenticated role lacks `catalog:write` (below musicDirector).

  /library/rotation:
    get:
      summary: Get rotation list
      responses:
        '200':
          description: List of rotations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rotation'

    post:
      summary: Add new rotation
      security:
        - BearerAuth: ['station-management']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRotationRequest'
      responses:
        '201':
          description: Successfully added rotation
        '400':
          description: >-
            Missing rotation_bin; neither album_id nor a valid artist/title
            pair given; album_id not a positive integer; or a snapshot
            field over 128 characters.

    patch:
      summary: Set rotation removal date
      security:
        - BearerAuth: ['station-management']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rotation_id:
                  type: integer
                kill_date:
                  type: string
                  format: date
      responses:
        '200':
          description: Successfully set rotation removal date

  /library/rotation/uncatalogued:
    get:
      summary: List uncatalogued rotation releases (cataloging backlog queue)
      description: >-
        BS#2109. Rotation rows with no linked library release (`album_id IS
        NULL`) — the "Import to Library" backlog a librarian works through
        via `PATCH /library/rotation/{rotation_id}/link`. Deliberately NOT
        deduplicated the way `GET /library/rotation`'s dropdown shape is:
        two physically distinct promos sharing an artist and title are two
        separate rows to catalogue, not one. Not restricted to active
        (`kill_date`) rows — this is the full cataloging backlog, not a
        live dropdown. `limit` defaults to its 500 maximum rather than to
        the whole backlog (~3.8k rows, ≈700 KB of JSON); page with
        `offset` to walk past it.
      security:
        - BearerAuth: ['catalog-read']
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Uncatalogued rotation rows, newest add_date first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UncataloguedRotationRow'
        '400':
          description: Malformed limit or offset.
        '401':
          description: Missing or invalid bearer token.

  /library/rotation/{rotation_id}/link:
    patch:
      summary: Link an uncatalogued rotation row to a library release
      description: >-
        BS#2109. The "Import to Library" step of the tubafrenzy `/wxycdb`
        workflow: attaches a `library` release to a rotation row that was
        added without one. Rejects double-linking (409). Deliberately does
        NOT clear artist_name/album_title/record_label — they're left
        populated so the tracklist picker (`GET
        /library/rotation/{rotation_id}/tracks`) can still resolve a
        release via LML free-text lookup until `discogs_release_id` is
        independently backfilled; display elsewhere is unaffected because it
        reads through the library join once album_id resolves.
      security:
        - BearerAuth: ['catalog-write']
      parameters:
        - name: rotation_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['album_id']
              properties:
                album_id:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Linked rotation row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UncataloguedRotationRow'
        '400':
          description: rotation_id is not a positive integer, or album_id is missing/not a positive integer.
        '401':
          description: Missing or invalid bearer token.
        '404':
          description: Rotation entry not found, or album not found.
        '409':
          description: Rotation entry is already linked to a library release.

  /library/rotation/{id}:
    patch:
      summary: Field-level edit of a rotation release (BS#2113)
      description: >
        Partial update of the five columns that actually exist on `wxyc_schema.rotation`:
        `artist_name`, `album_title`, `record_label`, `add_date`, `kill_date`. Only the
        fields present in the body are validated and written, so a typo fix on one field
        cannot wipe another. Gated to MD/SM via `catalog:['write']`.


        **`kill_date: null` clears the column.** This is the one non-obvious part of the
        contract and the only way to un-kill a release through the HTTP surface: sending
        an explicit JSON `null` writes SQL NULL, returning the row to active rotation.
        Omitting `kill_date` entirely leaves the stored value untouched — `null` and
        "absent" are deliberately different, which is why the field is nullable rather
        than merely optional. `PATCH /library/rotation` (the kill endpoint) can only ever
        set a date, never clear one.


        **The `artist_name`/`album_title`/`record_label` snapshot trio is rejected with a
        409 on a rotation row that has an `album_id`.** On a library-linked row the
        rotation read path (`GET /library/rotation`) projects those three from the
        `library`/`artists` join, so a write here would be echoed by the response and then
        be invisible everywhere else; a non-NULL snapshot on a linked row also misroutes
        the flowsheet rotation badge, which partitions its match arms on the invariant that
        a linked row's denormalized names are NULL. Edit the linked release via
        `PATCH /library/{id}` instead. `add_date` and `kill_date` stay editable on a
        catalogued row.


        `alphabetical_name`, `format`, and `format_size` appear on the same legacy editor
        screen but have no `rotation` column, and are rejected with a 400 naming the field
        rather than silently dropped.
      security:
        - BearerAuth: ['catalog-write']
      parameters:
        - name: id
          in: path
          required: true
          description: '`rotation.id` of the row to edit (positive integer).'
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                artist_name:
                  type: string
                  maxLength: 128
                  description: Denormalized artist snapshot. Rejected (409) when the row has an `album_id`.
                album_title:
                  type: string
                  maxLength: 128
                  description: Denormalized album snapshot. Rejected (409) when the row has an `album_id`.
                record_label:
                  type: string
                  maxLength: 128
                  description: Denormalized label snapshot. Rejected (409) when the row has an `album_id`.
                add_date:
                  type: string
                  format: date
                  description: '`YYYY-MM-DD`. Calendar-validated: `2026-09-31` is a 400, not a 500.'
                kill_date:
                  type: string
                  format: date
                  nullable: true
                  description: '`YYYY-MM-DD`, or an explicit `null` to clear the column and return the release to active rotation.'
      responses:
        '200':
          description: >-
            The updated rotation row, projected to the same eight columns
            `GET /library/rotation/uncatalogued` publishes. Not the raw `wxyc_schema.rotation`
            row — that also carries server-derived plumbing (`legacy_rotation_id`,
            `discogs_release_id`, `lml_identity_id`, the attempt-at markers) which this
            endpoint does not publish — and not the joined `GET /library/rotation`
            list-view shape either.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UncataloguedRotationRow'
        '400':
          description: >
            Non-positive/non-integer `id`, empty body, a field with no `rotation` column
            (`alphabetical_name`/`format`/`format_size`), a blank or over-128-character
            text field, or a malformed/impossible `add_date`/`kill_date`.
        '401':
          description: Missing or invalid bearer token.
        '403':
          description: Authenticated role lacks `catalog:write` (below musicDirector).
        '404':
          description: No rotation row with that id.
        '409':
          description: >
            One or more of `artist_name`/`album_title`/`record_label` was sent for a
            rotation row linked to a library release (`album_id` is not NULL). The remedy
            is field-specific: `album_title`/`record_label` are editable via
            `PATCH /library/{album_id}` (`album_title`/`label`); `artist_name` is not —
            `library.artist_name` is derived from the linked `artists` row via `artist_id`,
            and no endpoint currently supports renaming an artist or setting free-text
            `artist_name` on a catalogued release.

  /library/artists:
