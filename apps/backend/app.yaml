      summary: Add new artist
      security:
        - BearerAuth: ['station-management']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                artist_name:
                  type: string
                code_letters:
                  type: string
                genre_id:
