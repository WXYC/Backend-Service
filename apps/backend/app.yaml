  /concerts:
    get:
      summary: List upcoming concerts (On Tour feed)
      description: >-
        Upcoming non-removed concerts windowed on the venue-local calendar
        date `starts_on`, ordered by `starts_on` ascending, paginated.
        `curated=true` narrows to concerts whose headliner resolved — to a
        WXYC catalog artist (`headlining_artist_id`) or to a Discogs artist
        identity (`headlining_discogs_artist_id`, the BS#1614 offline LML
        pass). Requires anonymous session auth.
      parameters:
        - name: curated
          in: query
          schema:
            type: boolean
            default: false
          description: Only concerts with a resolved headliner (catalog FK or Discogs artist id)
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Window start (inclusive) on starts_on; defaults to today (America/New_York)
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: Window end (inclusive) on starts_on; defaults to unbounded
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-indexed)
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Page size
      responses:
        '200':
          description: Paginated list of upcoming concerts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConcertsResponse'
        '400':
          description: Invalid query parameters
        '401':
          description: Authentication required

  /concerts/{id}:
    get:
      summary: Get a single concert by id (public share/deep-link read)
      description: >-
        Public, windowless single-concert read (BS#1694). Unlike the list,
        this endpoint requires NO authentication and applies NO date window:
        past concerts and concerts delisted at the source (tombstoned
        upstream — never deleted, never exposed) are served with whatever
        `status` they last carried, so the wxyc.org/shows share page can
        render "this one's passed" and the iOS universal-link fallback can
        resolve any shared id. 200 responses are publicly cacheable
        (`Cache-Control: public, max-age=300`); handler error responses
        (400/404/5xx) are pinned `no-store` so a shared cache can never
        hold a miss. (The router-level 400 for an undecodable path escape
        carries no cache header; 400 is not heuristically cacheable.) The
        canonical wire contract is `/concerts/{id}` in wxyc-shared/api.yaml
        (the SSOT); this app.yaml is Swagger display only.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The concert's serial id
      responses:
        '200':
          description: The concert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Concert'
        '400':
          description: Malformed id (non-integer, non-positive, or an undecodable path escape)
        '404':
          description: No concert with this id exists

  /album-reviews:
    get:
      summary: List archived DJ album-review submissions (internal, role-gated)
      description: >-
        Album-review submissions from the WXYC album-review Google Form
        archive (ADR 0011), ordered by submitted_at descending (nulls
        last), paginated. Filterable by linked library album or by artist
        name (normalized exact match). Deliberately not /reviews, which is
        reserved for the in-app Review model (ADR 0006).

        INTERNAL SURFACE. Requires a station role (`album_reviews:read` — dj,
        musicDirector, or stationManager); an anonymous session carries no role
        claim and is rejected with 403. It serves the WHOLE archive with NO
        `social_consent` filter, because the form's consent question asked only
        about outside publication ("shared on social media platforms... AKA blog
        and/or Instagram") and internal station tools were never in its scope.
        Submissions with no review body are excluded.

        The consent-gated PUBLIC surface is the `wxycReviews` array attached to
        GET /proxy/metadata/album, which is anonymous-reachable and applies a
        hard `social_consent = true` filter. Do not conflate the two.

        Reviewer names are never included in responses, on either surface,
        regardless of the consent answer. This block is Swagger display only;
        the SSOT is wxyc-shared/api.yaml.
      parameters:
        - name: album_id
          in: query
          schema:
            type: integer
          description: Return only submissions linked to this library album id.
        - name: artist
          in: query
          schema:
            type: string
          description: Artist-name filter; matched against the submission's normalized artist name (case-insensitive, leading-"the"-insensitive).
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-indexed)
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Page size
      responses:
        '200':
          description: Paginated list of album-review submissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumReviewsResponse'
        '400':
          description: Invalid query parameters
        '401':
          description: Authentication required
        '403':
          description: Authenticated but without the `album_reviews:read` permission (anonymous sessions and the `member` role)

  /digital-archive/albums/{id}/playback:
    get:
      summary: Presigned playback manifest for a digital-archive album (BS#2320)
      description: >-
        Presigned playback manifest into the auto-DJ Space for the digital
        archive bound to library album {id} (epic WXYC/wxyc-dj-ios#135).
        Merges every `bound` digital_asset for the album (a multi-disc set
        today, eventually a cd_rip alongside a rotation_upload) — no
        precedence rule; provenance is reported per track. Ordered by
        (disc_number, track_number NULLS LAST, title). Serves every codec the
        archive holds, not just mp3.

        Gated at `dj`+ (`digital_archive:listen`) AND behind
        DIGITAL_ARCHIVE_STREAMING_ENABLED, checked before any DB read. 403
        means the feature is off or the caller is below dj; 404 means the
        caller is permitted but nothing is bound and servable — this endpoint
        never returns 200 with an empty tracks array.

        Every URL in the response is a presigned, per-caller bearer
        credential until expires_at: never cache, log, or share it. Response
        carries Cache-Control: private, no-store. This block is Swagger
        display only; the SSOT is wxyc-shared/api.yaml.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The album's library.id (the same key CatalogExportRow.id ships).
      responses:
        '200':
          description: Presigned playback manifest with at least one playable track
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalArchivePlaybackManifest'
        '400':
          description: Malformed id (non-integer or non-positive)
        '401':
          description: Authentication required
        '403':
          description: DIGITAL_ARCHIVE_STREAMING_ENABLED is off, or the caller is below `dj` (anonymous sessions and the `member` role)
        '404':
          description: No bound digital-archive asset with a servable file exists for this album
