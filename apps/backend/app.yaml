                code_number:
                  type: integer
      responses:
        '200':
          description: Successfully added artist

  /library/artists/search:
    get:
      summary: Prefix-search artists within a genre (catalog add-entry autocomplete)
      security:
        - BearerAuth: ['station-management']
      parameters:
        - in: query
          name: genre_id
          required: true
          schema:
            type: integer
        - in: query
          name: q
          required: true
          description: Prefix to match against artist names (minimum 2 characters)
          schema:
            type: string
            minLength: 2
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        '200':
          description: Matching artists with their per-genre code numbers
          content:
            application/json:
              schema:
                type: object
                properties:
                  artists:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        artist_name:
                          type: string
                        code_letters:
                          type: string
                        code_number:
                          type: integer
        '400':
          description: Invalid genre_id or q
        '404':
          description: Genre not found

  /library/artists/peek-code:
    get:
      summary: Peek next artist code number for a given genre and code letters
      security:
        - BearerAuth: ['station-management']
      parameters:
        - in: query
          name: code_letters
          required: true
          schema:
            type: string
        - in: query
          name: genre_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Next available artist code number

  /library/artists/by-code:
    get:
      summary: Resolve a fully-specified library code to the artists that own it
      description: >-
        Resolves `genre_id` + `code_letters` + `code_number` to every artist filed under that
        code. The triple is not unique — the Various-Artists shelf files many distinct buckets
        (`Soundtracks - A`, `Soundtracks - B`, …) under one `V/A` code — so the response is
        always a list, ordered by `artist_name` then `id`. A code with a single owner returns a
        one-element array. `code_letters` must be 1-4 characters from A-Z, 0-9, or `/` (the
        `artists.code_letters` column domain); it is trimmed and upper-cased before matching.
      security:
        - BearerAuth: ['catalog-read']
      parameters:
        - in: query
          name: genre_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - in: query
          name: code_letters
          required: true
          schema:
            type: string
            pattern: '^\s*[A-Za-z0-9/]{1,4}\s*$'
        - in: query
          name: code_number
          required: true
          description: >-
            Accepts 0 — the Various-Artists filings are stored with an artist genre code of 0.
          schema:
            type: integer
            minimum: 0
            maximum: 2147483647
      responses:
        '200':
          description: The artists that own this code, ordered by artist_name then id
          content:
            application/json:
              schema:
                type: object
                properties:
                  artists:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        artist_name:
                          type: string
                        code_letters:
                          type: string
                        code_number:
                          type: integer
                        genre_id:
                          type: integer
        '400':
          description: Invalid or missing genre_id, code_letters, or code_number
        '404':
          description: >-
            Two distinct outcomes, told apart by `reason`, never by the message text.
            `genre_not_found` — no genre has that `genre_id`, so the client's genre list is
            stale and the code was never evaluated. `code_not_assigned` — the genre exists and
            no artist is filed under that exact code.

            `code_not_assigned` is NOT a guarantee that creating an artist under the code is
            safe. This lookup upper-cases `code_letters` before matching, but `artists.code_letters`
            is a plain `varchar(4)` with byte-exact equality and neither writer canonicalizes:
            `insertArtist` only NFC-normalizes, and the tubafrenzy `library-etl` job writes its
            source value verbatim. So a lower-case row filed under the same shelf code is
            invisible here — and `POST /library/artists`, whose own conflict pre-check also
            compares raw, will happily create one. Every row in the production catalog is
            canonical today, so this is an open path rather than existing data; canonicalizing
            on write (plus a backfill) is the real fix and is tracked separately.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  reason:
                    type: string
                    enum: [genre_not_found, code_not_assigned]
              examples:
                genre_not_found:
                  summary: Unknown genre_id
                  value:
                    message: Genre not found
                    reason: genre_not_found
                code_not_assigned:
                  summary: Known genre, unassigned code
                  value:
                    message: Artist code not assigned in that genre
                    reason: code_not_assigned

  /library/artists/{id}:
    get:
      summary: Get an artist's card (BS#2156)
      description: >
        Enforced by `requirePermissions({ catalog: ['read'] })` — DJ role or
        above, the same tier as the other catalog reads documented with the
        `catalog-read` scope.
      security:
        - BearerAuth: ['catalog-read']
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The artist-card field set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistCard'
        '400':
          description: Invalid artist id
        '404':
          description: Artist not found

    patch:
      summary: Update an artist's alphabetical_name (BS#2156)
      description: >
        Enforced by `requirePermissions({ catalog: ['write'] })` — musicDirector
        or above, the same tier as `POST`/`PATCH /library`. `alphabetical_name`
        is capped at 128 characters (the `varchar(128)` column width) and must
        be a non-empty string. `artist_name`, `genre_id`, `code_letters`, and
        `code_artist_number` are real fields on `/wxycdb`'s artist-card form
        but have no write path on this endpoint — sending one is rejected with
        a 400 naming why, not silently dropped. `artist_name` specifically:
        `artists`/`library` are still tubafrenzy-canonical and
        `jobs/library-etl` (a live cron) matches artists by `fold_artist_name`
        and never updates `artists`, so a Backend-side rename would be
        silently duplicated and reverted by the next ETL pass. Re-enabling
        `artist_name` renaming is a follow-up gated on `library-etl` becoming
        a one-shot job.
      security:
        - BearerAuth: ['catalog-write']
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        description: At least one updatable field must be provided.
        content:
          application/json:
            schema:
              type: object
              required: ['alphabetical_name']
              properties:
                alphabetical_name:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: >-
                    Trimmed and NFC-normalized before storage, then measured in
                    CODE POINTS against the `varchar(128)` column. A
                    blank-after-trim value is a 400, not a silent no-op.
      responses:
        '200':
          description: >
            The refreshed artist card — the same field set `GET
            /library/artists/{id}` returns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistCard'
        '400':
          description: >
            Invalid artist id, missing/non-object body, an `artist_name` /
            `genre_id` / `code_letters` / `code_artist_number` field with no
            write path on this endpoint, no updatable fields provided, or
            `alphabetical_name` that is empty or over 128 characters
        '404':
          description: Artist not found

  /library/artists/{id}/releases:
    get:
      summary: List an artist's releases (BS#2156)
      description: >
        Enforced by `requirePermissions({ catalog: ['read'] })` — DJ role or
        above. Offset-paginated in the same `page`/`limit` shape as `GET
        /library/query`. Rows carry the full physical call number
        (`code_letters` + `code_artist_number` + `code_number` +
        `code_volume_letters`); `code_artist_number` is genre-scoped, hence the
        per-row `genre_id`. Ordered by shelf order — `code_number`, then
        `code_volume_letters`, then `id` as a total order.
      security:
        - BearerAuth: ['catalog-read']
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: page
          required: false
          description: Zero-based page index.
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: One page of the artist's releases, in shelf order
          content:
            application/json:
              schema:
                type: object
                properties:
                  artist_id:
                    type: integer
                  releases:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        last_modified:
                          type: string
                          format: date-time
                        format_name:
                          type: string
                        genre_id:
                          type: integer
                        code_letters:
                          type: string
                        code_artist_number:
                          type: integer
                        code_number:
                          type: integer
                        code_volume_letters:
                          type: string
                          nullable: true
                        album_title:
                          type: string
                        alternate_artist_name:
                          type: string
                          nullable: true
                  total:
                    type: integer
                  page:
                    type: integer
                  totalPages:
                    type: integer
        '400':
          description: Invalid artist id, page, or limit
        '404':
          description: Artist not found

  /library/formats:
    get:
      summary: Get format list
      responses:
        '200':
          description: List of formats

    post:
      summary: Add new format
      security:
        - BearerAuth: ['station-management']
      requestBody:
        required: true
