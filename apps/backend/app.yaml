openapi: 3.0.0
info:
  title: WXYC Backend API
  description: API for managing WXYC radio station operations including flowsheets, library, DJs, and schedule
  version: 1.0.0

servers:
  - url: http://localhost:{port}
    variables:
      port:
        default: '8080'
        description: Local API server port
  - url: https://api.wxyc.org

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: JWT token from AWS Cognito

  schemas:
    FlowsheetEntry:
      type: object
      properties:
        artist_name:
          type: string
        album_title:
          type: string
        track_title:
          type: string
        album_id:
          type: number
        rotation_id:
          type: number
        record_label:
          type: string
          description: >
            Free-text label, as the DJ typed it mid-show. Unchanged by BS#2505,
            and still what the read path falls back to wherever the joined
            `rotation_label` (see FlowsheetEntryV2) is null.
        request_flag:
          type: boolean
        track_position:
          type: string
          nullable: true
          description: >
            Discogs `release_track.position` (e.g. "A1", "B2") captured by the
            dj-site flowsheet picker (E6-6, dj-site#501). Optional; `null` for
            entries added without a position. Wired through POST /flowsheet and
            PATCH /flowsheet by BS#943.

    FlowsheetEntryV2:
      type: object
      required: [id, show_id, play_order, add_time, entry_type]
      discriminator:
        propertyName: entry_type
      properties:
        id:
          type: integer
        show_id:
          type: integer
        play_order:
          type: integer
        add_time:
          type: string
          format: date-time
        entry_type:
          type: string
          enum: [track, show_start, show_end, dj_join, dj_leave, talkset, breakpoint, message]
      description: >
        Discriminated union keyed by entry_type.
        track entries include artist_name, album_title, track_title, record_label, rotation_bin, metadata fields.
        track entries also carry rotation_label — the rotation release's CANONICAL label, resolved flowsheet.rotation_id -> rotation.label_id -> labels.label_name (BS#2505). Null when the entry has no rotation link, or when the linked release has no label_id (pre-BS#2412, or a label that never resolved to a labels row); consumers fall back to record_label. Resolved by id with no status filter, so a KILLED release with plays in the window still names its label. Read-only and read-path-only: it is a joined value rather than a flowsheet column, so it cannot live in CLIENT_FACING_FLOWSHEET_COLUMNS (a Pick<> over the table model) and is absent from the POST/PATCH/DELETE echoes on FlowsheetEntry, the same way rotation_bin is. Canonical wire contract: FlowsheetV2TrackEntry.rotation_label in wxyc-shared/api.yaml (the SSOT).
        track entries also carry artist_id — the resolved WXYC catalog artist id (flowsheet.album_id → library.artist_id), additive and nullable (null for free-form entries and library rows with no artist link). Shares the artists.id keyspace with concerts.headlining_artist_id / upcoming_show so on-device features (the On Tour likes match) can intersect a liked playcut against concert headliners (BS#1625). Canonical wire contract: FlowsheetV2TrackEntry.artist_id in wxyc-shared/api.yaml (the SSOT).
        track entries MAY also carry upcoming_show — an optional embedded Concert (see the Concert schema and GET /concerts) attached server-side at feed-assembly time when the track's resolved catalog artist (flowsheet.album_id → library.artist_id) has a curated, non-tombstoned, upcoming Triangle-area date (concerts.headlining_artist_id match; soonest date wins). Absent when there is no such match; older clients decode the absent field as "no touring CTA" (BS#1607). The canonical wire contract is FlowsheetV2TrackEntry.upcoming_show in wxyc-shared/api.yaml (the SSOT); this app.yaml is Swagger display only.
        show_start/show_end entries include dj_name and timestamp.
        dj_join/dj_leave entries include dj_name.
        talkset/breakpoint/message entries include message.
        breakpoint entries also include radio_hour (the authoritative top-of-hour as an ISO date-time, or null) — clients should format this rather than add_time.

    FlowsheetPaginatedResponse:
      type: object
      required: [entries, total, page, limit, totalPages]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/FlowsheetEntryV2'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
        on_air:
          allOf:
            - $ref: '#/components/schemas/OnAirInfo'
          nullable: true
          description: >-
            The DJ currently on air, when known. An OnAirInfo object means a named DJ is live; JSON null means the station is confirmed on automation ("Auto DJ"); the field being absent means the server does not report on-air status and clients should treat it as unknown. Not in required so absence stays distinct from an explicit null.

    OnAirInfo:
      type: object
      required: [dj_name]
      properties:
        dj_name:
          type: string
          description: Display name of the DJ currently on air.

    FlowsheetEntryAdd:
      type: object
      oneOf:
        - allOf:
            - $ref: '#/components/schemas/FlowsheetEntry'
            - type: object
              required: ['artist_name', 'album_title', 'track_title']
        - type: object
          required: ['message']
          properties:
            message:
              type: string

    Show:
      type: object
      properties:
        id:
          type: integer
        primary_dj_id:
          type: integer
        specialty_id:
          type: integer
        show_name:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
          nullable: true

    DJ:
      type: object
      properties:
        id:
          type: integer
        shows_covered:
          type: integer
        add_date:
          type: string
          format: date

    ShowDJ:
      type: object
      properties:
        show_id:
          type: integer
        dj_id:
          type: integer
        active:
          type: boolean

    Album:
      type: object
      description: >
        Abbreviated album-detail summary, referenced here by `GET /library/info`
        (both the `album_id` and the BS#1880 `legacy_release_id` branches) and
        the `PATCH /library/{id}` 200. Four handlers actually return this shape
        — `getAlbumFromDB`'s row verbatim; `/library/{id}/missing` and
        `/library/{id}/found` return it too but declare no response body here.

        Interim divergence note (BS#2170), not drift to delete. The SSOT models
        these responses with two schemas — `AlbumInfoResponse` for
        `/library/info`, `AlbumSearchResult` for the three PATCHes — and
        neither describes them well: both omit nine returned fields,
        `AlbumSearchResult` declares seven search-only properties no
        album-detail handler emits, and `AlbumInfoResponse` types `genre_name`
        as a closed ten-value enum that six of the fifteen production genres
        fall outside. Porting either one here would import a defect and a split
        the implementation does not have. WXYC/wxyc-shared#365 re-models the
        SSOT side; **revisit this note when it lands** rather than treating it
        as a settled answer.

        This file is Swagger-UI display only — not a codegen source and not a
        runtime validator — so its schemas stay abbreviated summaries rather
        than mirrors, and `wxyc-shared/api.yaml` carries the authoritative
        field descriptions.
      properties:
        id:
          type: integer
        legacy_release_id:
          type: integer
          description: >-
            BS#2128. The library.db-producer surrogate key dj-site's track picker
            resolves against; NOT NULL since migration 0137. Sourced from
            getAlbumFromDB, so it is present on both consumers of this schema —
            GET /library/info and the PATCH /library/{id} 200, which is why it
            sits directly on the schema here. The SSOT hangs the same field off
            `AlbumInfoResponse` and omits it from its own `Album`, so the
            identically-named schemas place it at different levels.
        code_letters:
          type: string
        code_artist_number:
          # `genre_artist_crossreference.artist_genre_code`, an integer column.
          # Four sibling schemas in this file already say so; only this one said
          # `string`.
          type: integer
        code_number:
          type: integer
        code_volume_letters:
          type: string
          nullable: true
          description: BS#2564. `library.code_volume_letters`, varchar(4).
        artist_name:
          type: string
        album_title:
          type: string
        record_label:
          type: string
        plays:
          type: integer
        add_date:
          type: string
          format: date-time
        last_modified:
          type: string
          format: date-time

    NewAlbumRequest:
      type: object
      description: >-
        `label` left the required set in BS#2410: at least one of `label` or
        `label_id` must be supplied. With `label_id` alone, Backend resolves
        `labels.label_name` server-side for the denormalized `library.label`
        column and skips label creation; a dangling `label_id` is a 400
        ("label_id does not reference an existing label"). With `label` alone,
        the create-or-reuse-by-exact-name behavior is unchanged. Both may be
        sent together — the `label_id` is still validated and written to the
        FK, and the explicit `label` text wins for the denormalized
        `library.label` column. Mirrors wxyc-shared's `AddAlbumRequest`
        (api.yaml 1.51.0) — that spec is the SSOT; this copy exists because
        nothing in CI catches app.yaml drifting from it.
      required: ['album_title', 'genre_id', 'format_id']
      properties:
        album_title:
          type: string
        artist_name:
          type: string
        artist_id:
          type: integer
        alternate_artist_name:
          type: string
        album_artist:
          type: string
          nullable: true
          description: Credited album artist on a compilation card (BS#2004). Null or empty clears it. Mirrors AddAlbumRequest in the wxyc-shared SSOT.
        label:
          type: string
        label_id:
          type: integer
          minimum: 1
          nullable: true
          description: >-
            BS#2410. Optional `labels(id)` reference; supplying it satisfies
            the label requirement on its own. An explicit `null` means ABSENT
            here, not "clear" — it is treated exactly as an omitted field and
            is neither written nor validated, so the `selected?.id ?? null`
            shape a picker produces needs no client-side pruning. (On `PATCH
            /library/{id}` the same `null` clears the label.) An id that
            references no `labels` row 400s ("label_id does not reference an
            existing label") rather than reaching Postgres as a 23503.
        genre_id:
          type: integer
        format_id:
          type: integer
        code_number:
          type: integer
          minimum: 1
          maximum: 32767
          description: >-
            Operator-chosen release call number (BS#2410). `library.code_number`
            is a Postgres smallint, hence the 32767 ceiling; out-of-range values
            are a 400, not the SQLSTATE 22003 → 500 they would otherwise become.
            Omitted, Backend assigns MAX+1 for the artist within the release's
            genre (BS#2587 — genre-scoped shelves; artist-wide was the
            pre-BS#2410 behavior). No application-level collision check by design
            (single-librarian decision, rotation-import plan D2); the eventual
            DB uniqueness constraint and its 23505 → 409 mapping are tracked on
            #2033.
        code_volume_letters:
          type: string
          maxLength: 4
          description: >-
            Optional volume letters for the release call code (BS#2410;
            `library.code_volume_letters`, varchar(4)). Omitted → NULL.
        disc_quantity:
          type: integer

    AlbumView:
      type: object
      properties:
        id:
          type: integer
        legacy_release_id:
          type: integer
          description: >-
            BS#2128. Present on GET /library only. GET /library/query shares this
            schema but builds its rows through an explicit projection
            (taggedRowToAlbumSearchResultRow) over library_artist_view, which does
            not carry the column until the BS#2129 migration adds it.
        code_letters:
          type: string
        code_artist_number:
          type: integer
        code_number:
          type: integer
        artist_name:
          type: string
        album_title:
          type: string
        format_name:
          type: string
        genre_name:
          type: string
        genre_id:
          type: integer
          description: >-
            BS#2639. The shelf this row is filed on, and the only field that
            separates two shelves of one `artists` row — artist 431 is a
            hip-hop act filed `IS 1` and a rock band filed `IS 13`, so
            `artist_id` and `code_letters` are identical on both. Pair it with
            the artist id when linking to `GET /library/artists/{id}`, whose
            `genre_id` query parameter (BS#2637) it is the source for; the
            artist id alone answers whichever membership sorts lowest.
            `code_artist_number` on this row is the artist's code IN this
            genre, keyed on the same column.
        rotation_bin:
          type: string
          nullable: true
        add_date:
          type: string
          format: date-time
        label:
          type: string
          nullable: true

    CatalogExportRow:
      type: object
      description: >
        One catalog row in the `GET /library/catalog` NDJSON export (BS#1468).
        `rotation_bin` / `rotation_kill_date` are raw (the most-recently-added
        rotation record per album); the client evaluates "in rotation" locally.
        BS#1965 added the four library.db-producer fields (legacy_release_id,
        alternate_artist_name, album_artist, cross_reference_names); the SSOT
        (wxyc-shared api.yaml) carries the authoritative descriptions.
      properties:
        id:
          type: integer
        legacy_release_id:
          type: integer
          nullable: true
        artist_name:
          type: string
        alternate_artist_name:
          type: string
          nullable: true
        album_artist:
          type: string
          nullable: true
        cross_reference_names:
          type: array
          nullable: true
          items:
            type: string
          description: >
            Cross-referenced artist names, in either FK direction, ordered by
            Unicode code point. An ARRAY, not the pipe-joined string library.db
            stores — the producer does the `" | "` join itself, because nothing
            constrains an artist name from containing a pipe. Empty array when
            the artist has no cross-references.
        album_title:
          type: string
        code_letters:
          type: string
        code_number:
          type: integer
        code_artist_number:
          type: integer
        label:
          type: string
          nullable: true
        genre_name:
          type: string
        format_name:
          type: string
        on_streaming:
          type: boolean
          nullable: true
        plays:
          type: integer
          nullable: true
        popularity:
          type: integer
          nullable: true
          description: >
            Attribution-corrected, master-collapsed popularity (BS#1486 Phase-2):
            collapses pressings sharing a Discogs master and folds in resolved
            free-text plays. null when the logical album has no plays. The SSOT
            (wxyc-shared api.yaml) carries the authoritative description.
        artwork_url:
          type: string
          nullable: true
        rotation_bin:
          type: string
          nullable: true
        rotation_kill_date:
          type: string
          format: date
          nullable: true
        has_digital_audio:
          type: boolean
          description: >
            True when the digital archive (BS#2320) has at least one asset
            bound to this album. Forced false for every row when
            DIGITAL_ARCHIVE_STREAMING_ENABLED is off. The SSOT (wxyc-shared
            api.yaml) carries the authoritative description.

    CatalogCompilationTrackRow:
      type: object
      description: >
        One compilation_track_artist row in the `GET
        /library/catalog/compilation-tracks` NDJSON export (BS#1965). Keyed on
        `legacy_release_id` (the owning library row's surrogate key, which the
        producer maps to library.db's compilation_track_artist.library_release_id).
        The SSOT (wxyc-shared api.yaml) carries the authoritative description.
      required:
        - legacy_release_id
        - artist_name
      properties:
        legacy_release_id:
          type: integer
        artist_name:
          type: string
          minLength: 1
          maxLength: 255
        track_title:
          type: string
          maxLength: 255
          nullable: true

    DigitalArchivePlaybackManifest:
      type: object
      description: >
        Response body for GET /digital-archive/albums/{id}/playback (BS#2320,
        wxyc-shared#417/#422). No bucket, key, or store name appears anywhere
        in this shape — only opaque presigned URLs that die at expires_at.
        This block is Swagger display only; the SSOT is wxyc-shared/api.yaml.
      required:
        - library_id
        - expires_at
        - tracks
      properties:
        library_id:
          type: integer
        expires_at:
          type: string
          format: date-time
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/DigitalArchivePlaybackTrack'

    DigitalArchivePlaybackTrack:
      type: object
      description: >
        One track of a DigitalArchivePlaybackManifest. provenance is per-track
        (not per-manifest) because a manifest may merge several bound assets
        for one album.
      required:
        - file_id
        - provenance
        - title
        - renditions
      properties:
        file_id:
          type: integer
        provenance:
          type: string
          enum: [rotation_upload, cd_rip]
        disc_number:
          type: integer
          nullable: true
        track_number:
          type: integer
          nullable: true
        title:
          type: string
        duration_secs:
          type: number
          nullable: true
        content_hash:
          type: string
          nullable: true
        renditions:
          type: array
          items:
            type: object
            required:
              - codec
              - url
            properties:
              codec:
                type: string
                enum: [mp3, aac, flac, m4a, wav]
              bitrate_kbps:
                type: integer
                nullable: true
              url:
                type: string
                format: uri

    BmiPerformanceRow:
      type: object
      description: >
        One played musical work in the `GET /library/bmi-performance-list` export
        (BS#1500). Flat projection of a `flowsheet` track row with a usable artist.
        `composer_source` is raw open-ended text (a source added after the endpoint,
        e.g. `musicbrainz_work`, can appear); consumers should not treat it as a
        closed enum.
      properties:
        artist_name:
          type: string
        track_title:
          type: string
          nullable: true
        album_title:
          type: string
          nullable: true
        record_label:
          type: string
          nullable: true
        composer:
          type: string
          nullable: true
        composer_source:
          type: string
          nullable: true
          description: 'Provenance of `composer`: discogs_track | discogs_release | artist_proxy | a later source | null.'
        played_at:
          type: string
          format: date-time
          description: The play's logging instant (`flowsheet.add_time`), ISO-8601.

    BmiCoverage:
      type: object
      description: >
        Composer-provenance breakdown for the pre-submit preview. The five counts
        partition `total`. `none` = no composer credit at all; `unknown` = a non-null
        `composer_source` outside the known set (a real credit from a later source),
        kept distinct from `none` so a credited play is never reported as having no composer.
      properties:
        total:
          type: integer
        real_track:
          type: integer
        real_release:
          type: integer
        artist_proxy:
          type: integer
        none:
          type: integer
        unknown:
          type: integer

    BmiPerformanceList:
      type: object
      description: The `GET /library/bmi-performance-list` response envelope (BS#1500).
      properties:
        range:
          type: object
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
        coverage:
          $ref: '#/components/schemas/BmiCoverage'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/BmiPerformanceRow'

    Rotation:
      type: object
      properties:
        id:
          type: integer
        legacy_release_id:
          type: integer
          nullable: true
          description: >-
            BS#2128. Null for a library-unlinked rotation row — getRotationFromDB
            LEFT JOINs library, so there is no library row to source the id from.
            The only one of the four flowsheet-consumed reads that can be null;
            the others inner-join library and always carry a value.
        code_letters:
          type: string
        code_artist_number:
          type: integer
        code_number:
          type: integer
        artist_name:
          type: string
        album_title:
          type: string
        record_label:
          type: string
        genre_name:
          type: string
        format_name:
          type: string
        rotation_id:
          type: integer
        add_date:
          type: string
          format: date
        rotation_bin:
          type: string
          enum: ['S', 'L', 'M', 'H']
        kill_date:
          type: string
          format: date
          nullable: true
        plays:
          type: integer

    RestoreSlotConflicts:
      type: array
      description: >-
        Occupied call-number slots blocking a `POST
        /library/deleted/{batchId}/restore`. Carried by BOTH refusal arms — the
        400 `resolution_required` and the 409 `restore_declined` — so the screen
        that asks the librarian which arm to take (dj-site#1572) renders from
        either response. Occupancy is decided on the full genre-scoped slot
        tuple `(artist_id, genre_id, code_number,
        upper(coalesce(code_volume_letters, '')))`, never on a genre-blind
        `(artist_id, code_number)`.
      items:
        type: object
        required:
          [
            'entity_id',
            'artist_id',
            'genre_id',
            'code_number',
            'code_volume_letters',
            'occupied_by_library_id',
            'next_free_code_number',
          ]
        properties:
          entity_id:
            type: integer
            description: >-
              `catalog_delete_snapshot.entity_id` — the `library.id` the card had
              when it was deleted, and the id it would come back under.
          artist_id:
            type: integer
          genre_id:
            type: integer
            description: In the slot key because code letters are genre-scoped — one artist filed under two genres has two shelves.
          code_number:
            type: integer
            description: The card's ORIGINAL code number, which stays on the archive record whichever arm runs.
          code_volume_letters:
            type: string
            nullable: true
            description: Compared case-insensitively — `D` and `d` are one slot, not two.
          occupied_by_library_id:
            type: integer
            description: '`library.id` of the release holding that slot today.'
          next_free_code_number:
            type: integer
            description: What the `next_free_code` arm would file the card under — the next free code on that genre-scoped shelf.

    ArtistCard:
      type: object
      description: >-
        The base artist-card field set (`artist_id`, not `id`). Not returned
        directly by either artist-card endpoint — both `GET
        /library/artists/{id}` and its `PATCH` 200 answer
        `ArtistCardWithDependentCounts`, which embeds this shape via `allOf`
        and is where the two endpoints' parity contract is documented.
      properties:
        artist_id:
          type: integer
        artist_name:
          type: string
        alphabetical_name:
          type: string
        genre_id:
          type: integer
        code_letters:
          type: string
        code_artist_number:
          type: integer

    ArtistCardWithDependentCounts:
      description: >-
        `ArtistCard` plus the dependent counts behind `DELETE
        /library/artists/{id}`'s (BS#2562) refusal. Returned by BOTH `GET
        /library/artists/{id}` and the `PATCH` 200 on the same path (BS#2597)
        — the two endpoints deliberately agree, so a client that PATCHes can
        refresh its delete-control state straight from the PATCH body instead
        of re-GETting, and a client that re-GETs the URL decodes the same
        shape either way. A field added to this schema, or to either 200
        response's construction in `library.controller.ts`
        (`updateArtistCard` has TWO 200 sites — the no-op short-circuit and
        the post-write return — both must stay in step with `getArtistCard`),
        must be added to all three or the parity contract breaks silently.
      allOf:
        - $ref: '#/components/schemas/ArtistCard'
        - type: object
          properties:
            release_count:
              type: integer
              description: >-
                Catalog releases filed to this artist (`library.artist_id`).
                A non-zero count is the primary delete refusal — move or
                delete the releases first.
            cross_reference_source_count:
              type: integer
              description: >-
                Legacy artist-to-artist cross-references naming this artist
                as the source (tubafrenzy's `LIBRARY_CODE_CROSS_REFERENCE`).
                A non-zero count refuses the delete.
            cross_reference_target_count:
              type: integer
              description: >-
                The same legacy cross-reference collection, naming this
                artist as the target. A non-zero count refuses the delete.
            library_cross_reference_count:
              type: integer
              description: >-
                Legacy release cross-references pointing at this artist
                (tubafrenzy's `RELEASE_CROSS_REFERENCE`). A non-zero count
                refuses the delete.
            compilation_credit_count:
              type: integer
              description: >-
                Compilation-track credits attributed to this artist
                (`compilation_track_artist.track_artist_id`). Informational
                only — never a delete refusal. That foreign key is `ON DELETE
                set null`, matching the `concerts.headlining_artist_id`
                precedent: deleting the artist clears the credit's link
                rather than being blocked by it, so this count tells a
                librarian what attribution they are about to unlink, not
                what would prevent the delete.
          required:
            - release_count
            - cross_reference_source_count
            - cross_reference_target_count
            - library_cross_reference_count
            - compilation_credit_count

    NewRotationRequest:
      type: object
      required: ['rotation_bin']
      description: >-
        BS#2109: `album_id` may be omitted (or explicitly `null`) when
        `artist_name` and `album_title` are both supplied instead — the
        free-text pair representing a rotation release the station hasn't
        catalogued yet. `record_label` is optional in that case; blank or
        whitespace-only `artist_name`/`album_title` don't count as
        supplied. 400s when neither `album_id` nor the artist/title pair is
        given. `artist_name` / `album_title` / `record_label` are ignored
        when `album_id` is present — display is then sourced from the
        library join, and a client-supplied snapshot there would leave
        stale free text nothing ever clears.
      properties:
        album_id:
          type: integer
          nullable: true
          description: >-
            Must be a positive integer, or omitted/null for an uncatalogued
            release. `0` 400s — there is no `0` sentinel on this column;
            `library.id` is a serial starting at 1.
        rotation_bin:
          type: string
          enum: ['S', 'L', 'M', 'H']
        kill_date:
          type: string
          format: date
        artist_name:
          type: string
          maxLength: 128
          description: Required (with album_title) when album_id is omitted. A value over 128 characters 400s rather than truncating.
        album_title:
          type: string
          maxLength: 128
          description: Required (with artist_name) when album_id is omitted. A value over 128 characters 400s rather than truncating.
        record_label:
          type: string
          maxLength: 128
          description: Optional, only used when album_id is omitted. A value over 128 characters 400s rather than truncating.
        format_id:
          type: integer
          minimum: 1
          nullable: true
          description: >-
            BS#2410. Optional pre-catalog `format(id)` reference. Like the
            free-text trio, accepted ONLY when `album_id` is omitted — on a
            linked add the format authority is `library.format_id`, and a
            rotation-side copy would drift from it. An id that references no
            `format` row 400s ("format_id does not reference an existing
            format") rather than reaching Postgres as a 23503. An explicit
            `null` means ABSENT here, not "clear" — it is dropped unwritten
            and unvalidated, so the `selected?.id ?? null` shape a picker
            produces needs no client-side pruning. (On `PATCH
            /library/rotation/{id}` the same `null` clears the column.)
        label_id:
          type: integer
          minimum: 1
          nullable: true
          description: >-
            BS#2410. Optional pre-catalog `labels(id)` reference. Same
            `album_id`-absent rule, same null-means-absent rule, and same
            dangling-id 400 ("label_id does not reference an existing label")
            as `format_id`. `record_label` stays the free-text display
            snapshot and the two are independent.

    UncataloguedRotationRow:
      type: object
      description: >-
        BS#2109, widened to ten columns by BS#2410. The explicit column
        projection `GET /library/rotation/uncatalogued`, `GET
        /library/rotation/{id}` and `PATCH
        /library/rotation/{rotation_id}/link` all return — deliberately
        narrower than the full `rotation` row, which also carries
        server-derived plumbing (legacy_rotation_id,
        legacy_library_release_id, discogs_release_id,
        discogs_release_id_source, lml_identity_id, and two attempt-at
        markers) that is never published on this surface.


        **Referent rule for `format_id` / `label_id`, deliberate and the
        opposite of the sibling list read.** On this shape both are the
        ROTATION row's own pre-catalog fields: captured at rotation-add,
        writable only while `album_id` is NULL, and retained unchanged after
        the row is linked. They never describe the linked library release. On
        `GET /library/rotation` the same `label_id` key means
        `library.label_id` (that endpoint joins `library` and COALESCEs
        across sources), so do not read the two as interchangeable. The
        import screen must therefore source both fields from `GET
        /library/rotation/{id}` and never from a `GET /library/rotation`
        list row: that row's `label_id` (and its `format_name`) describe the
        library release it joined to, so carrying either into a `POST
        /library` body would file the new catalog entry under a different
        release's label or format. Display names are resolved client-side
        from `GET /library/formats`; this projection is join-free on purpose.
        The cross-repo SSOT carries the same rule on both endpoints
        (wxyc-shared 1.51.0, `RotationRowSummary`).
      properties:
        id:
          type: integer
        album_id:
          type: integer
          nullable: true
        rotation_bin:
          type: string
          enum: ['S', 'L', 'M', 'H']
        add_date:
          type: string
          format: date
        kill_date:
          type: string
          format: date
          nullable: true
        artist_name:
          type: string
          nullable: true
        album_title:
          type: string
          nullable: true
        record_label:
          type: string
          nullable: true
          description: >-
            Free-text label snapshot. Retained even when `label_id` is set,
            for rows whose text never resolved to a `labels` row.
        format_id:
          type: integer
          nullable: true
          description: >-
            BS#2409/BS#2410. Pre-catalog `format(id)` reference — the
            rotation row's own, never the linked release's. NULL on every row
            created before the dj-site classic add form began sending it; the
            legacy backfill is WXYC/Backend-Service#2412.
        label_id:
          type: integer
          nullable: true
          description: >-
            BS#2409/BS#2410. Pre-catalog `labels(id)` reference — the
            rotation row's own, never the linked release's. Same null
            population and backfill story as `format_id`.

    BinLibraryDetails:
      type: object
      properties:
        album_id:
          type: integer
        legacy_release_id:
          type: integer
          description: BS#2128. Non-null — getBinFromDB inner-joins library.
        album_title:
          type: string
        artist_name:
          type: string
        label:
          type: string
        code_letters:
          type: string
        code_artist_number:
          type: integer
        code_number:
          type: integer
        format_name:
          type: string
        genre_name:
          type: string

    Schedule:
      type: object
      properties:
        id:
          type: integer
          description: Primary key
        day:
          type: integer
          description: Day of the week 0 = Monday, 6 = Sunday
          minimum: 0
          maximum: 6
        start_time:
          type: string
          format: time
          description: Show start time
        show_duration:
          type: integer
          description: Duration in minutes
          minimum: 1
        specialty_id:
          type: integer
          nullable: true
          description: Reference to specialty show, null for regular shows
        assigned_dj_id:
          type: integer
          nullable: true
          description: Reference to primary DJ
        assigned_dj_id2:
          type: integer
          nullable: true
          description: Reference to secondary DJ

    ShowPeek:
      type: object
      properties:
        show:
          type: integer
        show_name:
          type: string
        date:
          type: string
          format: date-time
        djs:
          type: array
          items:
            type: object
            properties:
              dj_id:
                type: integer
              dj_name:
                type: string
                nullable: true
        specialty_show:
          type: string
        preview:
          type: array
          items:
            $ref: '#/components/schemas/FlowsheetEntryV2'

    Venue:
      type: object
      description: A live-music venue whose calendar WXYC ingests. Embedded whole in Concert.
      required:
        - id
        - slug
        - name
        - city
        - state
        - address
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        city:
          type: string
        state:
          type: string
        address:
          type: string
          nullable: true

    Concert:
      type: object
      description: >-
        One upcoming (or recent) concert. `starts_on` is the venue-local
        calendar date and is always present; `starts_at` is the exact instant
        and is null for date-only events. Internal ingestion columns are not
        exposed.
      required:
        - id
        - venue
        - starts_on
        - starts_at
        - doors_at
        - headlining_artist_raw
        - headlining_artist_id
        - title
        - supporting_artists_raw
        - ticket_url
        - image_url
        - event_url
        - price_min
        - price_max
        - age_restriction
        - status
      properties:
        id:
          type: integer
        venue:
          $ref: '#/components/schemas/Venue'
        starts_on:
          type: string
          format: date
        starts_at:
          type: string
          format: date-time
          nullable: true
        doors_at:
          type: string
          format: date-time
          nullable: true
        headlining_artist_raw:
          type: string
        headlining_artist_id:
          type: integer
          nullable: true
        title:
          type: string
          nullable: true
        supporting_artists_raw:
          type: array
          items:
            type: string
        ticket_url:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        event_url:
          type: string
          nullable: true
          description: >-
            The venue's own event-detail page, distinct from ticket_url (often
            a third-party seller). Null when no venue page is known.
        price_min:
          type: number
          nullable: true
        price_max:
          type: number
          nullable: true
        age_restriction:
          type: string
          nullable: true
        status:
          type: string
          enum: [on_sale, sold_out, cancelled, rescheduled]

    ConcertsResponse:
      type: object
      required:
        - concerts
        - pagination
      properties:
        concerts:
          type: array
          items:
            $ref: '#/components/schemas/Concert'
        pagination:
          type: object
          required:
            - page
            - limit
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            hasMore:
              type: boolean

    AlbumReview:
      type: object
      description: >-
        One archived DJ album review from the WXYC album-review Google Form,
        synced nightly by the album-reviews ETL (ADR 0011). Distinct from
        the in-app Review model reserved at /reviews (ADR 0006). Reviewer
        identity (reviewer_raw, social_consent_raw) is never exposed. This
        block is Swagger display only; the SSOT is wxyc-shared/api.yaml.
      required:
        - id
        - album_id
        - artist_name
        - album_title
        - record_label
        - artist_blurb
        - review
        - recommended_tracks
        - buzzwords
        - fcc_violations
        - review_purpose
        - rotated
        - released_within_six_months
        - social_consent
        - submitted_at
      properties:
        id:
          type: integer
        album_id:
          type: integer
          nullable: true
          description: WXYC library album id when the free-text artist/album resolved to exactly one catalog row; null otherwise.
        artist_name:
          type: string
          nullable: true
        album_title:
          type: string
          nullable: true
        record_label:
          type: string
          nullable: true
        artist_blurb:
          type: string
          nullable: true
        review:
          type: string
          nullable: true
        recommended_tracks:
          type: string
          nullable: true
          description: Raw recommended-tracks text, including the form's `!`-rating notation.
        buzzwords:
          type: string
          nullable: true
        fcc_violations:
          type: string
          nullable: true
          description: Verbatim reviewer answer; blank (unanswered) is distinct from "None"/"N/A".
        review_purpose:
          type: string
          nullable: true
        rotated:
          type: boolean
          nullable: true
        released_within_six_months:
          type: boolean
          nullable: true
        social_consent:
          type: boolean
          nullable: true
          description: >-
            Whether the reviewer consented to the review being shared on station
            social media (blog / Instagram), always anonymously; null when the
            question was unanswered or predates its ~2024-06-20 introduction.
            Decorative on this endpoint, NOT a filter — see the path description.
        submitted_at:
          type: string
          format: date-time
          nullable: true

    AlbumReviewsResponse:
      type: object
      required:
        - album_reviews
        - pagination
      properties:
        album_reviews:
          type: array
          items:
            $ref: '#/components/schemas/AlbumReview'
        pagination:
          type: object
          required:
            - page
            - limit
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            hasMore:
              type: boolean

security:
  - BearerAuth: []

paths:
  /flowsheet:
    get:
      summary: Get flowsheet entries
      security: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
          description: Number of entries to return
        - name: shows_limit
          in: query
          schema:
            type: integer
          description: Number of shows to return entries from
        - name: page
          in: query
          schema:
            type: integer
          description: Page number for pagination ** compatible with either limit or shows_limit
        - name: start_id
          in: query
          schema:
            type: integer
          description: first play_order id in range ** Must be provided together with end_id
        - name: end_id
          in: query
          schema:
            type: integer
          description: last play_order id in range ** Must be provided together with start_id
      responses:
        '200':
          description: Paginated flowsheet entries (discriminated union format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowsheetPaginatedResponse'

    post:
      summary: Add entry to flowsheet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - allOf:
                    - $ref: '#/components/schemas/FlowsheetEntry'
                    - type: object
                      required: ['artist_name', 'album_title', 'track_title']
                - type: object
                  required: ['message']
                  properties:
                    message:
                      type: string
      responses:
        '200':
          description: Successfully added entry
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FlowsheetEntry'
                  - type: object
                    properties:
                      id:
                        type: integer
                      play_order:
                        type: integer
                      show_id:
                        type: integer
                      message:
                        type: string

    patch:
      summary: Update flowsheet entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                artist_name:
                  type: string
                album_title:
                  type: string
                track_title:
                  type: string
                track_position:
                  type: string
                  nullable: true
                  description: >
                    Discogs `release_track.position`; pass `null` to clear.
                    See FlowsheetEntry.track_position.
                record_label:
                  type: string
                request_flag:
                  type: string
                message:
                  type: string
      responses:
        '200':
          description: Successfully updated entry
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FlowsheetEntry'
                  - type: object
                    properties:
                      id:
                        type: integer
                      play_order:
                        type: integer
                      show_id:
                        type: integer
                      message:
                        type: string

    delete:
      summary: Delete flowsheet entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entry_id:
                  type: integer
      responses:
        '200':
          description: Successfully deleted entry
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FlowsheetEntry'
                  - type: object
                    properties:
                      id:
                        type: integer
                      play_order:
                        type: integer
                      show_id:
                        type: integer
                      message:
                        type: string

  /flowsheet/latest:
    get:
      summary: Get the most recent flowsheet entry
      responses:
        '200':
          description: Latest flowsheet entry (discriminated union format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowsheetEntryV2'

  /flowsheet/join:
    post:
      summary: Start or join a show
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['dj_id']
              properties:
                dj_id:
                  type: integer
                show_name:
                  type: string
                  description: Required only when starting a new show
                specialty_id:
                  type: integer
                  description: id of specialty show entry

      responses:
        '200':
          description: Successfully joined/started show
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Show'
                    description: 'Show started'
                  - $ref: '#/components/schemas/ShowDJ'
                    description: 'Show joined'

  /flowsheet/end:
    post:
      summary: End or leave a show
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dj_id:
                  type: integer
      responses:
        '200':
          description: Successfully ended/left show
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Show'
                    description: 'Show started'
                  - $ref: '#/components/schemas/ShowDJ'
                    description: 'Show joined'

  /flowsheet/open-shows:
    get:
      summary: List open shows an operator may need to close (BS#2235)
      description: >
        Shows with `end_time IS NULL` that started inside the lookback window,
        oldest first, with flowsheet entry counts. Requires the
        `flowsheet: manage` permission (musicDirector / stationManager).
        Replaces tubafrenzy's "Resume a Show" list, which retires 2026-09-07.
        The window matters: `end_time IS NULL` is not a reliable "on the air"
        signal, and production's open shows reach back to 2006 — see
        `getOpenShows` in apps/backend/services/flowsheet.service.ts.
      parameters:
        - name: window_hours
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 262800
            default: 168
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Open shows inside the window, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  shows:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        primary_dj_id:
                          type: string
                          nullable: true
                        dj_name:
                          type: string
                          nullable: true
                        show_name:
                          type: string
                          nullable: true
                        start_time:
                          type: string
                          format: date-time
                        legacy_show_id:
                          type: integer
                          nullable: true
                        entry_count:
                          type: integer
                        is_current:
                          type: boolean
                          description: The show every on-air read resolves to. Never offer to close it.
                        likely_abandoned:
                          type: boolean
                          description: Advisory only — not current, and fewer than four entries.
                  total_in_window:
                    type: integer
                    description: Total before `limit` truncates; the only signal a page is partial.
                  older_open_show_count:
                    type: integer
                    description: Open shows older than the window. Counted, never listed.
        '400':
          description: 'window_hours or limit was not an integer in range'
        '403':
          description: 'Caller lacks the `flowsheet: manage` permission'

  /flowsheet/shows/recent:
    get:
      summary: Recent shows and the DJs who were on them (BS#2435)
      description: >
        The handoff read: shows that started inside the lookback window, newest
        first, each with its start/end times and the on-air handles of the DJs
        who had the room. Requires the `flowsheet: read` permission — every
        signed-in station account, deliberately narrower than nothing and
        deliberately wider than `/flowsheet/open-shows`'s `manage` gate, since
        nothing here is destructive.

        Answers what neither neighbour does: `/flowsheet/djs-on-air` reports who
        is on NOW and goes empty the moment a show ends, and
        `/flowsheet/open-shows` lists only shows still open.

        Names are ON-AIR HANDLES, resolved through the same chain as
        `/flowsheet/djs-on-air` (`composeShowDJList`). Legal names are out of
        scope by design — see BS#2435's scope note and docs/pii.md. A
        legacy/tubafrenzy-mirrored show has no `show_djs` rows and surfaces one
        entry with `id: null`, named from `shows.legacy_dj_name`.

        This block is Swagger display only and MIRRORS the SSOT; it does not
        originate the shape. The canonical wire contract is
        `GET /flowsheet/shows/recent` plus the `RecentShow` and
        `RecentShowsResponse` schemas in `wxyc-shared/api.yaml` (1.58.0,
        WXYC/wxyc-shared#469), which is what dj-site, iOS and Android generate
        from. Change that spec first; this copy follows.
      parameters:
        - name: window_hours
          in: query
          required: false
          description: >
            Lookback in hours. Rejected with 400 rather than clamped when it is
            not an integer in range. The one-week ceiling is deliberate: this is
            a handoff read, not an archive walk — for that use
            `/flowsheet/playlist`.
          schema:
            type: integer
            minimum: 1
            maximum: 168
            default: 24
      responses:
        '200':
          description: Shows inside the window, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  shows:
                    type: array
                    description: >
                      Ordered by `start_time` DESC, tie-broken on `id` DESC.
                      Capped at 200 rows; truncation therefore drops the oldest
                      shows in the window, which is why no `limit` parameter is
                      offered.
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        show_name:
                          type: string
                          nullable: true
                        start_time:
                          type: string
                          format: date-time
                        end_time:
                          type: string
                          format: date-time
                          nullable: true
                          description: Null while the show is still on the air, or when its sign-off was lost.
                        djs:
                          type: array
                          description: >
                            Who had the room. Empty when the show carries no
                            account rows and no resolvable show-level handle —
                            the show is still listed, so a consumer renders
                            "unknown" against real times rather than losing the
                            row.
                          items:
                            type: object
                            description: >
                              Inlined here only because this file declares no
                              shared schemas; in the SSOT this is a `$ref` to
                              `OnAirDJ`, the same schema `/flowsheet/djs-on-air`
                              returns. Backend composes both from one function
                              (`composeShowDJList`), so treat any divergence
                              between the two copies as a bug in this one.
                            properties:
                              id:
                                type: string
                                nullable: true
                                description: The DJ's `auth_user.id`, or null for a legacy/tubafrenzy DJ with no account.
                              dj_name:
                                type: string
                                nullable: true
                                description: >
                                  The public on-air handle. Null when the handle
                                  filters away (the literal "Anonymous"), which
                                  `/flowsheet/djs-on-air` also reports as null.
        '400':
          description: 'window_hours was not an integer between 1 and 168'
        '401':
          description: 'No bearer token'
        '403':
          description: 'Caller lacks the `flowsheet: read` permission'

  /flowsheet/shows/{id}/force-end:
    post:
      summary: End a show the caller does not own (BS#2235)
      description: >
        Closes an abandoned show, reusing the same `endShow` implementation as
        `POST /flowsheet/end` — same `show_end` marker, same `show_djs`
        deactivation, same tubafrenzy sign-off. `end_time` and the marker's
        `add_time` come from the show's last logged entry, NOT from now(): a
        show from the legacy backlog stamped now() would overlap every
        `GET /flowsheet/range` window since it started and sort to the top of
        the public flowsheet. Requires the `flowsheet: manage` permission.
      parameters:
        - name: id
          in: path
          required: true
          description: Backend-Service `shows.id`, not the tubafrenzy `legacy_show_id`.
          schema:
            type: integer
        - name: force
          in: query
          required: false
          description: >
            Set to `true` to close the show that is currently on air. Without
            it, targeting `max(shows.id)` is a 409. The override exists because
            an abandoned show IS the current show until something closes it —
            the 2026-08-20 incident is exactly that case.
          schema:
            type: string
            enum: ['true']
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ended_at:
                  type: string
                  format: date-time
                  description: >
                    Override the derived end instant. Bounded on both ends, or
                    the request is a 400 naming the bound it missed: at or
                    before now, and at or after the derived instant it replaces
                    (the show's last logged entry, floored at `start_time`). An
                    override can only ever move the close LATER than the
                    flowsheet's own answer — closing a show before entries it
                    still owns would sink its `show_end` marker below them in
                    the flowsheet's global `add_time` order. A show that logged
                    nothing has no last entry, and there the floor is
                    `start_time`.
      responses:
        '200':
          description: The finalized show, with `end_time` set
        '400':
          description: >
            The id was not a positive integer, the show is already ended, or
            `ended_at` was unparseable, in the future, or earlier than the
            show's last logged entry.
        '403':
          description: 'Caller lacks the `flowsheet: manage` permission'
        '404':
          description: No show with that id
        '409':
          description: The target is the current on-air show and `force=true` was not sent

  /flowsheet/djs-on-air:
