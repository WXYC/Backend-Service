openapi: 3.0.0
info:
  title: WXYC Backend API
  description: API for managing WXYC radio station operations including flowsheets, library, DJs, and schedule
  version: 1.0.0

servers:
  - url: http://localhost:{port}
    variables:
      port:
        default: '8080'
        description: Local API server port
  - url: https://api.wxyc.org

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: JWT token from AWS Cognito

  schemas:
    FlowsheetEntry:
      type: object
      properties:
        artist_name:
          type: string
        album_title:
          type: string
        track_title:
          type: string
        album_id:
          type: number
        rotation_id:
          type: number
        record_label:
          type: string
        request_flag:
          type: boolean
        track_position:
          type: string
          nullable: true
          description: >
            Discogs `release_track.position` (e.g. "A1", "B2") captured by the
            dj-site flowsheet picker (E6-6, dj-site#501). Optional; `null` for
            entries added without a position. Wired through POST /flowsheet and
            PATCH /flowsheet by BS#943.

    FlowsheetEntryV2:
      type: object
      required: [id, show_id, play_order, add_time, entry_type]
      discriminator:
        propertyName: entry_type
      properties:
        id:
          type: integer
        show_id:
          type: integer
        play_order:
          type: integer
        add_time:
          type: string
          format: date-time
        entry_type:
          type: string
          enum: [track, show_start, show_end, dj_join, dj_leave, talkset, breakpoint, message]
      description: >
        Discriminated union keyed by entry_type.
        track entries include artist_name, album_title, track_title, record_label, rotation_bin, metadata fields.
        track entries also carry artist_id — the resolved WXYC catalog artist id (flowsheet.album_id → library.artist_id), additive and nullable (null for free-form entries and library rows with no artist link). Shares the artists.id keyspace with concerts.headlining_artist_id / upcoming_show so on-device features (the On Tour likes match) can intersect a liked playcut against concert headliners (BS#1625). Canonical wire contract: FlowsheetV2TrackEntry.artist_id in wxyc-shared/api.yaml (the SSOT).
        track entries MAY also carry upcoming_show — an optional embedded Concert (see the Concert schema and GET /concerts) attached server-side at feed-assembly time when the track's resolved catalog artist (flowsheet.album_id → library.artist_id) has a curated, non-tombstoned, upcoming Triangle-area date (concerts.headlining_artist_id match; soonest date wins). Absent when there is no such match; older clients decode the absent field as "no touring CTA" (BS#1607). The canonical wire contract is FlowsheetV2TrackEntry.upcoming_show in wxyc-shared/api.yaml (the SSOT); this app.yaml is Swagger display only.
        show_start/show_end entries include dj_name and timestamp.
        dj_join/dj_leave entries include dj_name.
        talkset/breakpoint/message entries include message.
        breakpoint entries also include radio_hour (the authoritative top-of-hour as an ISO date-time, or null) — clients should format this rather than add_time.

    FlowsheetPaginatedResponse:
      type: object
      required: [entries, total, page, limit, totalPages]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/FlowsheetEntryV2'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
        on_air:
          allOf:
            - $ref: '#/components/schemas/OnAirInfo'
          nullable: true
          description: >-
            The DJ currently on air, when known. An OnAirInfo object means a named DJ is live; JSON null means the station is confirmed on automation ("Auto DJ"); the field being absent means the server does not report on-air status and clients should treat it as unknown. Not in required so absence stays distinct from an explicit null.

    OnAirInfo:
      type: object
      required: [dj_name]
      properties:
        dj_name:
          type: string
          description: Display name of the DJ currently on air.

    FlowsheetEntryAdd:
      type: object
      oneOf:
        - allOf:
            - $ref: '#/components/schemas/FlowsheetEntry'
            - type: object
              required: ['artist_name', 'album_title', 'track_title']
        - type: object
          required: ['message']
          properties:
            message:
              type: string

    Show:
      type: object
      properties:
        id:
          type: integer
        primary_dj_id:
          type: integer
        specialty_id:
          type: integer
        show_name:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
          nullable: true

    DJ:
      type: object
      properties:
        id:
          type: integer
        shows_covered:
          type: integer
        add_date:
          type: string
          format: date

    NewDJ:
      type: object
      properties:
        cognito_user_name:
          type: string
        real_name:
          type: string
        dj_name:
          type: string

    ShowDJ:
      type: object
      properties:
        show_id:
          type: integer
        dj_id:
          type: integer
        active:
          type: boolean

    Album:
      type: object
      description: >
        Abbreviated album-detail summary, referenced here by `GET /library/info`
        (both the `album_id` and the BS#1880 `legacy_release_id` branches) and
        the `PATCH /library/{id}` 200. Four handlers actually return this shape
        — `getAlbumFromDB`'s row verbatim; `/library/{id}/missing` and
        `/library/{id}/found` return it too but declare no response body here.

        Interim divergence note (BS#2170), not drift to delete. The SSOT models
        these responses with two schemas — `AlbumInfoResponse` for
        `/library/info`, `AlbumSearchResult` for the three PATCHes — and
        neither describes them well: both omit nine returned fields,
        `AlbumSearchResult` declares seven search-only properties no
        album-detail handler emits, and `AlbumInfoResponse` types `genre_name`
        as a closed ten-value enum that six of the fifteen production genres
        fall outside. Porting either one here would import a defect and a split
        the implementation does not have. WXYC/wxyc-shared#365 re-models the
        SSOT side; **revisit this note when it lands** rather than treating it
        as a settled answer.

        This file is Swagger-UI display only — not a codegen source and not a
        runtime validator — so its schemas stay abbreviated summaries rather
        than mirrors, and `wxyc-shared/api.yaml` carries the authoritative
        field descriptions.
      properties:
        id:
          type: integer
        legacy_release_id:
          type: integer
          description: >-
            BS#2128. The library.db-producer surrogate key dj-site's track picker
            resolves against; NOT NULL since migration 0137. Sourced from
            getAlbumFromDB, so it is present on both consumers of this schema —
            GET /library/info and the PATCH /library/{id} 200, which is why it
            sits directly on the schema here. The SSOT hangs the same field off
            `AlbumInfoResponse` and omits it from its own `Album`, so the
            identically-named schemas place it at different levels.
        code_letters:
          type: string
        code_artist_number:
          # `genre_artist_crossreference.artist_genre_code`, an integer column.
          # Four sibling schemas in this file already say so; only this one said
          # `string`.
          type: integer
        code_number:
          type: integer
        artist_name:
          type: string
        album_title:
          type: string
        record_label:
          type: string
        plays:
          type: integer
        add_date:
          type: string
          format: date-time
        last_modified:
          type: string
          format: date-time

    NewAlbumRequest:
      type: object
      required: ['album_title', 'label', 'genre_id', 'format_id']
      properties:
        album_title:
          type: string
        artist_name:
          type: string
        artist_id:
          type: integer
        alternate_artist_name:
          type: string
        label:
          type: string
        genre_id:
          type: integer
        format_id:
          type: integer
        disc_quantity:
          type: integer

    AlbumView:
      type: object
      properties:
        id:
          type: integer
        legacy_release_id:
          type: integer
          description: >-
            BS#2128. Present on GET /library only. GET /library/query shares this
            schema but builds its rows through an explicit projection
            (taggedRowToAlbumSearchResultRow) over library_artist_view, which does
            not carry the column until the BS#2129 migration adds it.
        code_letters:
          type: string
        code_artist_number:
          type: integer
        code_number:
          type: integer
        artist_name:
          type: string
        album_title:
          type: string
        format_name:
          type: string
        genre_name:
          type: string
        rotation_bin:
          type: string
          nullable: true
        add_date:
          type: string
          format: date-time
        label:
          type: string
          nullable: true

    CatalogExportRow:
      type: object
      description: >
        One catalog row in the `GET /library/catalog` NDJSON export (BS#1468).
        `rotation_bin` / `rotation_kill_date` are raw (the most-recently-added
        rotation record per album); the client evaluates "in rotation" locally.
        BS#1965 added the four library.db-producer fields (legacy_release_id,
        alternate_artist_name, album_artist, cross_reference_names); the SSOT
        (wxyc-shared api.yaml) carries the authoritative descriptions.
      properties:
        id:
          type: integer
        legacy_release_id:
          type: integer
          nullable: true
        artist_name:
          type: string
        alternate_artist_name:
          type: string
          nullable: true
        album_artist:
          type: string
          nullable: true
        cross_reference_names:
          type: array
          nullable: true
          items:
            type: string
          description: >
            Cross-referenced artist names, in either FK direction, ordered by
            Unicode code point. An ARRAY, not the pipe-joined string library.db
            stores — the producer does the `" | "` join itself, because nothing
            constrains an artist name from containing a pipe. Empty array when
            the artist has no cross-references.
        album_title:
          type: string
        code_letters:
          type: string
        code_number:
          type: integer
        code_artist_number:
          type: integer
        label:
          type: string
          nullable: true
        genre_name:
          type: string
        format_name:
          type: string
        on_streaming:
          type: boolean
          nullable: true
        plays:
          type: integer
          nullable: true
        popularity:
          type: integer
          nullable: true
          description: >
            Attribution-corrected, master-collapsed popularity (BS#1486 Phase-2):
            collapses pressings sharing a Discogs master and folds in resolved
            free-text plays. null when the logical album has no plays. The SSOT
            (wxyc-shared api.yaml) carries the authoritative description.
        artwork_url:
          type: string
          nullable: true
        rotation_bin:
          type: string
          nullable: true
        rotation_kill_date:
          type: string
          format: date
          nullable: true

    CatalogCompilationTrackRow:
      type: object
      description: >
        One compilation_track_artist row in the `GET
        /library/catalog/compilation-tracks` NDJSON export (BS#1965). Keyed on
        `legacy_release_id` (the owning library row's surrogate key, which the
        producer maps to library.db's compilation_track_artist.library_release_id).
        The SSOT (wxyc-shared api.yaml) carries the authoritative description.
      required:
        - legacy_release_id
        - artist_name
      properties:
        legacy_release_id:
          type: integer
        artist_name:
          type: string
          minLength: 1
          maxLength: 255
        track_title:
          type: string
          maxLength: 255
          nullable: true

    BmiPerformanceRow:
      type: object
      description: >
        One played musical work in the `GET /library/bmi-performance-list` export
        (BS#1500). Flat projection of a `flowsheet` track row with a usable artist.
        `composer_source` is raw open-ended text (a source added after the endpoint,
        e.g. `musicbrainz_work`, can appear); consumers should not treat it as a
        closed enum.
      properties:
        artist_name:
          type: string
        track_title:
          type: string
          nullable: true
        album_title:
          type: string
          nullable: true
        record_label:
          type: string
          nullable: true
        composer:
          type: string
          nullable: true
        composer_source:
          type: string
          nullable: true
          description: 'Provenance of `composer`: discogs_track | discogs_release | artist_proxy | a later source | null.'
        played_at:
          type: string
          format: date-time
          description: The play's logging instant (`flowsheet.add_time`), ISO-8601.

    BmiCoverage:
      type: object
      description: >
        Composer-provenance breakdown for the pre-submit preview. The five counts
        partition `total`. `none` = no composer credit at all; `unknown` = a non-null
        `composer_source` outside the known set (a real credit from a later source),
        kept distinct from `none` so a credited play is never reported as having no composer.
      properties:
        total:
          type: integer
        real_track:
          type: integer
        real_release:
          type: integer
        artist_proxy:
          type: integer
        none:
          type: integer
        unknown:
          type: integer

    BmiPerformanceList:
      type: object
      description: The `GET /library/bmi-performance-list` response envelope (BS#1500).
      properties:
        range:
          type: object
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
        coverage:
          $ref: '#/components/schemas/BmiCoverage'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/BmiPerformanceRow'

    Rotation:
      type: object
      properties:
        id:
          type: integer
        legacy_release_id:
          type: integer
          nullable: true
          description: >-
            BS#2128. Null for a library-unlinked rotation row — getRotationFromDB
            LEFT JOINs library, so there is no library row to source the id from.
            The only one of the four flowsheet-consumed reads that can be null;
            the others inner-join library and always carry a value.
        code_letters:
          type: string
        code_artist_number:
          type: integer
        code_number:
          type: integer
        artist_name:
          type: string
        album_title:
          type: string
        record_label:
          type: string
        genre_name:
          type: string
        format_name:
          type: string
        rotation_id:
          type: integer
        add_date:
          type: string
          format: date
        rotation_bin:
          type: string
          enum: ['S', 'L', 'M', 'H']
        kill_date:
          type: string
          format: date
          nullable: true
        plays:
          type: integer

    ArtistCard:
      type: object
      description: >-
        The artist-card field set, returned by `GET /library/artists/{id}` and by
        the `PATCH` 200 on the same path. `artist_id`, not `id` — the two
        endpoints deliberately agree so a client that PATCHes and a client that
        re-GETs the URL decode one shape.
      properties:
        artist_id:
          type: integer
        artist_name:
          type: string
        alphabetical_name:
          type: string
        genre_id:
          type: integer
        code_letters:
          type: string
        code_artist_number:
          type: integer

    NewRotationRequest:
      type: object
      required: ['rotation_bin']
      description: >-
        BS#2109: `album_id` may be omitted (or explicitly `null`) when
        `artist_name` and `album_title` are both supplied instead — the
        free-text pair representing a rotation release the station hasn't
        catalogued yet. `record_label` is optional in that case; blank or
        whitespace-only `artist_name`/`album_title` don't count as
        supplied. 400s when neither `album_id` nor the artist/title pair is
        given. `artist_name` / `album_title` / `record_label` are ignored
        when `album_id` is present — display is then sourced from the
        library join, and a client-supplied snapshot there would leave
        stale free text nothing ever clears.
      properties:
        album_id:
          type: integer
          nullable: true
          description: >-
            Must be a positive integer, or omitted/null for an uncatalogued
            release. `0` 400s — there is no `0` sentinel on this column;
            `library.id` is a serial starting at 1.
        rotation_bin:
          type: string
          enum: ['S', 'L', 'M', 'H']
        kill_date:
          type: string
          format: date
        artist_name:
          type: string
          maxLength: 128
          description: Required (with album_title) when album_id is omitted. A value over 128 characters 400s rather than truncating.
        album_title:
          type: string
          maxLength: 128
          description: Required (with artist_name) when album_id is omitted. A value over 128 characters 400s rather than truncating.
        record_label:
          type: string
          maxLength: 128
          description: Optional, only used when album_id is omitted. A value over 128 characters 400s rather than truncating.

    UncataloguedRotationRow:
      type: object
      description: >-
        BS#2109. The explicit column projection `GET
        /library/rotation/uncatalogued` and `PATCH
        /library/rotation/{rotation_id}/link` both return — deliberately
        narrower than the full `rotation` row, which also carries
        server-derived plumbing (legacy_rotation_id,
        legacy_library_release_id, discogs_release_id,
        discogs_release_id_source, lml_identity_id, and two attempt-at
        markers) that is never published on this surface.
      properties:
        id:
          type: integer
        album_id:
          type: integer
          nullable: true
        rotation_bin:
          type: string
          enum: ['S', 'L', 'M', 'H']
        add_date:
          type: string
          format: date
        kill_date:
          type: string
          format: date
          nullable: true
        artist_name:
          type: string
          nullable: true
        album_title:
          type: string
          nullable: true
        record_label:
          type: string
          nullable: true

    BinLibraryDetails:
      type: object
      properties:
        album_id:
          type: integer
        legacy_release_id:
          type: integer
          description: BS#2128. Non-null — getBinFromDB inner-joins library.
        album_title:
          type: string
        artist_name:
          type: string
        label:
          type: string
        code_letters:
          type: string
        code_artist_number:
          type: integer
        code_number:
          type: integer
        format_name:
          type: string
        genre_name:
          type: string

    Schedule:
      type: object
      properties:
        id:
          type: integer
          description: Primary key
        day:
          type: integer
          description: Day of the week 0 = Monday, 6 = Sunday
          minimum: 0
          maximum: 6
        start_time:
          type: string
          format: time
          description: Show start time
        show_duration:
          type: integer
          description: Duration in minutes
          minimum: 1
        specialty_id:
          type: integer
          nullable: true
          description: Reference to specialty show, null for regular shows
        assigned_dj_id:
          type: integer
          nullable: true
          description: Reference to primary DJ
        assigned_dj_id2:
          type: integer
          nullable: true
          description: Reference to secondary DJ

    ShowPeek:
      type: object
      properties:
        show:
          type: integer
        show_name:
          type: string
        date:
          type: string
          format: date-time
        djs:
          type: array
          items:
            type: object
            properties:
              dj_id:
                type: integer
              dj_name:
                type: string
                nullable: true
        specialty_show:
          type: string
        preview:
          type: array
          items:
            $ref: '#/components/schemas/FlowsheetEntryV2'

    Venue:
      type: object
      description: A live-music venue whose calendar WXYC ingests. Embedded whole in Concert.
      required:
        - id
        - slug
        - name
        - city
        - state
        - address
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        city:
          type: string
        state:
          type: string
        address:
          type: string
          nullable: true

    Concert:
      type: object
      description: >-
        One upcoming (or recent) concert. `starts_on` is the venue-local
        calendar date and is always present; `starts_at` is the exact instant
        and is null for date-only events. Internal ingestion columns are not
        exposed.
      required:
        - id
        - venue
        - starts_on
        - starts_at
        - doors_at
        - headlining_artist_raw
        - headlining_artist_id
        - title
        - supporting_artists_raw
        - ticket_url
        - image_url
        - event_url
        - price_min
        - price_max
        - age_restriction
        - status
      properties:
        id:
          type: integer
        venue:
          $ref: '#/components/schemas/Venue'
        starts_on:
          type: string
          format: date
        starts_at:
          type: string
          format: date-time
          nullable: true
        doors_at:
          type: string
          format: date-time
          nullable: true
        headlining_artist_raw:
          type: string
        headlining_artist_id:
          type: integer
          nullable: true
        title:
          type: string
          nullable: true
        supporting_artists_raw:
          type: array
          items:
            type: string
        ticket_url:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        event_url:
          type: string
          nullable: true
          description: >-
            The venue's own event-detail page, distinct from ticket_url (often
            a third-party seller). Null when no venue page is known.
        price_min:
          type: number
          nullable: true
        price_max:
          type: number
          nullable: true
        age_restriction:
          type: string
          nullable: true
        status:
          type: string
          enum: [on_sale, sold_out, cancelled, rescheduled]

    ConcertsResponse:
      type: object
      required:
        - concerts
        - pagination
      properties:
        concerts:
          type: array
          items:
            $ref: '#/components/schemas/Concert'
        pagination:
          type: object
          required:
            - page
            - limit
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            hasMore:
              type: boolean

    AlbumReview:
      type: object
      description: >-
        One archived DJ album review from the WXYC album-review Google Form,
        synced nightly by the album-reviews ETL (ADR 0011). Distinct from
        the in-app Review model reserved at /reviews (ADR 0006). Reviewer
        identity (reviewer_raw, social_consent_raw) is never exposed. This
        block is Swagger display only; the SSOT is wxyc-shared/api.yaml.
      required:
        - id
        - album_id
        - artist_name
        - album_title
        - record_label
        - artist_blurb
        - review
        - recommended_tracks
        - buzzwords
        - fcc_violations
        - review_purpose
        - rotated
        - released_within_six_months
        - social_consent
        - submitted_at
      properties:
        id:
          type: integer
        album_id:
          type: integer
          nullable: true
          description: WXYC library album id when the free-text artist/album resolved to exactly one catalog row; null otherwise.
        artist_name:
          type: string
          nullable: true
        album_title:
          type: string
          nullable: true
        record_label:
          type: string
          nullable: true
        artist_blurb:
          type: string
          nullable: true
        review:
          type: string
          nullable: true
        recommended_tracks:
          type: string
          nullable: true
          description: Raw recommended-tracks text, including the form's `!`-rating notation.
        buzzwords:
          type: string
          nullable: true
        fcc_violations:
          type: string
          nullable: true
          description: Verbatim reviewer answer; blank (unanswered) is distinct from "None"/"N/A".
        review_purpose:
          type: string
          nullable: true
        rotated:
          type: boolean
          nullable: true
        released_within_six_months:
          type: boolean
          nullable: true
        social_consent:
          type: boolean
          nullable: true
          description: >-
            Whether the reviewer consented to the review being shared on station
            social media (blog / Instagram), always anonymously; null when the
            question was unanswered or predates its ~2024-06-20 introduction.
            Decorative on this endpoint, NOT a filter — see the path description.
        submitted_at:
          type: string
          format: date-time
          nullable: true

    AlbumReviewsResponse:
      type: object
      required:
        - album_reviews
        - pagination
      properties:
        album_reviews:
          type: array
          items:
            $ref: '#/components/schemas/AlbumReview'
        pagination:
          type: object
          required:
            - page
            - limit
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            hasMore:
              type: boolean

security:
  - BearerAuth: []

paths:
  /flowsheet:
    get:
      summary: Get flowsheet entries
      security: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
          description: Number of entries to return
        - name: shows_limit
          in: query
          schema:
            type: integer
          description: Number of shows to return entries from
        - name: page
          in: query
          schema:
            type: integer
          description: Page number for pagination ** compatible with either limit or shows_limit
        - name: start_id
          in: query
          schema:
            type: integer
          description: first play_order id in range ** Must be provided together with end_id
        - name: end_id
          in: query
          schema:
            type: integer
          description: last play_order id in range ** Must be provided together with start_id
      responses:
        '200':
          description: Paginated flowsheet entries (discriminated union format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowsheetPaginatedResponse'

    post:
      summary: Add entry to flowsheet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - allOf:
                    - $ref: '#/components/schemas/FlowsheetEntry'
                    - type: object
                      required: ['artist_name', 'album_title', 'track_title']
                - type: object
                  required: ['message']
                  properties:
                    message:
                      type: string
      responses:
        '200':
          description: Successfully added entry
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FlowsheetEntry'
                  - type: object
                    properties:
                      id:
                        type: integer
                      play_order:
                        type: integer
                      show_id:
                        type: integer
                      message:
                        type: string

    patch:
      summary: Update flowsheet entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                artist_name:
                  type: string
                album_title:
                  type: string
                track_title:
                  type: string
                track_position:
                  type: string
                  nullable: true
                  description: >
                    Discogs `release_track.position`; pass `null` to clear.
                    See FlowsheetEntry.track_position.
                record_label:
                  type: string
                request_flag:
                  type: string
                message:
                  type: string
      responses:
        '200':
          description: Successfully updated entry
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FlowsheetEntry'
                  - type: object
                    properties:
                      id:
                        type: integer
                      play_order:
                        type: integer
                      show_id:
                        type: integer
                      message:
                        type: string

