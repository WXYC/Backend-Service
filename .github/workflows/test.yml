name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all images (ignore cache)'
        required: false
        default: false
        type: boolean

env:
  TEST_HOST: http://localhost
  # Intentionally kept at 5433 (unlike the local-dev default in
  # dev_env/docker-compose.yml / scripts/ci-test.sh, bumped to 15433 by
  # BS#1729). GHA runners are ephemeral and never have a local
  # discogs-cache PG bound to 5433, so there's no collision class here —
  # changing this value is out of scope for BS#1729's acceptance criteria
  # ("CI (GitHub Actions) behavior unchanged").
  CI_DB_PORT: 5433
  CI_PORT: 8081
  PORT: 8081
  CI_BETTER_AUTH_URL: http://localhost:8083/auth
  BETTER_AUTH_URL: http://localhost:8083/auth
  DB_USERNAME: test-user
  DB_PASSWORD: test-pw
  DB_NAME: wxyc_db
  AUTH_BYPASS: true
  AUTH_USERNAME: test_dj1
  AUTH_PASSWORD: testpassword123
  MOCK_API_URL: http://localhost:9090

# Workflow-level GITHUB_TOKEN scope. No job in this file pushes code,
# comments on PRs, or creates releases; all writes to external services
# use their own non-GITHUB_TOKEN secrets. contents:read is the safe floor.
permissions:
  contents: read

jobs:
  # Detect what changed to conditionally run jobs
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.changes.outputs.apps }}
      jobs: ${{ steps.changes.outputs.jobs }}
      shared: ${{ steps.changes.outputs.shared }}
      tests: ${{ steps.changes.outputs.tests }}
      src: ${{ steps.changes.outputs.src }}
      run-integration: ${{ steps.should-run.outputs.run-integration }}
      db-init: ${{ steps.changes.outputs.db-init }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Detect file changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            apps:
              - 'apps/**'
            jobs:
              - 'jobs/**'
            shared:
              - 'shared/**'
            tests:
              - 'tests/**'
              # Operator scripts that an integration spec reads verbatim (for
              # "zero drift"): editing one must re-run its integration test, or
              # the drift guard is silently bypassed on a script-only PR.
              # tests/integration/relabel-rotation-direct-backfill.spec.js reads:
              - 'scripts/relabel-rotation-direct-backfill.sql'
              # tests/integration/format-qualifier-recovery.spec.js reads:
              - 'scripts/audit/bs_format_qualifier_recovery.sql'
              # tests/integration/bs-2117-crossreference-backfill.spec.js reads
              # (BS#2117 — its resolver + INSERT are executed verbatim):
              - 'scripts/audit/bs_2117_crossref_backfill.sql'
              # tests/integration/bs-replacement-char-cta.spec.js reads
              # (BS#2152 — every STMT block is executed verbatim). This one is
              # load-bearing beyond the usual drift guard: the script ships
              # with an empty PENDING CAPTURE block, and the spec's
              # "no quoted string literals" test is the gate that forces
              # whoever pastes the 14 real rows to add the deferred
              # byte-exact codepoint assertion in the same change. That gate
              # only fires if editing the .sql runs the integration suite —
              # and the paste PR touches nothing but scripts/audit/:
              - 'scripts/audit/bs_replacement_char_cta.sql'
            db-init:
              - 'dev_env/Dockerfile.init'
              - 'dev_env/init-db.mjs'
              - 'dev_env/format-pg-error.mjs'
              - 'dev_env/package.init.json'
              - 'dev_env/seed_db.sql'
              - 'shared/database/src/migrations/**'
              - 'shared/database/src/schema.ts'
            docs-only:
              - '**/*.md'
              - 'docs/**'
            mock-api:
              - 'dev_env/mock-api-server/**'
            src:
              - 'apps/**'
              - 'jobs/**'
              - 'shared/**'
              - 'tests/**'
              # `scripts/**` covers the ESM static-check + operator scripts
              # (`scripts/check-*.mjs`, `scripts/lib/*.mjs`, etc.). Prior to
              # BS#1590 R4-5 an edit here didn't trigger `lint-and-typecheck`
              # or `unit-tests`, which meant a broken ES-module import in a
              # script had no CI signal — the script's own pre-push hook
              # would still run in dev, but a script-only PR could green-CI
              # its way to `main` with the module unloadable.
              - 'scripts/**'
              - 'dev_env/mock-api-server/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              # BS#1807: `tests/unit/scripts/ci-env-surface-parity.test.ts`
              # (BS#958) diffs these two files' env-var surfaces against
              # each other. Without them in `src`, a PR that edits only one
              # of them skips `unit-tests` entirely — the guard for these
              # files never runs on a change to the exact files it checks.
              #
              # BS#2256 widened this from `.github/workflows/test.yml` to the
              # whole directory. `ci-node-modules-cache.test.ts` globs every
              # workflow file, so the same trap had reopened one file over:
              # a PR reverting `deploy-base.yml`'s cache key — the literal
              # defect that issue fixed — touched no `src` path, so
              # `unit-tests` never ran and the required check reported
              # `skipped`, which branch protection accepts as passing.
              #
              # Keep this a directory glob. Any guard that reads a workflow
              # file needs that file to trigger the job the guard runs in,
              # and enumerating them one at a time has now failed twice.
              - '.github/workflows/**'
              # BS#2267: the same requirement, one directory over.
              # `tests/unit/scripts/latest-tag-fetch.test.ts` reads
              # `.github/actions/latest_tag/action.yml` — it is the only
              # thing standing between a re-added `git fetch --tags` (or an
              # unanchored tag glob) and `main`. Composite actions are CI
              # logic that guards read, so glob the directory; the rest of
              # `.github/` is metadata no spec asserts on.
              - '.github/actions/**'
              - 'dev_env/docker-compose.yml'

      - name: Determine if integration tests should run
        id: should-run
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || \
                "${{ steps.changes.outputs.apps }}" == "true" || \
                "${{ steps.changes.outputs.jobs }}" == "true" || \
                "${{ steps.changes.outputs.shared }}" == "true" || \
                "${{ steps.changes.outputs.tests }}" == "true" ]]; then
            echo "run-integration=true" >> $GITHUB_OUTPUT
          else
            echo "run-integration=false" >> $GITHUB_OUTPUT
          fi

  # Fast lint and type check - always runs on code changes
  lint-and-typecheck:
    needs: detect-changes
    if: needs.detect-changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            jobs/*/node_modules
            shared/*/node_modules
          key: node-modules-v2-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Validate cached node_modules
        id: validate-cache
        if: steps.cache-node-modules.outputs.cache-hit == 'true'
        run: |
          if npm ls --depth=0 >/dev/null 2>&1; then
            echo "valid=true" >> $GITHUB_OUTPUT
          else
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "⚠️ Cache corrupted, will reinstall"
            rm -rf node_modules
          fi

      - name: Install Dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true' || steps.validate-cache.outputs.valid == 'false'
        run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Cache tool artifacts (tsc, ESLint, Prettier)
        uses: actions/cache@v6
        with:
          path: |
            .cache
            shared/database/.cache
            shared/authentication/.cache
            apps/backend/tsconfig.tsbuildinfo
            apps/auth/tsconfig.tsbuildinfo
          key: tool-cache-${{ runner.os }}-${{ hashFiles('eslint.config.mjs', '.prettierrc.json', 'tsconfig.base.json', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            tool-cache-${{ runner.os }}-${{ hashFiles('eslint.config.mjs', '.prettierrc.json', 'tsconfig.base.json', 'package-lock.json') }}-
            tool-cache-${{ runner.os }}-

      - name: Type check
        run: npm run typecheck

      # BS#2009: `npm run typecheck` above covers apps/**, shared/**, and
      # @wxyc/database only — jobs/** is out of scope (repo convention; ~20
      # other jobs would surface an unknown pile of errors if typecheck's
      # coverage were widened wholesale, see the CLAUDE.md testing-scope
      # note). This job shipped with two TS2554s neither `npm run
      # typecheck` nor its `tsup --minify` build (esbuild, transpile-only)
      # ever caught, so CI stayed green on a non-compiling job. Narrow,
      # per-job coverage instead of a fleet-wide typecheck expansion; the
      # `@wxyc/database` + `@wxyc/lml-client` deps this job needs are
      # already built by the `Type check` step above (its `lint:prebuild`
      # dependency).
      - name: 'Type check: va-apple-music-url-remediation (BS#2009)'
        run: npm run typecheck --workspace=jobs/va-apple-music-url-remediation

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Validate migration journal
        run: npm run lint:migrations

      - name: Cross-cache-identity flag-doc consistency
        run: scripts/check-cross-cache-identity-flags.sh

      - name: Migration guards (cross-cache-identity)
        run: scripts/check-precondition-guards.sh

      - name: legacy_entry_id writes (three-use invariant)
        run: node scripts/check-legacy-entry-id-writes.mjs

      - name: LML caller classification (policy invariant)
        run: node scripts/check-lml-caller-classification.mjs

      - name: Bulk UPDATE + ANALYZE pairing (BS#934)
        run: node scripts/check-bulk-update-analyze.mjs --strict

      - name: Build
        run: npm run build

  # Auth-tables doc drift (BS#1573). Runs unconditionally on every PR
  # rather than behind a paths filter: the script is zero-dep, ~1s, and
  # this job is a required status check on `main` (BS#1587), which means
  # every PR needs it to reach a terminal state. A paths-filter `if:`
  # would leave it skipped on unrelated PRs, and branch protection treats
  # a required check reporting `conclusion=skipped` as passing — a silent
  # bypass this whole check was written to close. No `npm ci`; the script
  # has no dependencies.
  auth-tables-doc-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Auth-tables doc drift (BS#1573)
        run: node scripts/check-auth-tables-doc.mjs

  # Runs the WHOLE unit suite, deliberately -- do not reintroduce Jest's
  # affected-tests mode (`--changedSince`) here. Selection is built from the
  # module dependency graph, so a spec that reads a source file as text
  # (`fs.readFileSync`) instead of importing it has no edge and is never
  # selected by a change to the file it guards. Measured on BS#2249: a change
  # to `shared/database/src/schema.ts` selected 250 suites and only 3 of the
  # 31 `tests/unit/database/schema.*` specs written to guard that very file;
  # `shared/authentication/src/auth.definition.ts` selected 1 suite and none
  # of its 5 guards. That hole let BS#2246 merge green while breaking 5
  # assertions in `schema.fk-cascades.test.ts`.
  #
  # The optimization was also buying nothing. This job gates no other job
  # (`Integration-Tests` needs `[detect-changes, lint-and-typecheck]`), and it
  # runs alongside `lint-and-typecheck`, which is consistently ~2x longer. The
  # full suite costs roughly +30s of runner time inside a minute of existing
  # slack, and the repo is public, so those minutes are free.
  unit-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            jobs/*/node_modules
            shared/*/node_modules
          key: node-modules-v2-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Validate cached node_modules
        id: validate-cache
        if: steps.cache-node-modules.outputs.cache-hit == 'true'
        run: |
          if npm ls --depth=0 >/dev/null 2>&1; then
            echo "valid=true" >> $GITHUB_OUTPUT
          else
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "⚠️ Cache corrupted, will reinstall"
            rm -rf node_modules
          fi

      - name: Install Dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true' || steps.validate-cache.outputs.valid == 'false'
        run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Run unit tests
        run: npm run test:unit:coverage

      - name: Upload Coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 7

  # Integration tests - only when backend/auth/shared/tests change
  # Note: Job always runs to report status, but steps are skipped when no relevant changes.
  # The services block starts PostgreSQL even when skipped -- this is unavoidable with GHA
  # service containers but harmless (starts in seconds, job exits immediately).
  Integration-Tests:
    needs: [detect-changes, lint-and-typecheck]
    # Run when lint-and-typecheck succeeds or was skipped (no src changes).
    # This ensures the required check reports status on docs-only PRs.
    #
    # `auth-tables-doc-drift` is enforced directly via
    # `required_status_checks.contexts` on `main` (BS#1587), so it no longer
    # needs to gate `Integration-Tests` via `needs:` + a synthetic failing
    # step. That prior scaffold (BS#1577 R4) worked around the branch-protection
    # quirk where a required check reporting `conclusion=skipped` was treated
    # as passing; with doc-drift a direct required context, its own failure
    # blocks merge regardless of Integration-Tests' result.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    services:
      # NOTE: postgres:18.0-alpine is newer than prod RDS (PostgreSQL 14.22)
      # -- a known, intentional skew (BS#1424), not drift. This job doesn't
      # validate migration syntax against prod's PG major; the
      # `migrate-dryrun` job below does, against a real RDS snapshot. See
      # docs/migrations.md#devci-postgres-version-vs-prod-rds-read-before-writing-ddl.
      postgres:
        image: postgres:18.0-alpine
        env:
          POSTGRES_USER: test-user
          POSTGRES_PASSWORD: test-pw
          POSTGRES_DB: wxyc_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      RUN_TESTS: ${{ needs.detect-changes.outputs.run-integration }}
      TEST_HOST: http://localhost
      DB_HOST: localhost
      DB_PORT: 5433
      DB_USERNAME: test-user
      DB_PASSWORD: test-pw
      DB_NAME: wxyc_db
      PORT: 8081
      AUTH_PORT: 8083
      AUTH_BYPASS: true
      BETTER_AUTH_URL: http://localhost:8083/auth
      BETTER_AUTH_JWKS_URL: http://localhost:8083/auth/jwks
      BETTER_AUTH_ISSUER: http://localhost:8083
      BETTER_AUTH_AUDIENCE: http://localhost:8083
      BETTER_AUTH_SECRET: ci-test-secret-key-for-jwt-signing
    steps:
      - name: Skip notification
        if: env.RUN_TESTS != 'true'
        run: echo "No relevant changes detected, skipping integration tests"

      - name: Checkout Code
        if: env.RUN_TESTS == 'true'
        uses: actions/checkout@v7

      - name: Set Up Node.js
        if: env.RUN_TESTS == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Cache node_modules
        if: env.RUN_TESTS == 'true'
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            jobs/*/node_modules
            shared/*/node_modules
          key: node-modules-v2-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Validate cached node_modules
        id: validate-cache
        if: env.RUN_TESTS == 'true' && steps.cache-node-modules.outputs.cache-hit == 'true'
        run: |
          if npm ls --depth=0 >/dev/null 2>&1; then
            echo "valid=true" >> $GITHUB_OUTPUT
          else
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "Cache corrupted, will reinstall"
            rm -rf node_modules
          fi

      - name: Install Dependencies
        if: env.RUN_TESTS == 'true' && (steps.cache-node-modules.outputs.cache-hit != 'true' || steps.validate-cache.outputs.valid == 'false')
        run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Lint .env file
        if: env.RUN_TESTS == 'true'
        run: npm run lint:env

      - name: Build
        if: env.RUN_TESTS == 'true'
        run: npm run build

      - name: Build mock API server
        if: env.RUN_TESTS == 'true'
        run: cd dev_env/mock-api-server && npm ci && npm run build

      - name: Initialize database
        if: env.RUN_TESTS == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          touch .env
          node dev_env/init-db.mjs

      - name: Start services
        if: env.RUN_TESTS == 'true'
        env:
          NODE_ENV: test
          USE_MOCK_SERVICES: 'false'
          # CORS fails closed when FRONTEND_SOURCE is unset (BS#1107). The
          # integration suite never asserts CORS headers, but set it
          # explicitly so both services take the configured-origin path and
          # startup logs stay clean. Matches the ci-profile compose default
          # in dev_env/docker-compose.yml.
          FRONTEND_SOURCE: http://localhost:3000
          ANON_DEVICE_JWT_SECRET: ci-test-secret-key-for-anonymous-devices
          LIBRARY_METADATA_URL: http://localhost:9090
          SLACK_WEBHOOK_URL: http://localhost:9090
          SLACK_WXYC_REQUESTS_WEBHOOK: /services/T00/B00/ci-test-webhook
          TUBAFRENZY_URL: http://localhost:9090
          MIRROR_API_KEY: ci-test-mirror-key
          MOCK_API_PORT: '9090'
          # Internal endpoints (ETL notify, tubafrenzy webhook).
          # authenticateInternal() fails closed on an empty key, so the
          # tubafrenzy-webhook integration spec needs this wired explicitly.
          # Matches the spec's INTERNAL_KEY fallback default.
          ETL_NOTIFY_KEY: test-secret-key
          # BS#1261 — request-line ban CRUD + check-request-ban bucketing.
          # Same shape as ETL_NOTIFY_KEY but distinct env var.
          ROM_INTERNAL_KEY: test-rom-secret-key
          # LML client limiter: disable in CI. The integration suite runs
          # hundreds of fire-and-forget /lookup calls across spec files under
          # --runInBand; the module-level TokenBucket(50/min) would drain
          # partway through and subsequent calls would queue ~1200ms each,
          # timing out metadata-lml tests at 30s (BS#955). Mirrors the
          # unit-test override convention at
          # tests/unit/services/lml.client.test.ts:792-793.
          LML_CLIENT_MAX_CONCURRENT: '10000'
          LML_CLIENT_RATE_PER_MIN: '60000'
          # BS#1748: raise the breaker threshold effectively out of reach so a
          # burst of simulated LML timeouts in one --runInBand spec can't open
          # the process-wide breaker and leak the 30 s open window into later
          # specs.
          LML_BREAKER_FAILURE_THRESHOLD: '1000000'
          # Default org wiring: matches the slug seeded by dev_env/seed_db.sql.
          # Consumed by the org-sync hooks and the user.create.after
          # auto-membership hook in shared/authentication/src/auth.definition.ts.
          # Without this, those hooks log a warning and no-op, which the
          # auth-auto-membership integration spec specifically exercises.
          DEFAULT_ORG_SLUG: test-org
          # Catalog-search alias LATERAL: align GHA with the ci-profile
          # docker-compose default (dev_env/docker-compose.yml:245). Without
          # this, `getCatalogSearchAliasConfig().enabled` is false in CI and
          # tests/integration/library-search-alias.spec.js's BS#1269 +
          # BS#1383 cases either silently warn-skip (the OHSEES test) or
          # fail-fast (the discogs_member test). The flag has been on by
          # default in `npm run ci:testmock` since BS#1269 landed; this
          # closes the GHA-vs-compose drift that surfaced when BS#1383
          # promoted its case from warn-skip to fail-fast.
          CATALOG_SEARCH_ALIAS_ENABLED: 'true'
          # Catalog track-search cascade: same GHA-vs-compose drift as the alias
          # flag above (dev_env/docker-compose.yml:261-262 default both to true,
          # and both have been on in prod since 2026-05-21). Both are strict-'true'
          # gated in apps/backend/config/catalogTrackSearch.ts and default false,
          # so without these the cascade cases in
          # tests/integration/library-legacy-release-id-exposure.spec.js take
          # their warn-and-return branch and pass vacuously — leaving
          # searchLibraryByTrackUncachedOrThrow, the one BS#2128 site where the
          # column was previously destructured away, with no gating coverage.
          CATALOG_TRACK_SEARCH_CTA_ENABLED: 'true'
          CATALOG_TRACK_SEARCH_DISCOGS_ENABLED: 'true'
          # SES has a 200-message/month quota. The auth service (host process
          # here) is the only sendEmail/sendOTPEmail caller; keep real sends
          # off regardless of whether AWS_ACCESS_KEY_ID etc. are ever set on
          # this job. See shared/authentication/src/email.ts
          # `isEmailSendingEnabled`.
          EMAIL_ENABLED: 'false'
        run: |
          node dev_env/mock-api-server/dist/server.js > /tmp/mock-api.log 2>&1 &
          node apps/auth/dist/app.js > /tmp/auth.log 2>&1 &
          node apps/backend/dist/app.js > /tmp/backend.log 2>&1 &
          timeout 30 bash -c 'until curl -sf http://localhost:9090/_admin/health > /dev/null 2>&1; do sleep 1; done'
          timeout 30 bash -c 'until curl -sf http://localhost:8083/healthcheck > /dev/null 2>&1; do sleep 1; done'
          timeout 30 bash -c 'until curl -sf http://localhost:8081/healthcheck > /dev/null 2>&1; do sleep 1; done'

      - name: Run Integration Tests
        if: env.RUN_TESTS == 'true'
        # Note: Tests must run sequentially (--runInBand) because they share
        # show state, DJ sessions, and flowsheet entries. Parallel execution
        # causes tests to interfere with each other's join/leave operations.
        env:
          # BS#133: enable the admin-ban integration tests on gating CI.
          # getAdminToken() (tests/utils/anonymous_auth.js) signs in as the
          # dedicated test_station_manager fixture account, not the shared
          # AUTH_USERNAME/AUTH_PASSWORD (test_dj1, a plain DJ used elsewhere
          # to assert permission boundaries) — so this flag doesn't need an
          # admin credential wired in here. Deliberately scoped to this step
          # (not the job- or workflow-level env) so it's outside the three
          # scopes tests/unit/scripts/ci-env-surface-parity.test.ts diffs
          # against dev_env/docker-compose.yml; the local ci:testmock flow
          # is untouched by this change.
          TEST_ADMIN_BAN: 'true'
        run: npm run ci:test

      - name: Show service logs on failure
        if: env.RUN_TESTS == 'true' && failure()
        run: |
          echo "=== Mock API Server Log ==="
          cat /tmp/mock-api.log || true
          echo ""
          echo "=== Auth Service Log ==="
          cat /tmp/auth.log || true
          echo ""
          echo "=== Backend Service Log ==="
          cat /tmp/backend.log || true

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        if: env.RUN_TESTS == 'true' && always()
        with:
          name: integration-test-coverage
          path: coverage/
          retention-days: 14

  # Pre-flight migrate-dryrun: restores the most recent automated RDS
  # snapshot to a sandbox DB instance and runs `node scripts/dryrun-migrate.mjs`
  # against it. Catches preconditions that depend on prod data shape (e.g.
  # the `RAISE EXCEPTION` guards added per WXYC/Backend-Service#705) at
  # PR-review time rather than at deploy time. See WXYC/Backend-Service#726.
  #
  # Requires repo-level secrets (one-time ops setup):
  #   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION — already present
  #     for the deploy workflow; needs additional rds:* permissions plus
  #     ec2:AuthorizeSecurityGroupIngress / ec2:RevokeSecurityGroupIngress
  #     on SGs tagged Purpose=migrate-dryrun (#757).
  #   PROD_DB_ID — RDS instance identifier of the prod DB.
  #   PROD_DB_NAME, PROD_DB_USERNAME, PROD_DB_PASSWORD — match the source
  #     instance's master credentials (snapshots restore with the source's
  #     master user).
  #   SG_DRYRUN_GHA — security group id. Created tagged Purpose=migrate-dryrun
  #     by scripts/provision-dryrun-aws.mjs. The job authorizes its
  #     runner's /32 just-in-time and revokes it in always() teardown,
  #     so the SG carries no persistent ingress rules between runs.
  #     See WXYC/Backend-Service#726 (preflight) and #757 (JIT ingress).
  #
  # This job also hosts the schema-shape probe (#703, folded in here by #1982).
  # The probe answers "how many rows that exist in prod TODAY would this new
  # constraint reject" and posts the answer as a PR comment. It lives here
  # because this job already restores exactly that data, so the report needs no
  # standing staging credential — #703's `STAGING_DATABASE_URL_RO` was never
  # provisioned and #1982 chose the fold over minting a new long-lived secret.
  #
  # Two invariants for anyone editing the probe steps:
  #   1. The probe MUST run before `Run drizzle:migrate against sandbox`. After
  #      the migrations apply, the count is zero by construction (or the
  #      migration failed) and the report is worthless.
  #   2. The probe is ADVISORY and must never fail this job. `Migration Dry-Run
  #      (prod-shaped data)` is a required status check whose real job is
  #      catching DDL that prod data rejects; a flaky reporting nicety must not
  #      be able to block every merge. Hence `continue-on-error: true` on every
  #      probe step. The loud-on-regression half of #1982 lives in the separate
  #      `schema-shape-report.yml` self-test, which has no DB and no AWS spend.
  migrate-dryrun:
    name: Migration Dry-Run (prod-shaped data)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.db-init == 'true'
    runs-on: ubuntu-latest
    # Widened from the workflow-level `contents: read` floor solely so the
    # probe can post its report. No other job in this file writes via
    # GITHUB_TOKEN. See docs/deploy.md "CI workflow pin maintenance".
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # Full history so the shape-probe diff step below can find the merge
          # base. `ref` is deliberately left at the default (the PR merge
          # commit) — the dry-run must apply migrations as they would land on
          # main, not as they sit on the head branch.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install minimal deps for dryrun script
        # postgres + drizzle-orm are the only runtime imports the script
        # needs. The `--workspaces=false` flag skips workspace resolution
        # so npm doesn't try to fetch the `@wxyc/shared` workspace dep
        # from GitHub Packages — that lookup needs NPM_TOKEN, and even
        # with the token wired in, install + resolution costs ~30s of
        # CI time we don't need here. The script imports
        # `../dev_env/format-pg-error.mjs` by relative path, so it
        # doesn't need anything inside dev_env to be npm-installed.
        run: npm install --workspaces=false --no-save --no-package-lock --no-audit --no-fund postgres drizzle-orm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Compute schema diff for shape probe
        # Cheap and DB-free, so it runs before any AWS spend — if the diff
        # can't be computed we'd rather know now. Advisory (see the job header):
        # a git hiccup here must not fail the migration gate.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p .cache
          BASE_REF='${{ github.event.pull_request.base.ref }}'
          # Resolve the merge base off FETCH_HEAD rather than a
          # `refs/remotes/origin/*` tracking ref: `actions/checkout` does not
          # guarantee it configures the tracking refspec, but `git fetch`
          # always writes FETCH_HEAD. Works whether HEAD is the PR merge
          # commit (today's default) or the head commit.
          git fetch --no-tags origin "$BASE_REF"
          MERGE_BASE=$(git merge-base FETCH_HEAD HEAD)
          git diff "$MERGE_BASE" HEAD -- \
            'shared/database/src/schema.ts' \
            'shared/database/src/migrations/*.sql' \
            > .cache/pr.diff
          echo "shape-probe diff: $(wc -c < .cache/pr.diff) bytes against $MERGE_BASE"

      - name: Configure AWS credentials
        # Long-lived AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY pattern
        # already used by .github/workflows/deploy-base.yml (lines 246, 254,
        # 265, 329, 337, 363, 454). Migrating to OIDC is a separate concern.
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Authorize runner IP on SG_DRYRUN_GHA
        # GitHub Actions runners pull from a pool of ~3000 egress CIDRs that
        # rotate monthly (api.github.com/meta `.actions`). The default AWS
        # SG rule limit is 60, so bulk-authorizing the entire pool is not
        # an option. Instead, authorize just this run's runner IP /32 here
        # and revoke it in the always() teardown step below. Net result:
        # SG carries one transient rule per concurrent run; quota usage is
        # bounded by run concurrency (db-init paths change rarely, so this
        # stays well under 60 in practice).
        run: |
          set -euo pipefail
          RUNNER_IP=$(curl -sS --max-time 10 https://checkip.amazonaws.com | tr -d '[:space:]')
          if [[ ! "$RUNNER_IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "checkip.amazonaws.com returned unexpected payload: ${RUNNER_IP}" >&2
            exit 1
          fi
          echo "RUNNER_IP=${RUNNER_IP}" >> "$GITHUB_ENV"
          # Tolerate InvalidPermission.Duplicate so a re-run that hits the
          # same runner is a no-op rather than a hard failure.
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.SG_DRYRUN_GHA }}" \
            --protocol tcp --port 5432 \
            --cidr "${RUNNER_IP}/32" \
            2> >(grep -v 'InvalidPermission.Duplicate' >&2) \
            || aws ec2 describe-security-groups \
              --group-ids "${{ secrets.SG_DRYRUN_GHA }}" \
              --query "SecurityGroups[0].IpPermissions[?FromPort==\`5432\`].IpRanges[?CidrIp=='${RUNNER_IP}/32']" \
              --output text | grep -q "${RUNNER_IP}"

      - name: Restore latest prod snapshot to ephemeral sandbox
        id: restore
        # The sandbox lands in the dedicated `wxyc-dryrun-public` subnet
        # group rather than inheriting prod's. Prod's subnet group is all
        # private — `--publicly-accessible` is silently ineffective there
        # (no IGW route, no public IP). The dedicated group covers public
        # subnets so the sandbox gets a real public IP and the GHA runner
        # can reach it. Ingress is gated by SG_DRYRUN_GHA; the JIT-authorize
        # step above adds this runner's /32 just before the connection.
        # The sandbox, the SG rule, and the subnet-group reference are
        # all torn down in the always-run steps below.
        run: |
          set -euo pipefail
          # Filter to Status==available so we don't pick up a snapshot
          # AWS is still mid-creating (RDS's automated-backup window
          # raced this step on PR #1348 / run 27185185066 → exit 254
          # 'DBSnapshot must have state available but actually has
          # creating'). The trailing `[-1]` then gives the most-recent
          # *available* snapshot.
          # Resolved in one call (two `describe` calls could straddle a new
          # snapshot appearing) and split with `cut` rather than `read`, which
          # returns non-zero at EOF and would trip `set -e`.
          SNAPSHOT_INFO=$(aws rds describe-db-snapshots \
            --db-instance-identifier "${{ secrets.PROD_DB_ID }}" \
            --snapshot-type automated \
            --query 'sort_by(DBSnapshots[?Status==`available`], &SnapshotCreateTime)[-1].[DBSnapshotIdentifier,SnapshotCreateTime]' \
            --output text)
          SNAPSHOT_ID=$(printf '%s' "$SNAPSHOT_INFO" | cut -f1)
          SNAPSHOT_TIME=$(printf '%s' "$SNAPSHOT_INFO" | cut -f2)
          # SnapshotCreateTime, NOT the snapshot identifier, is what the shape
          # probe renders as provenance. Automated snapshot ids are formatted
          # `rds:<db-instance-identifier>-<timestamp>`, so echoing one into a
          # PR comment would publish the prod instance identifier that
          # `secrets.PROD_DB_ID` exists to keep out of this PUBLIC repo.
          # GITHUB_TOKEN secret-masking does not cover an API request body.
          echo "SNAPSHOT_TIME=$SNAPSHOT_TIME" >> "$GITHUB_ENV"
          SANDBOX_ID="dryrun-${{ github.run_id }}"
          echo "SANDBOX_ID=$SANDBOX_ID" >> "$GITHUB_ENV"
          aws rds restore-db-instance-from-db-snapshot \
            --db-instance-identifier "$SANDBOX_ID" \
            --db-snapshot-identifier "$SNAPSHOT_ID" \
            --db-instance-class db.t4g.micro \
            --publicly-accessible \
            --db-subnet-group-name wxyc-dryrun-public \
            --vpc-security-group-ids "${{ secrets.SG_DRYRUN_GHA }}"
          aws rds wait db-instance-available --db-instance-identifier "$SANDBOX_ID"
          ENDPOINT=$(aws rds describe-db-instances \
            --db-instance-identifier "$SANDBOX_ID" \
            --query 'DBInstances[0].Endpoint.Address' --output text)
          echo "DB_HOST=$ENDPOINT" >> "$GITHUB_ENV"

      - name: Probe pre-migration data shape
        # ORDER IS LOAD-BEARING: this must stay above `Run drizzle:migrate`.
        # The report's only claim is "N rows that exist in prod today would be
        # rejected"; once the migrations apply, N is 0 by construction.
        #
        # Advisory: `continue-on-error` plus the script's own never-throw
        # contract mean neither a probe crash nor an unreachable sandbox can
        # redden the required migration gate. The script emits a
        # comment-shaped blob and exits 0 for every business-logic failure
        # (no target, query error, timeout); a non-zero exit means it could
        # not start at all, and we still hand the reader that fact rather
        # than a silent no-op.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        # Hard ceiling so a hung probe cannot hold the sandbox open until the
        # job's 6-hour default timeout. The script's own limits (10s connect,
        # 30s per statement) should keep it far under this.
        timeout-minutes: 5
        env:
          SHAPE_PROBE_DB_HOST: ${{ env.DB_HOST }}
          SHAPE_PROBE_DB_PORT: '5432'
          SHAPE_PROBE_DB_NAME: ${{ secrets.PROD_DB_NAME }}
          SHAPE_PROBE_DB_USERNAME: ${{ secrets.PROD_DB_USERNAME }}
          SHAPE_PROBE_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          SHAPE_PROBE_SNAPSHOT_LABEL: >-
            automated prod RDS snapshot ${{ env.SNAPSHOT_TIME }}, restored to
            ephemeral sandbox for run ${{ github.run_id }}
        run: |
          set +e
          node scripts/schema-shape-report.mjs --diff .cache/pr.diff > .cache/comment.md 2> .cache/script.err
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -ne 0 ]; then
            ERR_TEXT=$(tr '\n' ' ' < .cache/script.err | sed 's/[][`*_]//g' | head -c 300)
            cat > .cache/comment.md <<EOF
          <!-- wxyc-schema-shape-report -->
          ## Schema constraint shape report

          _data-shape report errored (exit $EXIT_CODE): ${ERR_TEXT:-no stderr captured}; manual check required_
          EOF
            echo "::warning title=Schema shape probe failed::schema-shape-report.mjs exited $EXIT_CODE; the migration dry-run itself is unaffected"
            cat .cache/script.err >&2
          fi

      - name: Run drizzle:migrate against sandbox
        env:
          DB_HOST: ${{ env.DB_HOST }}
          DB_PORT: '5432'
          DB_NAME: ${{ secrets.PROD_DB_NAME }}
          DB_USERNAME: ${{ secrets.PROD_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        run: node scripts/dryrun-migrate.mjs

      - name: Revoke runner IP from SG_DRYRUN_GHA
        # Always runs so a failure in any earlier step still cleans up the
        # transient ingress rule. The guard on RUNNER_IP handles the case
        # where the authorize step failed before the env var was written.
        if: always()
        run: |
          if [ -n "${RUNNER_IP:-}" ]; then
            aws ec2 revoke-security-group-ingress \
              --group-id "${{ secrets.SG_DRYRUN_GHA }}" \
              --protocol tcp --port 5432 \
              --cidr "${RUNNER_IP}/32" \
              2> >(grep -v 'InvalidPermission.NotFound' >&2) \
              || true
          fi

      - name: Tear down sandbox
        # The guard on SANDBOX_ID handles the case where restore failed
        # before the env var was written; without it, delete-db-instance
        # would error and obscure the actual failure.
        if: always()
        run: |
          if [ -n "${SANDBOX_ID:-}" ]; then
            aws rds delete-db-instance \
              --db-instance-identifier "$SANDBOX_ID" \
              --skip-final-snapshot \
              --delete-automated-backups
          fi

      - name: Post or update schema-shape comment
        # Deliberately the LAST step in the job, after both teardown steps.
        # Posting a comment is the least important thing this job does and the
        # only step that talks to a third-party API on the happy path; running
        # it after teardown means GitHub API latency, rate limiting, or an
        # outright failure can never delay or skip the RDS cleanup.
        #
        # `always()` so a failed dry-run still reports its (pre-migration)
        # numbers — that is precisely the case where a reviewer wants them.
        # `continue-on-error` so a comment we cannot post never reddens the
        # required check. Silently skips when the probe produced nothing
        # (e.g. the restore failed, so there was never anything to probe):
        # a stale-but-honest previous comment beats overwriting it with noise
        # about an infrastructure failure the red check already reports.
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- wxyc-schema-shape-report -->';
            if (!fs.existsSync('.cache/comment.md')) {
              core.info('No shape report was produced this run; leaving any existing comment untouched.');
              return;
            }
            const body = fs.readFileSync('.cache/comment.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing =
              comments.find((c) => c.user?.type === 'Bot' && c.body && c.body.includes(marker)) ||
              comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
