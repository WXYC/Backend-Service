version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    groups:
      # `better-call` belongs here, not in dev-dependencies: `@better-auth/core`
      # peer-depends on it by EXACT version (1.6.26 pins 1.3.7; 1.7.1 pins 1.4.0),
      # so a solo bump of either one can't produce a hoisted tree. npm satisfies
      # the contradiction by duplicating the whole auth stack into per-workspace
      # `node_modules` instead of failing, which is silent -- both halves install,
      # both halves typecheck, and the split only shows up by reading the lockfile.
      # Grouping them means the peer is always bumped by the same PR. See #2180
      # and #2247, which were exactly this split in both directions at once.
      better-auth:
        patterns:
          - 'better-auth'
          - 'better-call'
          - '@better-auth/*'
      drizzle:
        patterns:
          - 'drizzle-orm'
          - 'drizzle-kit'
      wxyc-shared:
        patterns:
          - '@wxyc/shared'
      dev-dependencies:
        dependency-type: 'development'
        exclude-patterns:
          - 'better-auth'
          - 'better-call'
          - '@better-auth/*'
          - 'drizzle-orm'
          - 'drizzle-kit'
          - '@wxyc/shared'
      production-dependencies:
        dependency-type: 'production'
        exclude-patterns:
          - 'better-auth'
          - 'better-call'
          - '@better-auth/*'
          - 'drizzle-orm'
          - 'drizzle-kit'
          - '@wxyc/shared'
    ignore:
      # Hold TypeScript at v6: ts-jest (peers <7) and typescript-eslint (peers <6.1)
      # have no TS7-compatible release yet (checked 2026-07-16). A grouped major bump
      # to typescript@7 fails `npm ci` with ERESOLVE before tests run. Lift this and
      # upgrade TypeScript as a tracked change once the toolchain supports TS7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Hold better-auth at 1.6.x: 1.7.0 REMOVED the `oidcProvider` plugin
      # outright -- `./plugins/oidc-provider` is gone from the package exports and
      # no replacement is published (`@better-auth/oidc-provider` 404s). The build
      # fails at `auth.definition.ts:28` with TS2724, and the plugin backs three
      # live tables plus four unit tests that read its own source. #2180 is the
      # bump this blocks; #2251 is the migration.
      #
      # This entry stops dependabot re-proposing it, but note the ranges are
      # `^1.6.26`, which ADMITS 1.7.1 -- only package-lock.json holds the line, so
      # any lockfile-less `npm install` still pulls the broken version. Lifting
      # this ignore is part of #2251, which also decides whether the ranges should
      # say `~1.6.26` instead.
      - dependency-name: 'better-auth'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      # The better-auth 1.6.25 hold is gone: 1.6.25 tightened client-plugin
      # option inference so jwtClient() no longer satisfied BetterAuthClientPlugin
      # and `npm run typecheck` failed in shared/authentication/src/auth.client.ts
      # (TS2322, upstream better-auth#10515, see closed PR #1834). 1.6.26 restores
      # compatibility and we are on it as of #2043, so the pin has nothing left to
      # hold back -- dependabot only ever proposes forward, never down to 1.6.25.

  # The CI mock API server carries its own package-lock.json, and the root `/`
  # entry above does NOT cover it -- dependabot scopes an npm entry to the
  # directory's own manifest tree, and this one is outside the root workspaces
  # globs (apps/*, jobs/*, shared/*). Without this entry GitHub still *files*
  # alerts against dev_env/mock-api-server/package-lock.json but no PR is ever
  # raised to clear them, so they accrue silently regardless of severity. That
  # is how the body-parser alert sat open (BS#2043).
  - package-ecosystem: 'npm'
    directory: '/dev_env/mock-api-server'
    schedule:
      interval: 'weekly'
      day: 'monday'
    groups:
      mock-api-server:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
