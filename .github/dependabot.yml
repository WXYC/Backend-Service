version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    groups:
      better-auth:
        patterns:
          - 'better-auth'
          - '@better-auth/*'
      drizzle:
        patterns:
          - 'drizzle-orm'
          - 'drizzle-kit'
      wxyc-shared:
        patterns:
          - '@wxyc/shared'
      dev-dependencies:
        dependency-type: 'development'
        exclude-patterns:
          - 'better-auth'
          - '@better-auth/*'
          - 'drizzle-orm'
          - 'drizzle-kit'
          - '@wxyc/shared'
      production-dependencies:
        dependency-type: 'production'
        exclude-patterns:
          - 'better-auth'
          - '@better-auth/*'
          - 'drizzle-orm'
          - 'drizzle-kit'
          - '@wxyc/shared'
    ignore:
      # Hold TypeScript at v6: ts-jest (peers <7) and typescript-eslint (peers <6.1)
      # have no TS7-compatible release yet (checked 2026-07-16). A grouped major bump
      # to typescript@7 fails `npm ci` with ERESOLVE before tests run. Lift this and
      # upgrade TypeScript as a tracked change once the toolchain supports TS7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # The better-auth 1.6.25 hold is gone: 1.6.25 tightened client-plugin
      # option inference so jwtClient() no longer satisfied BetterAuthClientPlugin
      # and `npm run typecheck` failed in shared/authentication/src/auth.client.ts
      # (TS2322, upstream better-auth#10515, see closed PR #1834). 1.6.26 restores
      # compatibility and we are on it as of #2043, so the pin has nothing left to
      # hold back -- dependabot only ever proposes forward, never down to 1.6.25.

  # The CI mock API server carries its own package-lock.json, and the root `/`
  # entry above does NOT cover it -- dependabot scopes an npm entry to the
  # directory's own manifest tree, and this one is outside the root workspaces
  # globs (apps/*, jobs/*, shared/*). Without this entry GitHub still *files*
  # alerts against dev_env/mock-api-server/package-lock.json but no PR is ever
  # raised to clear them, so they accrue silently regardless of severity. That
  # is how the body-parser alert sat open (BS#2043).
  - package-ecosystem: 'npm'
    directory: '/dev_env/mock-api-server'
    schedule:
      interval: 'weekly'
      day: 'monday'
    groups:
      mock-api-server:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
